name: DominionStar Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run dist:windows
      - uses: actions/upload-artifact@v4
        with:
          name: DominionStar-Windows
          path: desktop/dist/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: DominionStar-macOS
          path: desktop/dist/
          if-no-files-found: error
