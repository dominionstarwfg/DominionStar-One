<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar Presenter Controls</title>
  <style>
    :root{color-scheme:dark;--panel:rgba(7,11,18,.975);--panel2:rgba(17,23,33,.985);--line:rgba(255,255,255,.12);--muted:#9da8b7;--text:#f7f9fc;--green:#20c96b;--green2:#16a957;--red:#ef3f4f;--red2:#ce2f3d;--gold:#e8bc49}
    *{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{padding:3px;user-select:none}button{font:inherit}
    .shell{width:max-content;max-width:calc(100vw - 6px);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-app-region:drag}
    .bar{height:60px;display:flex;align-items:center;padding:4px 5px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 16px 50px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.055);-webkit-backdrop-filter:blur(24px) saturate(145%);backdrop-filter:blur(24px) saturate(145%)}
    .controls{display:flex;align-items:center;gap:2px;-webkit-app-region:no-drag}.control{position:relative;width:58px;height:50px;padding:3px 2px;border:1px solid transparent;border-radius:9px;background:transparent;color:#f0f4f9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:background .13s ease,border-color .13s ease,transform .13s ease,color .13s ease}.control:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.07);transform:translateY(-1px)}.control:active{transform:none;background:rgba(255,255,255,.1)}.control svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.control small{font-size:8.5px;font-weight:690;line-height:1;white-space:nowrap;color:#d4dae3}.control:hover small{color:#fff}.people{width:70px}.meeting{width:76px}.annotate{width:66px}.layout{width:60px}.more{width:54px}.share{color:#54df8b}.pause.is-paused,.pause{color:#f4d36f}.annotate{color:#f4d36f}
    .share-rail{height:29px;min-width:420px;display:flex;align-items:stretch;border-radius:7px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.36);-webkit-app-region:no-drag}.share-live{min-width:300px;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 18px;background:linear-gradient(180deg,#27cf6f,#17ad58);color:#06170d;font-weight:820;letter-spacing:.005em}.share-live svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.share-stop{min-width:118px;border:0;background:linear-gradient(180deg,var(--red),var(--red2));color:#fff;font-weight:820;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}.share-stop:hover{filter:brightness(1.08)}.share-stop svg{width:13px;height:13px;fill:currentColor;stroke:none}
    .more-menu{position:fixed;right:8px;top:96px;width:214px;padding:7px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(22,29,42,.99),rgba(8,12,19,.995));box-shadow:0 22px 60px rgba(0,0,0,.58);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);-webkit-app-region:no-drag}.more-menu[hidden]{display:none}.more-menu button{display:flex;width:100%;align-items:center;gap:9px;padding:10px 11px;border:0;border-radius:9px;background:transparent;color:#eef3f8;text-align:left;font-size:10px;font-weight:680;cursor:pointer}.more-menu button:hover{background:rgba(255,255,255,.075)}.more-menu svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    body.collapsed .bar{display:none}body.collapsed .shell{gap:0}body.collapsed .share-rail{height:38px;min-width:305px;border-radius:11px}body.collapsed .share-live{min-width:205px;padding:0 12px}body.collapsed .share-stop{min-width:100px}.more-menu{display:block}body.collapsed .more-menu{display:none!important}button:focus{outline:none}button:focus-visible{outline:2px solid rgba(232,188,73,.85);outline-offset:1px}
  </style>
</head>
<body>
  <div class="shell" role="group" aria-label="Screen sharing controls">
    <div class="bar" role="toolbar" aria-label="Floating presenter toolbar">
      <div class="controls">
        <button class="control" data-command="audio" aria-label="Mute"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4M8.5 21h7"/></svg><small>Audio</small></button>
        <button class="control" data-command="video" aria-label="Stop Video"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg><small>Video</small></button>
        <button class="control people" data-command="participants" aria-label="Participants"><svg viewBox="0 0 24 24"><path d="M16 21v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V21M9 11a4 4 0 1 0 0-8M22 21v-1.5a4 4 0 0 0-3-3.8M16.5 3.3a4 4 0 0 1 0 7.4"/></svg><small>Participants</small></button>
        <button class="control" data-command="chat" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M21 14.5a4 4 0 0 1-4 4H9l-6 3V7.5a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg><small>Chat</small></button>
        <button class="control share" data-command="new-share" aria-label="Share"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M12 15V8M9 11l3-3 3 3"/></svg><small>Share</small></button>
        <button class="control pause" data-command="pause" aria-label="Pause Share"><svg viewBox="0 0 24 24"><path d="M8 6v12M16 6v12"/></svg><small>Pause</small></button>
        <button class="control layout" data-command="layout" aria-label="Layout"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M3 11h12"/></svg><small>Layout</small></button>
        <button class="control annotate" data-command="annotate" aria-label="Annotate"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg><small>Annotate</small></button>
        <button class="control meeting" data-command="show-meeting" aria-label="Show Meeting"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg><small>Show Meeting</small></button>
        <button class="control more" data-command="more" aria-label="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="19" cy="12" r="1.25"/></svg><small>More</small></button>
      </div>
    </div>
    <div class="share-rail" aria-live="polite">
      <div class="share-live"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M12 15V8M9 11l3-3 3 3"/></svg><span>You are screen sharing</span></div>
      <button type="button" class="share-stop" data-command="stop" aria-label="Stop share"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg><span>Stop Share</span></button>
    </div>
  </div>
  <div id="presenterMoreMenu" class="more-menu" hidden role="menu">
    <button type="button" data-command="reactions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14s1.3 2 3.5 2 3.5-2 3.5-2M9 9h.01M15 9h.01"/></svg>Reactions</button>
  </div>
  <script src="presenter-toolbar.js"></script>
</body>
</html>
