name: DominionStar Desktop OAuth Return Verification

on:
  pull_request:
    paths:
      - "assets/js/member-auth.js"
      - "assets/js/member-login.js"
      - "member-login/**"
      - "desktop 2/src/main-v2.mjs"
      - "desktop 2/package.json"
      - "desktop 2/scripts/test-desktop-google-oauth-return.mjs"
      - ".github/workflows/desktop-auth-return-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-desktop-oauth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Desktop OAuth direct-app code contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify direct desktop OAuth return path
        run: node "desktop 2/scripts/test-desktop-google-oauth-return.mjs"

      - name: Certify desktop deep-link prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const login=fs.readFileSync('assets/js/member-login.js','utf8');
          const main=fs.readFileSync('desktop 2/src/main-v2.mjs','utf8');
          const pkg=JSON.parse(fs.readFileSync('desktop 2/package.json','utf8'));
          if(!login.includes("const DESKTOP_OAUTH_CALLBACK = 'dominionstar://auth/callback';")) throw new Error('Direct desktop OAuth callback missing');
          if(!login.includes('redirectTo: DESKTOP_OAUTH_CALLBACK')) throw new Error('OAuth redirectTo does not use desktop callback');
          if(pkg.build?.protocols?.[0]?.schemes?.[0]!=='dominionstar') throw new Error('Desktop package does not register dominionstar protocol');
          if(!main.includes("app.setAsDefaultProtocolClient('dominionstar'")) throw new Error('Electron protocol registration missing');
          if(!main.includes("url.hostname === 'auth' && url.pathname === '/callback'")) throw new Error('Electron auth callback consumer missing');
          console.log('DOMINIONSTAR_DESKTOP_OAUTH_DIRECT_SCHEME_READY dominionstar://auth/callback');
          console.log('BACKEND_QA_GATE Supabase Additional Redirect URLs must include dominionstar://auth/callback');
          NODE
