name: DominionStar — One-Time Dependency Lock Review

on:
  push:
    branches:
      - review/notification-readability-20261029
    paths:
      - 'package.json'
      - '.github/workflows/dependency-lock-review.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.ref == 'refs/heads/review/notification-readability-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/notification-readability-20261029
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate pinned top-level dependencies
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const name of ['@supabase/supabase-js','resend','web-push']){
            const expected=pkg.dependencies[name];
            const actual=lock.packages?.['node_modules/'+name]?.version;
            if(actual!==expected)throw new Error(name+' lock mismatch: '+actual+' !== '+expected);
          }
          NODE
      - name: Commit generated lockfile to review branch
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "DominionStar Review Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generate deterministic npm dependency lockfile"
          git push origin HEAD:review/notification-readability-20261029
