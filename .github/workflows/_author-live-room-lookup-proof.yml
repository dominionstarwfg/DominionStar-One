name: Author Live Room Lookup Proof

on:
  push:
    branches:
      - fix/live-room-lookup-realtime-proof
    paths:
      - .github/workflows/_author-live-room-lookup-proof.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-room-lookup-realtime-proof
          fetch-depth: 0
      - name: Apply and test live-room proof candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_author_live_room_lookup_realtime_proof.py
          node --check assets/js/meeting-engine.js
          node --check assets/js/meet-next/executive6.js
          node --check netlify/functions/resolve-meeting-join.mjs
          node scripts/test-live-meet-lookup-proof.mjs
          node scripts/test-production-meet-rc13.mjs
      - name: Commit product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DominionStar Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/meeting-engine.js assets/js/meet-next/executive6.js \
            netlify/functions/resolve-meeting-join.mjs meet/index.html meet/release-contract.json \
            scripts/test-live-meet-lookup-proof.mjs scripts/test-production-meet-rc13.mjs
          git diff --cached --check
          git commit -m 'Add secure realtime fallback for web meeting lookup'
          git push origin HEAD:fix/live-room-lookup-realtime-proof
