name: DominionStar Meet Live Deployment Verification

on:
  push:
    branches:
      - main
    paths:
      - "assets/js/meeting-engine.js"
      - "assets/js/meet/**"
      - "assets/js/meet-next/**"
      - "assets/css/meet/**"
      - "assets/css/meet-next/**"
      - "meet/**"
      - "netlify/functions/**"
      - ".github/workflows/meet-live-deploy-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-meet-live-deploy
  cancel-in-progress: true

jobs:
  live-deployment:
    name: Prove Main Is Actually Live
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout deployed source of truth
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Wait for Netlify production release to match main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RELEASE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('meet/release-contract.json').read_text())['releaseId'])
          PY
          )
          echo "Expected production release: $EXPECTED_RELEASE"

          matched=0
          for attempt in $(seq 1 24); do
            nonce="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl -fsSL --retry 1 --connect-timeout 10 --max-time 25 \
              "https://dominionstarld.com/meet/release-contract.json?verify=${nonce}" \
              -o /tmp/live-contract.json; then
              LIVE_RELEASE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('/tmp/live-contract.json').read_text()).get('releaseId',''))
          except Exception:
              print('')
          PY
              )
              echo "Attempt ${attempt}: live release=${LIVE_RELEASE:-invalid}"
              if [ "$LIVE_RELEASE" = "$EXPECTED_RELEASE" ]; then
                matched=1
                break
              fi
            else
              echo "Attempt ${attempt}: live contract fetch failed"
            fi
            sleep 15
          done

          if [ "$matched" -ne 1 ]; then
            echo "ERROR: production never advanced to $EXPECTED_RELEASE within the verification window." >&2
            exit 1
          fi

      - name: Verify live production bytes match release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/expected-files.tsv
          import json
          from pathlib import Path
          c=json.loads(Path('meet/release-contract.json').read_text())
          for rel in [
              'assets/js/meeting-engine.js',
              'assets/js/meet-next/executive6.js',
              'assets/js/meet/dock-layout-v2.js',
              'meet/index.html',
          ]:
              print(f"{rel}\t{c['files'][rel]}")
          PY

          while IFS=$'\t' read -r rel expected; do
            nonce="${GITHUB_SHA}-$(date +%s%N)"
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
              "https://dominionstarld.com/${rel}?verify=${nonce}" \
              -o /tmp/live-file
            actual=$(sha256sum /tmp/live-file | awk '{print $1}')
            echo "$rel live=$actual expected=$expected"
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: live $rel does not match the certified main release." >&2
              exit 1
            fi
          done < /tmp/expected-files.tsv

      - name: Verify live Meeting ID resolver contract
        shell: bash
        run: |
          set -euo pipefail
          # Use a run-derived room ID so this check does not depend on a real user's
          # meeting. A missing room is healthy only when the deployed function
          # explicitly hands the browser to secure live-room verification.
          room=$(python3 - <<'PY'
          import os
          value=''.join(ch for ch in os.environ.get('GITHUB_RUN_ID','') if ch.isdigit())[-10:]
          print((value or '9876543210').zfill(10))
          PY
          )
          printf '{"room":"%s","passcode":"000000"}\n' "$room" >/tmp/live-lookup-request.json
          code=$(curl -sS -o /tmp/live-lookup-response.json -w '%{http_code}' \
            --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'content-type: application/json' \
            --data-binary @/tmp/live-lookup-request.json \
            'https://dominionstarld.com/.netlify/functions/resolve-meeting-join')
          echo "Live resolver HTTP $code"
          python3 - "$code" <<'PY'
          import json,sys
          code=int(sys.argv[1])
          data=json.load(open('/tmp/live-lookup-response.json'))
          print('Live resolver response keys:',sorted(data.keys()))
          if code==200:
              if data.get('found') is not True:
                  raise SystemExit('HTTP 200 resolver response did not identify a meeting')
          elif code in (404,503):
              if data.get('live_verification') is not True:
                  raise SystemExit(f'HTTP {code} resolver response did not provide secure live-verification handoff')
          else:
              raise SystemExit(f'Unexpected live resolver HTTP {code}: {data}')
          print('LIVE_MEETING_LOOKUP_CONTRACT_OK')
          PY

      - name: Verify desktop compatibility against the deployed release
        working-directory: desktop 2
        run: bash scripts/audit-live-hosted-runtime.sh