name: DominionStar Meet 2.0.55 Isolated QA

on:
  push:
    branches: [cleanup/meeting-ownership-audit-20261014]
    paths:
      - 'meet-desktop/**'
      - '.github/workflows/meet-2.0.55-isolated-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-meet-2-0-55-isolated-qa
  cancel-in-progress: true

jobs:
  compatibility:
    name: Two-client Chromium compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QA identity and browser signaling parity
        run: |
          node meet-desktop/scripts/verify-qa-isolation-and-layout-20261022.mjs
          node meet-desktop/scripts/verify-physical-media-fallback-20261016.mjs
          node meet-desktop/scripts/verify-meeting-exit-signaling-20261016.mjs
          node meet-desktop/scripts/verify-ice-relay-escalation-20261016.mjs
          node meet-desktop/scripts/verify-live-share-gate-20261014.mjs --self-test
      - name: Install isolated browser test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium test browser
        run: npx playwright install --with-deps chromium
      - name: Exercise two independent WebRTC clients
        run: node meet-desktop/scripts/test-two-client-webrtc-2.0.41.mjs

  mac-candidate:
    name: Separately identified macOS QA installer
    needs: [compatibility]
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identity, app entrypoint, code syntax
        run: |
          node meet-desktop/scripts/verify-qa-isolation-and-layout-20261022.mjs
          node --check meet-desktop/src/bootstrap.mjs
          node --check meet-desktop/src/main.mjs
          node --check meet-desktop/ui/webrtc-controller.js
          node --check meet-desktop/ui/runtime-stability.js
          node --check meet-desktop/ui/zoom-participants-reference-2.0.41.js
          node meet-desktop/scripts/verify-peer-negotiation-20261014.mjs
      - name: Install build dependencies
        working-directory: meet-desktop
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build universal isolated QA application
        working-directory: meet-desktop
        run: npx electron-builder --mac dir --universal --publish never
      - name: Verify separate QA app identity and signature
        id: artifact
        shell: bash
        run: |
          APP="$(find meet-desktop/dist -maxdepth 3 -type d -name 'DominionStar Meet QA.app' -print -quit)"
          test -n "$APP" && test -d "$APP"
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" | grep -Fx 'com.dominionstar.desktop.qa'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" | grep -Fx '2.0.55'
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
      - name: QA identity proof from installed executable (disposable CI Mac)
        shell: bash
        env:
          CI: 'false'
          DOMINIONSTAR_QA_BOOTSTRAP_ATTEST: '1'
        run: |
          APP='/Applications/DominionStar Meet QA.app'
          sudo ditto "${{ steps.artifact.outputs.path }}" "$APP"
          test -x "$APP/Contents/MacOS/DominionStar Meet QA"
          LOG="$RUNNER_TEMP/dominionstar-qa-canonical-smoke.log"
          "$APP/Contents/MacOS/DominionStar Meet QA" >"$LOG" 2>&1 &
          PID=$!
          sleep 9
          if ! grep -Fq 'DOMINIONSTAR_QA_BOOTSTRAP_ATTEST {"qa":true,"canonical":true}' "$LOG"; then
            cat "$LOG"
            kill "$PID" 2>/dev/null || true
            echo 'ERROR: packaged QA misidentified or canonical path rejected'
            exit 96
          fi
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG"
            echo 'ERROR: packaged QA exited during startup'
            exit 91
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo DOMINIONSTAR_MEET_QA_CANONICAL_STARTUP_OK
      - name: Create and mount-verify Mac DMG with Applications shortcut
        shell: bash
        run: |
          mkdir -p qa-2.0.55
          STAGE="$RUNNER_TEMP/dominionstar-qa-dmg-stage"
          mkdir -p "$STAGE"
          ditto "${{ steps.artifact.outputs.path }}" "$STAGE/DominionStar Meet QA.app"
          ln -s /Applications "$STAGE/Applications"
          DMG='qa-2.0.55/DominionStar-Meet-2.0.55-Mac-universal-QA.dmg'
          hdiutil create -volname 'DominionStar Meet QA' -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          test -s "$DMG"
          MOUNT="$RUNNER_TEMP/dominionstar-qa-dmg-mount"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          test -d "$MOUNT/DominionStar Meet QA.app"
          test -L "$MOUNT/Applications"
          test "$(readlink "$MOUNT/Applications")" = '/Applications'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$MOUNT/DominionStar Meet QA.app/Contents/Info.plist" | grep -Fx 'com.dominionstar.desktop.qa'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MOUNT/DominionStar Meet QA.app/Contents/Info.plist" | grep -Fx '2.0.55'
          codesign --verify --deep --strict --verbose=2 "$MOUNT/DominionStar Meet QA.app"
          hdiutil detach "$MOUNT"
          trap - EXIT
          shasum -a 256 "$DMG" > qa-2.0.55/SHA256.txt
          printf 'source_commit=%s\\nversion=2.0.55\\nformat=DMG\\napplication=DominionStar Meet QA.app\\nbundle_id=com.dominionstar.desktop.qa\\nbranch=cleanup/meeting-ownership-audit-20261014\\nproduction=false\\nmacos=12+\\nsigning=ad-hoc\\nnotarization=none\\nphysical_two_mac_acceptance=PENDING\\n' "$GITHUB_SHA" > qa-2.0.55/BUILD-PROVENANCE.txt
          du -h "$DMG"
      - name: Upload QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: DominionStar-Meet-2.0.55-Mac-universal-DMG-QA
          path: qa-2.0.55/*
          retention-days: 14
          if-no-files-found: error
