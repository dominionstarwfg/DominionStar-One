<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar Participant Dock</title>
  <style>
    :root{color-scheme:dark;--panel:rgba(8,13,21,.965);--panel2:rgba(18,25,37,.97);--line:rgba(255,255,255,.11);--text:#f7f9fc;--muted:#98a6b8;--gold:#e8bc49;--green:#32d47a}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--text);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;user-select:none}
    .dock{width:100%;height:100%;display:flex;flex-direction:column;padding:5px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 22px 70px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.05);-webkit-backdrop-filter:blur(24px) saturate(145%);backdrop-filter:blur(24px) saturate(145%)}
    header{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;-webkit-app-region:drag}
    .title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:760;letter-spacing:.02em;color:#e7edf5}.live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(50,212,122,.12)}
    .hint{font-size:8px;color:#78879a;letter-spacing:.04em;text-transform:uppercase}
    .tiles{min-height:0;flex:1;display:grid;grid-auto-rows:minmax(138px,1fr);gap:6px;overflow:auto;scrollbar-width:none}.tiles::-webkit-scrollbar{display:none}
    .tile{position:relative;min-height:138px;border:1px solid rgba(255,255,255,.075);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1f2b3d,#080d15 72%)}
    .tile.speaking{border-color:rgba(50,212,122,.92);box-shadow:inset 0 0 0 1px rgba(50,212,122,.32),0 0 0 1px rgba(50,212,122,.08)}
    .frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05080d;image-rendering:auto;transform:translateZ(0)}.frame[hidden]{display:none}
    .fallback{position:absolute;inset:0;display:grid;place-items:center}.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 26px rgba(0,0,0,.35)}
    .initials{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#24344b,#101827);border:1px solid rgba(232,188,73,.22);color:#f5d77f;font-size:19px;font-weight:800}
    .meta{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:9px;background:rgba(4,8,14,.73);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
    .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;font-weight:720}.role{margin-left:5px;color:#d8b957;font-size:8px;font-weight:800;text-transform:uppercase}.mic{width:15px;height:15px;flex:0 0 auto;color:#b9c5d2}.mic.off{color:#ff7783}.mic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .empty{height:100%;display:grid;place-items:center;padding:22px;text-align:center;color:var(--muted);font-size:10px;line-height:1.45}
    body[data-layout="speaker"] .tiles{grid-template-columns:1fr;grid-auto-rows:1fr;overflow:hidden}body[data-layout="speaker"] .tile:not(:first-child){display:none}
    body[data-layout="grid"] .tiles{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(150px,1fr)}body[data-layout="grid"] .tile{min-height:150px}
  </style>
</head>
<body data-layout="stack">
  <section class="dock" aria-label="Participant video panel">
    <header><span class="title"><i class="live"></i>Participants</span><span id="layoutHint" class="hint">Stack • Drag • Resize</span></header>
    <div id="tiles" class="tiles"><div class="empty">Participant video will appear here while you share.</div></div>
  </section>
  <script>
    const tiles=document.getElementById('tiles');
    const layoutHint=document.getElementById('layoutHint');
    const escapeHtml=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
    const initials=name=>String(name||'Guest').trim().split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase()||'G';
    const safeImage=value=>{const text=String(value||'');return /^(data:image\/(?:jpeg|png|webp);base64,|https:\/\/)/i.test(text)?text:''};
    const micIcon=off=>off?'<svg viewBox="0 0 24 24"><path d="m3 3 18 18M9 9v1a3 3 0 0 0 4.8 2.4M15 9V6a3 3 0 0 0-5.6-1.5M5 10a7 7 0 0 0 11.5 5.4M19 10a7 7 0 0 1-.7 3M12 17v4M8 21h8"/></svg>':'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4M8.5 21h7"/></svg>';
    const render=state=>{
      const items=Array.isArray(state?.tiles)?state.tiles.slice(0,5):[];
      if(!items.length){tiles.innerHTML='<div class="empty">Participant video will appear here while you share.</div>';return;}
      tiles.innerHTML=items.map(item=>{
        const frame=safeImage(item.frame),avatar=safeImage(item.avatarUrl),name=escapeHtml(item.name||'Participant'),role=escapeHtml(item.role||'');
        const fallback=avatar?`<img class="avatar" src="${avatar}" alt="">`:`<span class="initials">${escapeHtml(initials(item.name))}</span>`;
        return `<article class="tile${item.speaking?' speaking':''}">${frame&&item.video?`<img class="frame" src="${frame}" alt="">`:''}<div class="fallback">${frame&&item.video?'':fallback}</div><div class="meta"><span class="name">${name}${role?`<small class="role">${role}</small>`:''}</span><span class="mic${item.audio===false?' off':''}">${micIcon(item.audio===false)}</span></div></article>`;
      }).join('');
    };
    const applyLayout=mode=>{
      const safe=['stack','speaker','grid'].includes(mode)?mode:'stack';
      document.body.dataset.layout=safe;
      layoutHint.textContent=`${safe[0].toUpperCase()+safe.slice(1)} • Drag • Resize`;
    };
    window.presenterDockBridge?.onState?.(render);
    window.presenterDockBridge?.onLayout?.(applyLayout);
  </script>
</body>
</html>
