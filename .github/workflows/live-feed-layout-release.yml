name: DominionStar — Live renderer layout release gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'feed/**'
      - 'member-dashboard/**'
      - 'assets/js/dashboard-social*.js'
      - 'assets/css/dominionstar-feed-flow.css'
      - 'assets/css/dominionstar-organic-posts.css'
      - 'assets/css/dominionstar-social-first-dashboard.css'
      - 'scripts/verify-live-feed-layout.mjs'
      - '.github/workflows/live-feed-layout-release.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.57.0
          npx playwright install chromium
      - name: Verify actual renderer with isolated test records
        run: node scripts/verify-live-feed-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-feed-layout-screenshots
          path: artifacts/live-feed-layout/
          if-no-files-found: warn
          retention-days: 7
