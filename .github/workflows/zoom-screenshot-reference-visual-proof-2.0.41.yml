name: DominionStar Meet Visual Reference Proof 2.0.41

on:
  pull_request:
    branches: [main]
    paths:
      - 'meet-desktop/ui/zoom-screenshot-reference-2.0.41.css'
      - 'meet-desktop/ui/zoom-screenshot-reference-2.0.41.js'
      - 'meet-desktop/ui/share-picker.html'
      - 'meet-desktop/ui/share-picker.css'
      - 'meet-desktop/ui/share-picker.js'
      - 'meet-desktop/ui/auth-password.js'
      - 'meet-desktop/ui/mac-presenter-toolbar.html'
      - 'meet-desktop/ui/mac-presenter-toolbar.css'
      - 'meet-desktop/ui/mac-presenter-toolbar.js'
      - 'meet-desktop/ui/mac-share-video.html'
      - 'meet-desktop/ui/mac-share-video.css'
      - 'meet-desktop/ui/mac-share-video.js'
      - 'meet-desktop/src/preload.cjs'
      - 'meet-desktop/src/mac-share-presenter-overlay.mjs'
      - 'meet-desktop/package.json'
      - 'meet-desktop/scripts/capture-zoom-screenshot-reference-2.0.41.mjs'
      - 'meet-desktop/scripts/verify-packaged-mac-presenter-window-2.0.41.mjs'
      - 'meet-desktop/scripts/verify-runtime-share-authority-2.0.41.mjs'
      - 'meet-desktop/scripts/verify-zoom-screenshot-reference-2.0.41.mjs'
      - '.github/workflows/zoom-screenshot-reference-visual-proof-2.0.41.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-visual-proof:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve candidate version
        id: meta
        working-directory: meet-desktop
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify narrow screenshot reference before building
        working-directory: meet-desktop
        run: |
          node --check scripts/capture-zoom-screenshot-reference-2.0.41.mjs
          node --check scripts/verify-packaged-mac-presenter-window-2.0.41.mjs
          node --check scripts/verify-runtime-share-authority-2.0.41.mjs
          node --check ui/mac-presenter-toolbar.js
          node --check src/preload.cjs
          node --check src/mac-share-presenter-overlay.mjs
          node scripts/verify-zoom-screenshot-reference-2.0.41.mjs
          node scripts/verify-runtime-share-authority-2.0.41.mjs
      - name: Install build dependencies
        working-directory: meet-desktop
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build universal packaged app for visual proof
        working-directory: meet-desktop
        run: npx electron-builder --mac dir --universal --publish never
      - name: Locate packaged app
        id: app
        shell: bash
        run: |
          APP_PATH="$(find meet-desktop/dist -maxdepth 3 -type d -name 'DominionStar Meet.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Install packaged app into Applications for truthful visual proof
        shell: bash
        run: |
          sudo rm -rf "/Applications/DominionStar Meet.app"
          sudo ditto "${{ steps.app.outputs.path }}" "/Applications/DominionStar Meet.app"
          test -d "/Applications/DominionStar Meet.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "/Applications/DominionStar Meet.app/Contents/Info.plist" | grep -Fx 'com.dominionstar.desktop'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "/Applications/DominionStar Meet.app/Contents/Info.plist" | grep -Fx "${{ steps.meta.outputs.version }}"
      - name: Capture all main-window Zoom reference surfaces
        working-directory: meet-desktop
        run: node scripts/capture-zoom-screenshot-reference-2.0.41.mjs "/Applications/DominionStar Meet.app" ../zoom-reference-proof-${{ steps.meta.outputs.version }}
      - name: Prove and capture the real floating Mac presenter surfaces
        working-directory: meet-desktop
        run: node scripts/verify-packaged-mac-presenter-window-2.0.41.mjs "/Applications/DominionStar Meet.app" ../zoom-reference-proof-${{ steps.meta.outputs.version }}/11-mac-floating-presenter-toolbar.png ../zoom-reference-proof-${{ steps.meta.outputs.version }}/12-mac-participant-video-panel.png
      - name: Verify screenshot evidence exists and is unobstructed
        run: |
          for n in 01-home 02-prejoin 03-meeting 04-participants 05-participants-more 06-host-tools 07-more 08-preshare 09-native-share-renderer-clean 10-native-share-renderer-stable 11-mac-floating-presenter-toolbar 12-mac-participant-video-panel; do
            test -s "zoom-reference-proof-${{ steps.meta.outputs.version }}/${n}.png"
          done
          test -s zoom-reference-proof-${{ steps.meta.outputs.version }}/visual-proof.json
          cat zoom-reference-proof-${{ steps.meta.outputs.version }}/visual-proof.json
      - name: Upload visual evidence only
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-${{ steps.meta.outputs.version }}-approved-reference-visual-proof
          path: zoom-reference-proof-${{ steps.meta.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove QA installation
        if: always()
        run: sudo rm -rf "/Applications/DominionStar Meet.app"
