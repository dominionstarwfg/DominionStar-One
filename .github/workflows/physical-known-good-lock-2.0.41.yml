name: DominionStar Meet Physical Known-Good Lock 2.0.41

on:
  pull_request:
    branches:
      - fix/rejected-installer-participants-share-2.0.40
    paths:
      - 'meet-desktop/**'
      - '.github/workflows/physical-known-good-lock-2.0.41.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect-physically-proven-surfaces:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce physical known-good lock
        working-directory: meet-desktop
        run: node scripts/verify-physical-known-good-lock-2.0.41.mjs
