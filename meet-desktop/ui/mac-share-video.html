<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar Meet – Participant Video</title>
  <link rel="stylesheet" href="./mac-share-video.css">
</head>
<body>
  <main id="dock" class="video-dock" data-layout="strip" aria-label="DominionStar Meet participant video panel">
    <header class="video-dock-head" aria-label="Video panel layout">
      <button id="videoViewHide" type="button" data-layout="hide" aria-label="Minimize video panel" title="Minimize video panel"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button>
      <button id="videoViewSpeaker" type="button" data-layout="speaker" aria-label="Speaker view" title="Speaker view"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="5" width="14" height="10" rx="2"/></svg></button>
      <button id="videoViewStrip" type="button" data-layout="strip" class="active" aria-label="Participant strip" title="Participant strip"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="4" rx="1"/><rect x="3" y="8" width="14" height="4" rx="1"/><rect x="3" y="13" width="14" height="4" rx="1"/></svg></button>
      <button id="videoViewGallery" type="button" data-layout="gallery" aria-label="Gallery view" title="Gallery view"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg></button>
    </header>
    <section id="videoStack" class="video-stack" aria-live="polite"></section>
    <div id="videoActionMenu" class="video-action-menu" role="menu" hidden></div>
  </main>
  <script src="./mac-share-video.js"></script>
</body>
</html>
