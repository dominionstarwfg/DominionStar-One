name: Verify Live Meeting Lookup

on:
  push:
    branches:
      - verify/live-meeting-lookup-a9cbc225
    paths:
      - .github/workflows/_verify-live-meeting-lookup.yml

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9cbc225cfd50b014032d80df7912bfe61eb03d2
          fetch-depth: 1

      - name: Read deployed public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const source=fs.readFileSync('assets/js/supabase-config.js','utf8');
          const url=source.match(/url:\s*["']([^"']+)["']/)?.[1];
          const key=source.match(/anonKey:\s*["']([^"']+)["']/)?.[1];
          if(!url||!key)throw new Error('Public Supabase config not found');
          console.log(`SUPABASE_URL=${url}`);
          console.log(`SUPABASE_PUBLIC_KEY=${key}`);
          NODE

      - name: Inspect public meetings schema metadata without reading rows
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_PUBLIC_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLIC_KEY" \
            -H 'Accept: application/openapi+json' \
            -o /tmp/openapi.json
          node <<'NODE'
          const fs=require('fs');
          const spec=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          const schema=spec.definitions?.meetings || spec.components?.schemas?.meetings;
          if(!schema)throw new Error('public.meetings schema metadata not exposed');
          const safe={
            required:schema.required||[],
            properties:Object.fromEntries(Object.entries(schema.properties||{}).map(([name,value])=>[name,{type:value.type,format:value.format,description:value.description,default:value.default}]))
          };
          console.log(JSON.stringify(safe,null,2));
          NODE

      - name: Confirm current production resolver failure mode
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/lookup.json -w '%{http_code}' \
            -X POST 'https://dominionstarld.com/.netlify/functions/resolve-meeting-join' \
            -H 'content-type: application/json' \
            --data '{"room":"238 910 3606","passcode":"360"}')
          echo "RESOLVER_HTTP_STATUS=$status"
          cat /tmp/lookup.json; echo
