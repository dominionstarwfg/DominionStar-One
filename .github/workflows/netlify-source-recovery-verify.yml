name: DominionStar Netlify Source Recovery Verification

on:
  pull_request:
    paths:
      - "netlify/functions/**"
      - "package.json"
      - "netlify.toml"
      - "scripts/build-netlify-site.sh"
      - ".github/workflows/netlify-source-recovery-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    name: Recover and Bundle Existing Production Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies and generate a candidate lockfile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @supabase/supabase-js@2.109.1 resend@6.17.2 netlify-cli@26.2.0 --depth=0
          test -s package-lock.json

      - name: Verify all nine known production functions are present
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            founder-data.mjs
            meet-intelligence.mjs
            meet-rtc-config.mjs
            meet-translate.mjs
            meeting-host-alert.mjs
            process-email-outbox.mjs
            resolve-meeting-join.mjs
            scheduled-email-outbox.mjs
            workspace-weather.mjs
          )
          for file in "${expected[@]}"; do
            test -s "netlify/functions/$file"
            node --check "netlify/functions/$file"
          done
          actual=$(find netlify/functions -maxdepth 1 -type f -name '*.mjs' | wc -l | tr -d ' ')
          test "$actual" -eq 9

      - name: Verify recovered function bytes match the certified live baseline
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/function-sha256 <<'EOF'
          9cdaf2e166c2649a9d672d58b155d153d0c8296d615e7b6d0847a0e7c4908d72  netlify/functions/founder-data.mjs
          273ccf9eaa6e761b8f049ac0a3ec639deb80fd373271338027eebd8268fc65b3  netlify/functions/meet-intelligence.mjs
          7d91e47df12f8db051a3e69e73ec5f405fe705068a6a8e2cfeacaebd83c49dcc  netlify/functions/meet-rtc-config.mjs
          f1f2c218595213ab044222dbb70ff44b3830733e829f97912063b99887ca6db7  netlify/functions/meet-translate.mjs
          abd2c86ae04930a849ecfd7490f19e4d27aba6502d930689197fbac81235b032  netlify/functions/meeting-host-alert.mjs
          8790421491c4c42bd9d1c89b6767f9b0de0bbde98ccc6d712c9d176736f64068  netlify/functions/process-email-outbox.mjs
          80aac676366feb1e5d327b09d38d4f5a221aad93fe7a961f15e0a1dd6c34afb1  netlify/functions/resolve-meeting-join.mjs
          8666d6d73dca86659926f613e0c75ae34a88087ebbb6d08838088e7202d3ffc2  netlify/functions/scheduled-email-outbox.mjs
          de608d5ceca9ee8a4bc53689d2637033d3cf900b7a728a15e6a5983427647149  netlify/functions/workspace-weather.mjs
          EOF
          sha256sum --check /tmp/function-sha256

      - name: Verify local import closure and declared package dependencies
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const deps=new Set(Object.keys(pkg.dependencies||{}));
          const root='netlify/functions';
          for(const name of fs.readdirSync(root).filter(x=>x.endsWith('.mjs'))){
            const full=path.join(root,name);
            const source=fs.readFileSync(full,'utf8');
            for(const match of source.matchAll(/(?:from\s+|import\s*\()(['"])([^'"]+)\1/g)){
              const spec=match[2];
              if(spec.startsWith('./')||spec.startsWith('../')){
                const target=path.resolve(path.dirname(full),spec);
                if(!fs.existsSync(target)) throw new Error(`${name}: missing local import ${spec}`);
              }else if(!spec.startsWith('node:')){
                const packageName=spec.startsWith('@')?spec.split('/').slice(0,2).join('/'):spec.split('/')[0];
                if(!deps.has(packageName)) throw new Error(`${name}: undeclared package ${packageName}`);
              }
            }
          }
          console.log('Function import closure is complete.');
          NODE

      - name: Build functions with the pinned Netlify CLI
        run: npx --no-install netlify functions:build --src netlify/functions --functions .netlify/functions

      - name: Confirm production remains deployment-locked until static source recovery is complete
        shell: bash
        run: |
          set +e
          output=$(bash scripts/build-netlify-site.sh 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 42
          echo "$output" | grep -F "refusing to build an incomplete DominionStar production deploy" >/dev/null
          test ! -e dist
