name: Recover Stable Current-Live Diverged Static Pages

on:
  push:
    branches:
      - infra/recover-complete-live-web-source
    paths:
      - ".github/workflows/recover-current-live-diverged-static.yml"
      - "scripts/recovery/current-live-diverged-static-sha256.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-current-live-diverged-static-pages
  cancel-in-progress: false

jobs:
  recover:
    name: Add only stable current-live pages that are absent from Git
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: infra/recover-complete-live-web-source
          fetch-depth: 1
          persist-credentials: true

      - name: Record protected RC13 Meet hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            meet/index.html \
            meet/release-contract.json \
            assets/js/meeting-engine.js \
            assets/js/meet-next/executive6.js \
            > /tmp/protected-meet-before.sha256

      - name: Recover stable current-live pages without overwriting anything
        shell: bash
        run: |
          set -euo pipefail
          manifest="scripts/recovery/current-live-diverged-static-sha256.txt"
          report="scripts/recovery/current-live-diverged-static-recovery.txt"
          base="https://dominionstarld.com"
          mkdir -p /tmp/ds-live scripts/recovery
          : > "$report"

          recovered=0
          already_exact=0

          while read -r expected path; do
            [ -n "${expected:-}" ] || continue
            [ -n "${path:-}" ] || continue

            if [ -f "$path" ]; then
              actual=$(sha256sum "$path" | awk '{print $1}')
              if [ "$actual" != "$expected" ]; then
                echo "ERROR: refusing to overwrite existing $path; repo=$actual expected_current_live=$expected" >&2
                exit 61
              fi
              echo "ALREADY_EXACT $path $actual" >> "$report"
              already_exact=$((already_exact+1))
              continue
            fi

            if [ "$path" = "index.html" ]; then
              url="$base/"
            elif [[ "$path" == */index.html ]]; then
              url="$base/${path%index.html}"
            else
              url="$base/$path"
            fi

            key=$(printf '%s' "$path" | sha256sum | awk '{print $1}')
            first="/tmp/ds-live/$key.first"
            second="/tmp/ds-live/$key.second"

            curl --fail --silent --show-error --location --compressed \
              -H 'Cache-Control: no-cache' "$url" -o "$first"
            sleep 0.2
            curl --fail --silent --show-error --location --compressed \
              -H 'Cache-Control: no-cache' "$url" -o "$second"

            cmp "$first" "$second"
            actual=$(sha256sum "$first" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: current live bytes changed for $path; live=$actual certified=$expected" >&2
              exit 62
            fi

            mkdir -p "$(dirname "$path")"
            mv "$first" "$path"
            rm -f "$second"
            git add -- "$path"
            echo "RECOVERED_STABLE_CURRENT_LIVE $path $actual" >> "$report"
            recovered=$((recovered+1))
          done < "$manifest"

          echo "SUMMARY recovered=$recovered already_exact=$already_exact" >> "$report"
          cat "$report"
          git add -- "$report"

      - name: Prove protected RC13 Meet was not touched
        shell: bash
        run: sha256sum --check /tmp/protected-meet-before.sha256

      - name: Commit recovered current-live pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dominionstar-recovery-bot"
          git config user.email "dominionstarwfg@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "All certified current-live divergent pages are already recovered."
            exit 0
          fi

          git commit -m "Recover stable current-live pages newer than RC12.26 archive"
          git push origin HEAD:infra/recover-complete-live-web-source
