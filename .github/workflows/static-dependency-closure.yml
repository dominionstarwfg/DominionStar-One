name: DominionStar Web Static Dependency Closure

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "assets/js/**"
      - "assets/*.png"
      - "assets/*.jpeg"
      - "assets/*.jpg"
      - "assets/*.svg"
      - "manifest.webmanifest"
      - "scripts/audit-static-dependency-closure.mjs"
      - ".github/workflows/static-dependency-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: No Missing Static Runtime Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit HTML, CSS and JavaScript local dependency closure
        run: node scripts/audit-static-dependency-closure.mjs
