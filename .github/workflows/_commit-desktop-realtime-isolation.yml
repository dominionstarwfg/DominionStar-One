name: Commit Desktop Realtime Isolation Candidate

on:
  push:
    branches:
      - fix/desktop-realtime-transport-isolation
    paths:
      - .github/workflows/_commit-desktop-realtime-isolation.yml

permissions:
  contents: write

jobs:
  commit-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply, verify and commit validated product files
        run: |
          set -euo pipefail
          python3 scripts/_author_desktop_realtime_transport_isolation.py
          node --check assets/js/meeting-engine.js
          node scripts/test-meet-realtime-transport-isolation.mjs
          node scripts/test-waiting-room-surgical.mjs
          node scripts/test-two-client-authority.mjs
          node scripts/test-production-meet-rc13.mjs
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          c=json.loads(Path('meet/release-contract.json').read_text())
          for rel,expected in c['files'].items():
              actual=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if actual!=expected: raise SystemExit(f'hash mismatch {rel}')
          print('RELEASE_HASHES_OK')
          PY
          git config user.name 'DominionStar Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/meeting-engine.js meet/index.html meet/release-contract.json scripts/test-production-meet-rc13.mjs scripts/test-meet-realtime-transport-isolation.mjs
          git commit -m 'Isolate desktop meeting realtime from account authentication'
          git push origin HEAD
