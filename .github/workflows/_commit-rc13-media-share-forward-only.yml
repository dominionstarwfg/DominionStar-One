name: Commit RC13 Media Share Forward Only
on:
  push:
    branches: [fix/rc13-media-share-forward-only]
    paths:
      - .github/workflows/_commit-rc13-media-share-forward-only.yml
      - scripts/_author_rc13_media_share_forward_only.py
permissions:
  contents: write
jobs:
  commit-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and validate product candidate
        run: |
          set -euo pipefail
          python3 scripts/_author_rc13_media_share_forward_only.py
          node --check assets/js/meet-next/executive6.js
          node --check 'desktop 2/src/main-v2.mjs'
          node --check 'desktop 2/src/preload.cjs'
          node --check 'desktop 2/src/presenter-preload.cjs'
          node --check 'desktop 2/src/presenter-toolbar.js'
          node scripts/test-media-share-forward-only.mjs
          node scripts/test-camera-privacy-and-native-picker.mjs
          node scripts/test-media-stability-guardrails.mjs
          node scripts/test-two-client-authority.mjs
          node scripts/test-professional-meeting-controls.mjs
          node scripts/test-production-meet-rc13.mjs
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          c=json.loads(Path('meet/release-contract.json').read_text())
          for rel,expected in c['files'].items():
            actual=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
            if actual!=expected: raise SystemExit(f'hash mismatch {rel}')
          print('RELEASE_HASHES_OK')
          PY
      - name: Commit product files
        run: |
          git config user.name 'DominionStar Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/meet-next/executive6.js meet/release-contract.json scripts/test-media-share-forward-only.mjs 'desktop 2/src/main-v2.mjs' 'desktop 2/src/preload.cjs' 'desktop 2/src/presenter-preload.cjs' 'desktop 2/src/presenter-toolbar.html' 'desktop 2/src/presenter-toolbar.js'
          git commit -m 'Recover remote video state and modernize desktop sharing'
          git push origin HEAD
