name: Finalize approved DominionStar Meet share UI

on:
  push:
    branches:
      - prototype/meet-clean-foundation
    paths:
      - .github/workflows/finalize-approved-meet-share-ui.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/meet-clean-foundation
          fetch-depth: 0

      - name: Finalize approved share picker and comments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: required source not found: {old[:90]!r}')
              p.write_text(text.replace(old,new,1))

          replace_required(
            'desktop 2/src/main-v2.mjs',
            "// Use one display-media handler. On macOS 15+ Electron delegates source\n// selection to Apple's native system picker; older macOS and other platforms\n// retain the DominionStar selected-source fallback below.",
            "// Use one display-media handler. DominionStar owns the visible source picker\n// on every desktop platform; macOS/Windows remain the underlying capture and\n// permission authorities."
          )

          replace_required(
            'assets/js/member-login.js',
            "            // Keep OAuth in the persistent Electron partition. The browser may\n            // navigate through Google/Supabase, but the completed session returns\n            // to the installed app's own trusted member-login route instead of a\n            // second browser process or custom-protocol token relay.",
            "            // Authenticate with Google in the normal browser, then return the\n            // completed session to the installed app through its registered\n            // dominionstar:// auth callback."
          )

          picker=Path('assets/js/meet/desktop-share-picker.js')
          text=picker.read_text()
          old='<label class="ds-share-switch-row"><span>Share DominionStar windows</span><input type="checkbox" role="switch" data-own-windows></label><p data-audio-note></p><small>DominionStar windows stay private by default to prevent mirror recursion.</small>'
          new='<label class="ds-share-switch-row" hidden><span>Share DominionStar windows</span><input type="checkbox" role="switch" data-own-windows></label><p data-audio-note></p><small hidden>DominionStar windows stay private by default to prevent mirror recursion.</small>'
          if old not in text: raise SystemExit('desktop-share-picker.js: own-window UI block not found')
          text=text.replace(old,new,1)
          old_css='#desktopSharePicker footer .primary{background:linear-gradient(135deg,#f0cf6a,#c99d33);color:#171a20;border-color:#e8bc49}'
          new_css='#desktopSharePicker footer .primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:#60a5fa}'
          if old_css not in text: raise SystemExit('desktop-share-picker.js: primary button CSS not found')
          text=text.replace(old_css,new_css,1)
          text=text.replace("'Computer sound will be included when Share sound is enabled.'","'Computer sound will be included when Share system audio is enabled.'",1)
          picker.write_text(text)

          # Lock the approved visible picker details into the regression suite.
          test=Path('desktop 2/scripts/test-approved-share-ui.mjs')
          text=test.read_text()
          anchor="assert(picker.includes('data-filter=\"window\">Applications'));"
          if anchor not in text: raise SystemExit('test-approved-share-ui.mjs: picker assertion anchor not found')
          additions="""assert(picker.includes('data-filter=\"window\">Applications'));
assert(picker.includes('<span>Share system audio</span>'));
assert(picker.includes('<span>Optimize for video sharing</span>'));
assert(picker.includes('class=\"ds-share-switch-row\" hidden><span>Share DominionStar windows</span>'));
assert(picker.includes('background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:#60a5fa'));
"""
          text=text.replace(anchor,additions,1)
          test.write_text(text)
          PY

      - name: Verify full desktop contract suite
        run: |
          git diff --check
          npm --prefix "desktop 2" run verify

      - name: Commit final approved UI correction
        shell: bash
        run: |
          rm -f .github/workflows/finalize-approved-meet-share-ui.yml
          git config user.name "DominionStar QA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(meet): finalize approved share picker presentation"
          git push origin HEAD:prototype/meet-clean-foundation
