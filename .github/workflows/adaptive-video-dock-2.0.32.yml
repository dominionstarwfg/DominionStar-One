name: DominionStar Meet Adaptive Video Dock 2.0.32

on:
  pull_request:
    paths:
      - 'meet-desktop/package.json'
      - 'meet-desktop/ui/runtime-stability.js'
      - 'meet-desktop/scripts/verify-adaptive-video-dock-2.0.32.mjs'
      - 'meet-desktop/scripts/verify-runtime-stability-2.0.22.mjs'
      - 'meet-desktop/scripts/verify-zoom-window-parity.mjs'
      - '.github/workflows/adaptive-video-dock-2.0.32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-video-dock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify adaptive video dock authority
        working-directory: meet-desktop
        run: |
          node --check ui/runtime-stability.js
          node --check scripts/verify-adaptive-video-dock-2.0.32.mjs
          node scripts/verify-adaptive-video-dock-2.0.32.mjs
          node scripts/verify-runtime-stability-2.0.22.mjs
          node scripts/verify-zoom-window-parity.mjs
