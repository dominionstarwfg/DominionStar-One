[build]
  command = "bash scripts/build-rebuild-netlify.sh"
  publish = "rebuild-dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

# Rebuild branch rule: Netlify publishes only rebuild-preview -> rebuild-dist.
# No legacy website tree and no legacy Netlify functions are part of this deploy.
