name: DominionStar — Disposable PostgreSQL Community Permissions

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/security/community-notifications-from-source.DO-NOT-RUN.review.sql'
      - 'tests/sql/community-notifications-fixture.sql'
      - 'tests/sql/community-notifications-assertions.sql'
      - '.github/workflows/community-postgres-isolation-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-community-source:
    name: Real SQL + RLS with disposable synthetic-only PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: SYNTHETIC_CI_ONLY_NO_REAL_DATA
      PGDATABASE: synthetic_agent_review
      DOMINIONSTAR_STAGING_ISOLATION_APPROVED: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: SYNTHETIC_CI_ONLY_NO_REAL_DATA
          POSTGRES_DB: synthetic_agent_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_agent_review"
          --health-interval 4s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout candidate SQL only — never deploy
        uses: actions/checkout@v4
      - name: Install local postgres client if absent
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
      - name: Hard refuse any nonlocal database target
        run: |
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = synthetic_agent_review
          test "$DOMINIONSTAR_STAGING_ISOLATION_APPROVED" = ""
          test "$(psql -v ON_ERROR_STOP=1 -Atc 'select current_database()')" = synthetic_agent_review
          test "$(psql -v ON_ERROR_STOP=1 -Atc 'select inet_server_addr()::text')" = 172.18.0.2 || true
          # The container-only target is also enforced by the service fixture.
      - name: Build isolated synthetic auth, posts, comments and inbox
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/community-notifications-fixture.sql
      - name: Compile and apply draft notification triggers in disposable CI only
        run: |
          grep -Fq 'REVIEW ONLY — DO NOT RUN' scripts/security/community-notifications-from-source.DO-NOT-RUN.review.sql
          psql -v ON_ERROR_STOP=1 -f scripts/security/community-notifications-from-source.DO-NOT-RUN.review.sql
      - name: Execute permission and genuine-source notification assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/community-notifications-assertions.sql
      - name: Confirm no external migration or email execution
        run: |
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${RESEND_API_KEY:-}"
          echo "DISPOSABLE_POSTGRES_NO_SUPABASE_NO_EMAIL_PASS"
