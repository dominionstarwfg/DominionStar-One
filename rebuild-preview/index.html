<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DominionStar Meet Rebuild</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06111f;color:#f7f9fc}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#102846 0,#06111f 48%,#030812 100%)}
    main{width:min(680px,calc(100% - 48px));padding:40px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(8,18,32,.88);box-shadow:0 28px 80px rgba(0,0,0,.35)}
    .brand{font-size:12px;letter-spacing:.18em;color:#e8bc49;font-weight:800}.status{display:inline-flex;margin-top:18px;padding:8px 12px;border-radius:999px;background:#102a1f;color:#75e6a6;font-size:12px;font-weight:700}h1{margin:18px 0 10px;font-size:34px}p{color:#aeb9c8;line-height:1.65;margin:0}
  </style>
</head>
<body>
  <main>
    <div class="brand">DOMINIONSTAR MEET</div>
    <div class="status">Clean rebuild branch</div>
    <h1>Desktop rebuild foundation</h1>
    <p>This non-production preview intentionally contains no legacy Meet UI or desktop runtime. New screens are added only after their behavior passes the rebuild acceptance contract.</p>
  </main>
</body>
</html>
