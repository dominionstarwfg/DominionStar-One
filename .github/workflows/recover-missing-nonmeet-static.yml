name: Audit and Recover Missing Non-Meet Production Static

on:
  push:
    branches:
      - infra/recover-complete-live-web-source
    paths:
      - ".github/workflows/recover-missing-nonmeet-static.yml"
      - "scripts/recovery/rc1226-nonmeet-static-sha256.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-missing-nonmeet-production-static
  cancel-in-progress: false

jobs:
  recover:
    name: Preserve current files; recover only proven missing baseline files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: infra/recover-complete-live-web-source
          fetch-depth: 1
          persist-credentials: true

      - name: Record protected RC13 Meet hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            meet/index.html \
            meet/release-contract.json \
            assets/js/meeting-engine.js \
            assets/js/meet-next/executive6.js \
            > /tmp/protected-meet-before.sha256

      - name: Audit current production and recover only safe missing files
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          manifest="scripts/recovery/rc1226-nonmeet-static-sha256.txt"
          report="scripts/recovery/current-nonmeet-static-audit.txt"
          base="https://dominionstarld.com"
          mkdir -p scripts/recovery /tmp/ds-live
          : > "$report"

          recovered=0
          current_match=0
          archived_config=0
          divergences=0
          unavailable=0

          while read -r expected path; do
            [ -n "${expected:-}" ] || continue
            [ -n "${path:-}" ] || continue

            # Netlify configuration files are not public URLs. Their exact
            # archived bytes were certified separately and are never fetched.
            if [ "$path" = "_headers" ] || [ "$path" = "_redirects" ]; then
              if [ ! -f "$path" ]; then
                echo "MISSING_CONFIG $path" >> "$report"
                divergences=$((divergences+1))
                continue
              fi
              repo_hash=$(sha256sum "$path" | awk '{print $1}')
              if [ "$repo_hash" = "$expected" ]; then
                echo "ARCHIVED_CONFIG_OK $path $repo_hash" >> "$report"
                archived_config=$((archived_config+1))
              else
                echo "CONFIG_DIVERGENCE $path repo=$repo_hash archive=$expected" >> "$report"
                divergences=$((divergences+1))
              fi
              continue
            fi

            if [ "$path" = "index.html" ]; then
              url="$base/"
            elif [[ "$path" == */index.html ]]; then
              url="$base/${path%index.html}"
            else
              url="$base/$path"
            fi

            tmp="/tmp/ds-live/$(printf '%s' "$path" | sha256sum | awk '{print $1}')"
            if ! curl --fail --silent --show-error --location --compressed \
              -H 'Cache-Control: no-cache' "$url" -o "$tmp"; then
              echo "LIVE_UNAVAILABLE $path $url" >> "$report"
              unavailable=$((unavailable+1))
              rm -f "$tmp"
              continue
            fi

            live_hash=$(sha256sum "$tmp" | awk '{print $1}')

            if [ -f "$path" ]; then
              repo_hash=$(sha256sum "$path" | awk '{print $1}')
              if [ "$repo_hash" = "$live_hash" ]; then
                echo "CURRENT_MATCH_LIVE $path $repo_hash" >> "$report"
                current_match=$((current_match+1))
              else
                echo "PRESERVED_REPO_LIVE_DIVERGENCE $path repo=$repo_hash live=$live_hash archive=$expected" >> "$report"
                divergences=$((divergences+1))
              fi
              rm -f "$tmp"
              continue
            fi

            # Missing source is restored only when the bytes currently served
            # by production still match the certified RC12.26 baseline. If the
            # live site has evolved, stop short of guessing or overwriting.
            if [ "$live_hash" = "$expected" ]; then
              mkdir -p "$(dirname "$path")"
              mv "$tmp" "$path"
              git add -- "$path"
              echo "RECOVERED_EXACT_LIVE_ARCHIVE_MATCH $path $live_hash" >> "$report"
              recovered=$((recovered+1))
            else
              echo "MISSING_SOURCE_LIVE_DIVERGED $path live=$live_hash archive=$expected" >> "$report"
              divergences=$((divergences+1))
              rm -f "$tmp"
            fi
          done < "$manifest"

          {
            echo ""
            echo "SUMMARY recovered=$recovered current_match=$current_match archived_config=$archived_config divergences=$divergences unavailable=$unavailable"
          } >> "$report"

          cat "$report"
          git add -- "$report"
          echo "recovered=$recovered" >> "$GITHUB_OUTPUT"
          echo "divergences=$divergences" >> "$GITHUB_OUTPUT"
          echo "unavailable=$unavailable" >> "$GITHUB_OUTPUT"

      - name: Prove protected RC13 Meet was not touched
        shell: bash
        run: sha256sum --check /tmp/protected-meet-before.sha256

      - name: Commit only safely recovered non-Meet files and audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dominionstar-recovery-bot"
          git config user.email "dominionstarwfg@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No safe missing files required recovery and audit report is unchanged."
            exit 0
          fi

          git commit -m "Recover proven current non-Meet production static source"
          git push origin HEAD:infra/recover-complete-live-web-source

      - name: Summarize unresolved source drift without mutating working files
        shell: bash
        run: |
          echo "RECOVERED=${{ steps.audit.outputs.recovered }}"
          echo "DIVERGENCES=${{ steps.audit.outputs.divergences }}"
          echo "UNAVAILABLE=${{ steps.audit.outputs.unavailable }}"
          echo "No existing repository file was overwritten by this recovery workflow."
          echo "Production remains locked behind preview acceptance."
