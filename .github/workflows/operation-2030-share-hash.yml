name: Operation 2030 Share Hash

on:
  push:
    branches:
      - agent/operation-2030-share-viewer-controls

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Compute protected hashes
        run: |
          sha256sum meet/index.html
          sha256sum assets/js/meet/share-view-controls.js
