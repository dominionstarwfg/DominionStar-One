name: Apply approved DominionStar Meet parity fix v4

on:
  push:
    branches:
      - prototype/meet-clean-foundation
    paths:
      - .github/workflows/apply-approved-meet-parity-fix-v4.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/meet-clean-foundation
          fetch-depth: 0

      - name: Apply approved behavior and OAuth contract correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          # Reuse the already-reviewed v3 transformation, which itself reuses v2.
          source=Path('.github/workflows/apply-approved-meet-parity-fix-v3.yml').read_text()
          match=re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n\n      - name: Verify desktop contracts",source,re.S)
          if not match:
              raise SystemExit('Unable to extract reviewed v3 transformation')
          code=textwrap.dedent(match.group(1))
          exec(compile(code,'approved-parity-v3.py','exec'),{})

          # Enforce the deep-link behavior using the protocol markers that actually
          # exist in main-v2.mjs rather than a nonexistent constant/function name.
          Path('desktop 2/scripts/test-desktop-google-oauth-return.mjs').write_text("""import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const here=path.dirname(fileURLToPath(import.meta.url));
          const root=path.resolve(here,'..','..');
          const read=relative=>fs.readFileSync(path.join(root,relative),'utf8');
          const login=read('assets/js/member-login.js');
          const auth=read('assets/js/member-auth.js');
          const main=read('desktop 2/src/main-v2.mjs');
          const relay=read('assets/js/desktop-oauth-return.js');
          assert(login.includes("const DESKTOP_OAUTH_CALLBACK = 'dominionstar://auth/callback'"));
          assert(login.includes('redirectTo: DESKTOP_OAUTH_CALLBACK'));
          assert(login.includes('skipBrowserRedirect: true'));
          assert(login.includes('window.dominionDesktop?.openExternal?.(data.url)'));
          assert(!login.includes('window.location.assign(data.url)'));
          assert(login.includes('let { data } = await supabase.auth.getSession();'));
          assert(login.includes('supabase.auth.setSession({'));
          assert(login.includes("return '/meet-home/?desktop=1';"));
          assert(main.includes("url.protocol !== 'dominionstar:'"));
          assert(main.includes("url.hostname === 'auth' && url.pathname === '/callback'"));
          assert(main.includes("app.setAsDefaultProtocolClient('dominionstar'"));
          assert(main.includes("new URL('/member-login/?desktop=1&oauth=complete', APP_ORIGIN)"));
          assert(relay.includes('dominionstar://auth/callback'));
          assert(auth.includes('const desktop = Boolean(window.dominionDesktop?.isDesktop)'));
          console.log('DOMINIONSTAR_DESKTOP_GOOGLE_OAUTH_CODE_CONTRACT_OK system-browser deep-link meet-home');
          """)
          PY

      - name: Verify desktop contracts
        run: |
          git diff --check
          npm --prefix "desktop 2" run verify

      - name: Commit parity correction
        shell: bash
        run: |
          rm -f .github/workflows/apply-approved-meet-parity-fix.yml
          rm -f .github/workflows/apply-approved-meet-parity-fix-v2.yml
          rm -f .github/workflows/apply-approved-meet-parity-fix-v3.yml
          rm -f .github/workflows/apply-approved-meet-parity-fix-v4.yml
          git config user.name "DominionStar QA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(meet): restore approved auth and screen-share parity"
          git push origin HEAD:prototype/meet-clean-foundation
