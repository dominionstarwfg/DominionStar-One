name: Verify Live Meeting Lookup

on:
  push:
    branches:
      - verify/live-meeting-lookup-a9cbc225
    paths:
      - .github/workflows/_verify-live-meeting-lookup.yml

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9cbc225cfd50b014032d80df7912bfe61eb03d2
          fetch-depth: 1

      - name: Read deployed public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const source=fs.readFileSync('assets/js/supabase-config.js','utf8');
          const url=source.match(/url:\s*["']([^"']+)["']/)?.[1];
          const key=source.match(/anonKey:\s*["']([^"']+)["']/)?.[1];
          if(!url||!key)throw new Error('Public Supabase config not found');
          console.log(`SUPABASE_URL=${url}`);
          console.log(`SUPABASE_PUBLIC_KEY=${key}`);
          NODE

      - name: Discover scheduling and security tables with zero-row reads
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            meetings meeting_schedules scheduled_meetings meeting_schedule meeting_events
            personal_rooms personal_meetings meeting_rooms rooms meeting_links meeting_invites
            meeting_security meeting_settings meeting_config meeting_preferences
          )
          for table in "${candidates[@]}"; do
            status=$(curl -sS -o "/tmp/table-${table}.json" -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/${table}?select=id&limit=0" \
              -H "apikey: $SUPABASE_PUBLIC_KEY" \
              -H "Authorization: Bearer $SUPABASE_PUBLIC_KEY" \
              -H 'Accept: application/json')
            if [ "$status" = "200" ] || [ "$status" = "206" ]; then
              echo "TABLE_EXISTS=${table}"
            else
              message=$(cat "/tmp/table-${table}.json" | tr '\n' ' ')
              echo "TABLE_MISSING_OR_DENIED=${table} HTTP=${status} ${message}"
            fi
          done
