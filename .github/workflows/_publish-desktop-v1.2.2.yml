name: Publish Certified Desktop v1.2.2

on:
  push:
    branches:
      - release/desktop-v1.2.2-publish
    paths:
      - .github/workflows/_publish-desktop-v1.2.2.yml

permissions:
  contents: write
  actions: write

jobs:
  publish-certified-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact certified source
        uses: actions/checkout@v4
        with:
          ref: 0e9cbc2e77e0502c724610485769031163ace3a3
          clean: true
          fetch-depth: 1

      - name: Verify desktop v1.2.2 source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./desktop 2/package.json').version")" = "1.2.2"
          grep -F "const BRIDGE_VERSION = 13" 'desktop 2/src/preload.cjs' >/dev/null
          grep -F "const DESKTOP_BRIDGE_VERSION = 13" 'desktop 2/src/main-v2.mjs' >/dev/null
          grep -F 'EXPECTED_VERSION="1.2.2"' 'desktop 2/build/pkg-scripts/postinstall' >/dev/null
          echo "CERTIFIED_DESKTOP_V1_2_2_SOURCE_OK"

      - name: Create exact desktop-v1.2.2 tag
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: desktop-v1.2.2
          TARGET_SHA: 0e9cbc2e77e0502c724610485769031163ace3a3
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$API_URL/repos/$REPOSITORY/git/ref/tags/$TAG"
          status=$(curl -sS -o /tmp/tag-ref.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$endpoint")

          if [ "$status" = "200" ]; then
            actual=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/tag-ref.json'))['object']['sha'])
          PY
            )
            test "$actual" = "$TARGET_SHA"
            echo "TAG_ALREADY_EXISTS_AT_CERTIFIED_SHA"
          elif [ "$status" = "404" ]; then
            python3 - <<'PY' >/tmp/create-tag.json
          import json
          print(json.dumps({'ref':'refs/tags/desktop-v1.2.2','sha':'0e9cbc2e77e0502c724610485769031163ace3a3'}))
          PY
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_URL/repos/$REPOSITORY/git/refs" \
              --data-binary @/tmp/create-tag.json >/tmp/created-tag.json
            actual=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/created-tag.json'))['object']['sha'])
          PY
            )
            test "$actual" = "$TARGET_SHA"
            echo "TAG_CREATED_AT_CERTIFIED_SHA"
          else
            cat /tmp/tag-ref.json >&2 || true
            echo "Unexpected tag lookup HTTP status: $status" >&2
            exit 1
          fi

      - name: Dispatch installer workflow on the tag ref
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"ref":"desktop-v1.2.2"}' >/tmp/dispatch.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/actions/workflows/desktop-build.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
          echo "DESKTOP_V1_2_2_INSTALLER_WORKFLOW_DISPATCHED"
