name: Verify Live Meeting Lookup

on:
  push:
    branches:
      - verify/live-meeting-lookup-a9cbc225
    paths:
      - .github/workflows/_verify-live-meeting-lookup.yml

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9cbc225cfd50b014032d80df7912bfe61eb03d2
          fetch-depth: 1

      - name: Read deployed public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const source=fs.readFileSync('assets/js/supabase-config.js','utf8');
          const url=source.match(/url:\s*["']([^"']+)["']/)?.[1];
          const key=source.match(/anonKey:\s*["']([^"']+)["']/)?.[1];
          if(!url||!key)throw new Error('Public Supabase config not found');
          console.log(`SUPABASE_URL=${url}`);
          console.log(`SUPABASE_PUBLIC_KEY=${key}`);
          NODE

      - name: Discover public meetings columns with zero-row selects
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            id meeting_id room_id meeting_code code room host_id owner_id user_id created_by
            passcode password waiting_room waiting_room_enabled active status starts_at start_time
            title topic meeting_type personal_room_id is_personal created_at updated_at
          )
          for col in "${candidates[@]}"; do
            status=$(curl -sS -o "/tmp/col-${col}.json" -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/meetings?select=${col}&limit=0" \
              -H "apikey: $SUPABASE_PUBLIC_KEY" \
              -H "Authorization: Bearer $SUPABASE_PUBLIC_KEY" \
              -H 'Accept: application/json')
            if [ "$status" = "200" ] || [ "$status" = "206" ]; then
              echo "COLUMN_EXISTS=${col}"
            else
              message=$(cat "/tmp/col-${col}.json" | tr '\n' ' ')
              echo "COLUMN_MISSING_OR_DENIED=${col} HTTP=${status} ${message}"
            fi
          done

      - name: Confirm current production resolver failure mode
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/lookup.json -w '%{http_code}' \
            -X POST 'https://dominionstarld.com/.netlify/functions/resolve-meeting-join' \
            -H 'content-type: application/json' \
            --data '{"room":"238 910 3606","passcode":"360"}')
          echo "RESOLVER_HTTP_STATUS=$status"
          cat /tmp/lookup.json; echo
