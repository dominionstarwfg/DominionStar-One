name: DominionStar Desktop Manual QA Artifact

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Certified Netlify PR preview origin"
        required: true
        default: "https://deploy-preview-82--melodious-buttercream-a99450.netlify.app"
      reason:
        description: "Release-candidate reason"
        required: false
        default: "manual QA candidate"

permissions:
  contents: read

concurrency:
  group: dominionstar-desktop-manual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-manual-qa:
    name: macOS Signed Manual QA Artifact
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Verify and bind this QA build to the certified PR preview
        env:
          QA_PREVIEW_ORIGIN: ${{ inputs.preview_url }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const origin=String(process.env.QA_PREVIEW_ORIGIN||'').replace(/\/$/,'');
          const url=new URL(origin);
          if(url.protocol!=='https:' || !/^deploy-preview-\d+--melodious-buttercream-a99450\.netlify\.app$/.test(url.hostname)){
            throw new Error(`Refusing untrusted QA preview origin: ${origin}`);
          }
          const replaceOnce=(path,from,to)=>{
            let text=fs.readFileSync(path,'utf8');
            if(!text.includes(from)) throw new Error(`Expected QA binding marker missing in ${path}`);
            fs.writeFileSync(path,text.replace(from,to));
          };
          const prodHosts="const TRUSTED_HOSTS = new Set(['dominionstarld.com', 'www.dominionstarld.com']);";
          replaceOnce('src/main-v2.mjs',"const APP_ORIGIN = 'https://dominionstarld.com';",`const APP_ORIGIN = '${url.origin}';`);
          replaceOnce('src/main-v2.mjs',prodHosts,`const TRUSTED_HOSTS = new Set(['${url.hostname}']);`);
          replaceOnce('src/preload.cjs',"const TRUSTED_ORIGINS = new Set(['https://dominionstarld.com', 'https://www.dominionstarld.com']);",`const TRUSTED_ORIGINS = new Set(['${url.origin}']);`);
          replaceOnce('src/presenter-dock.mjs',"const TRUSTED_HOSTS=new Set(['dominionstarld.com','www.dominionstarld.com']);",`const TRUSTED_HOSTS=new Set(['${url.hostname}']);`);
          replaceOnce('src/remote-control-dialog.mjs',prodHosts,`const TRUSTED_HOSTS = new Set(['${url.hostname}']);`);
          replaceOnce('src/slide-control-native.mjs',prodHosts,`const TRUSTED_HOSTS = new Set(['${url.hostname}']);`);
          replaceOnce('src/screen-permission-lifecycle.mjs',prodHosts,`const TRUSTED_HOSTS = new Set(['${url.hostname}']);`);
          for(const path of ['src/main-v2.mjs','src/preload.cjs','src/presenter-dock.mjs','src/remote-control-dialog.mjs','src/slide-control-native.mjs','src/screen-permission-lifecycle.mjs']){
            if(!fs.readFileSync(path,'utf8').includes(url.hostname)) throw new Error(`QA preview trust did not reach ${path}`);
          }
          console.log(`DOMINIONSTAR_QA_PREVIEW_BOUND ${url.origin}`);
          console.log(`DOMINIONSTAR_QA_SCREEN_PERMISSION_TRUST_OK ${url.hostname}`);
          NODE

      - name: Verify selected PR preview is reachable
        env:
          QA_PREVIEW_ORIGIN: ${{ inputs.preview_url }}
        run: |
          curl --fail --silent --show-error --location --max-time 15 \
            "${QA_PREVIEW_ORIGIN%/}/meet/release-contract.json" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);if(!c.releaseId||!c.desktopBridge)process.exit(2);console.log('QA_PREVIEW_CONTRACT_OK',c.releaseId,c.desktopBridge)})"

      - name: Confirm Intel runner parity
        run: |
          test "$(uname -m)" = "x86_64"
          sw_vers
          uname -m

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Install locked dependencies
        run: npm ci

      - name: Require stable macOS signing and notarization identity
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "ERROR: $name is required; unsigned QA builds cannot certify macOS privacy permission stability." >&2; exit 1; }
          done
          echo "DOMINIONSTAR_QA_STABLE_SIGNING_CREDENTIALS_PRESENT"

      - name: Enforce release trust policy
        run: node scripts/verify-release-trust.mjs

      - name: Enforce publisher trust policy
        run: node scripts/verify-publisher-trust.mjs

      - name: Audit production dependency supply chain
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare native replacement tooling
        run: chmod 0755 build/pkg-scripts/preinstall build/pkg-scripts/postinstall scripts/build-macos-pkg.sh scripts/test-macos-pkg.sh scripts/test-live-meet-contract.sh scripts/audit-live-hosted-runtime.sh

      - name: Run clean-runtime certification against QA-bound source
        run: npm run verify

      - name: Build signed and notarized universal macOS app, DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify Developer ID signature and notarization
        run: |
          set -euo pipefail
          APP="dist/mac-universal/DominionStar Meet.app"
          DMG=$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -d "$APP"
          test -n "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/dominionstar-codesign.txt
          grep -q "Authority=Developer ID Application:" /tmp/dominionstar-codesign.txt
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "DOMINIONSTAR_QA_DEVELOPER_ID_NOTARIZATION_OK"

      - name: Build deterministic Apple replacement PKG
        run: npm run dist:mac:pkg

      - name: Enforce installer size budget
        run: node scripts/audit-artifact-sizes.mjs dist

      - name: Install over stale v1.1.8 and launch the installed app
        run: bash scripts/test-macos-pkg.sh

      - name: Reinstall and prove actual app passes selected Meet contract
        run: bash scripts/test-live-meet-contract.sh

      - name: Upload signed manual-QA DMG
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-signed-preview-macos-dmg-qa
          path: desktop 2/dist/*.dmg
          if-no-files-found: error
          retention-days: 1

      - name: Upload manual-QA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-signed-preview-macos-zip-qa
          path: |
            desktop 2/dist/*.zip
            desktop 2/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
