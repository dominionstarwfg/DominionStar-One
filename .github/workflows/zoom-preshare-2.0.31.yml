name: DominionStar Meet Zoom Preshare 2.0.31

on:
  pull_request:
    paths:
      - 'meet-desktop/package.json'
      - 'meet-desktop/ui/share-picker.html'
      - 'meet-desktop/ui/share-picker.css'
      - 'meet-desktop/ui/share-picker.js'
      - 'meet-desktop/scripts/verify-zoom-preshare-2.0.31.mjs'
      - '.github/workflows/zoom-preshare-2.0.31.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zoom-preshare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Zoom-style pre-share authority
        working-directory: meet-desktop
        run: |
          node --check ui/share-picker.js
          node --check scripts/verify-zoom-preshare-2.0.31.mjs
          node scripts/verify-zoom-preshare-2.0.31.mjs
          node scripts/verify-share-picker-2.0.25.mjs
