name: DominionStar — review-only Netlify build package

on:
  push:
    branches:
      - review/notification-readability-20261029
    paths:
      - 'scripts/build-public-netlify.sh'
      - 'scripts/check-staging-public-dist.mjs'
      - 'scripts/check-agent-release-gates.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'member-dashboard/**'
      - 'feed/**'
      - 'assets/css/dominionstar-feed-flow.css'
      - 'tests/feed-natural-post-flow-review.test.mjs'
      - 'account-settings/**'
      - 'direct-messages/**'
      - 'professional-profile/**'
      - 'notifications/**'
      - 'recognition/**'
      - 'community/**'
      - 'community-chat/**'
      - 'appointments/**'
      - 'member-directory/**'
      - 'founder-control/**'
      - 'founder-dashboard/**'
      - 'agent-journey/**'
      - 'agent-learning/**'
      - 'workspace/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'netlify/functions/**'
      - 'meet-desktop/ui/**'
      - '_redirects'
      - '_headers'
      - 'netlify.toml'
      - 'journey/**'
      - '.github/workflows/review-public-build-package.yml'
      - '.github/workflows/public-site-production-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-public-netlify.sh'
      - 'scripts/check-staging-public-dist.mjs'
      - 'scripts/check-agent-release-gates.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'member-dashboard/**'
      - 'feed/**'
      - 'assets/css/dominionstar-feed-flow.css'
      - 'tests/feed-natural-post-flow-review.test.mjs'
      - 'account-settings/**'
      - 'direct-messages/**'
      - 'professional-profile/**'
      - 'notifications/**'
      - 'recognition/**'
      - 'community/**'
      - 'community-chat/**'
      - 'appointments/**'
      - 'member-directory/**'
      - 'founder-control/**'
      - 'founder-dashboard/**'
      - 'agent-journey/**'
      - 'agent-learning/**'
      - 'workspace/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'netlify/functions/**'
      - 'meet-desktop/ui/**'
      - '_redirects'
      - '_headers'
      - 'netlify.toml'
      - 'journey/**'
      - '.github/workflows/review-public-build-package.yml'
      - '.github/workflows/public-site-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build & validate review package — never deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review package
        uses: actions/checkout@v4
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm unconfigured Netlify previews are static visual reviews and backend-free
        shell: bash
        run: |
          preview="$(mktemp -d)"
          trap 'rm -rf "$preview"' EXIT
          cp -a . "$preview/repo"
          (
            cd "$preview/repo"
            NETLIFY=true CONTEXT=deploy-preview bash scripts/build-public-netlify.sh >/tmp/ds-preview-isolated.log 2>&1
            grep -Fq "DOMINIONSTAR_DEPLOY_PREVIEW_STATIC_VISUAL_OK" /tmp/ds-preview-isolated.log
            grep -Fq 'content="0;url=/member-dashboard/"' public-dist/index.html
            grep -Fq "Visual review hub" public-dist/visual-review/index.html
            grep -Fq 'href="/member-dashboard/"' public-dist/visual-review/index.html
            grep -Fq 'href="/feed/"' public-dist/visual-review/index.html
            grep -Fq 'href="/direct-messages/"' public-dist/visual-review/index.html
            grep -Fq 'href="/notifications/"' public-dist/visual-review/index.html
            grep -Fq 'href="/community/"' public-dist/visual-review/index.html
            grep -Fq 'href="/professional-profile/"' public-dist/visual-review/index.html
            grep -Fq 'href="/account-settings/"' public-dist/visual-review/index.html
            test -s public-dist/member-dashboard/index.html
            test -s public-dist/feed/index.html
            test -s public-dist/direct-messages/index.html
            test -s public-dist/notifications/index.html
            test -s public-dist/community/index.html
            grep -Fq 'dominionstar-visual-review.css' public-dist/member-dashboard/index.html
            grep -Fq 'dominionstar-visual-review-fixtures.js' public-dist/member-dashboard/index.html
            grep -Fq 'dominionstar-social-preview-refinement.css' public-dist/member-dashboard/index.html
            grep -Fq 'dominionstar-social-preview-interactions.js' public-dist/feed/index.html
            test -s public-dist/assets/css/dominionstar-social-preview-refinement.css
            test -s public-dist/assets/js/dominionstar-social-preview-interactions.js
            grep -Fq 'dsos-body dsos-executive ds-visual-review' public-dist/member-dashboard/index.html
            if grep -Fq 'ds-auth-os-shell-active' public-dist/member-dashboard/index.html; then
              echo 'Dashboard preview must not double-apply authenticated shell spacing' >&2
              exit 1
            fi
            echo 'DASHBOARD_PREVIEW_SINGLE_SHELL_OK'
            grep -Fq 'resultLimit' public-dist/assets/js/dashboard-social.js || true
            grep -Fq 'ds-review-event-visual' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'Team Member' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'ds-review-post-photo' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq '/assets/founder-blue.jpeg' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'Real growth comes from consistency' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'const likeBadge=' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'const loveBadge=' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            echo 'CAPTIONED_PHOTO_POST_PREVIEW_OK'
            grep -Fq 'const commentAction=' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'const repostAction=' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'const shareAction=' public-dist/assets/js/dominionstar-visual-review-fixtures.js
            grep -Fq 'ds-review-action-icon' public-dist/assets/css/dominionstar-visual-review.css
            echo 'ICON_FIRST_SOCIAL_ACTIONS_OK'
            grep -Fq 'connect-src' public-dist/_headers
            grep -Fq "'none'" public-dist/_headers
            grep -Fq "Disallow: /" public-dist/robots.txt
            if find netlify/functions -type f -print -quit | grep -q .; then
              echo "Preview function source survived static visual review build" >&2
              exit 1
            fi
          )
          echo "UNCONFIGURED_PREVIEW_STATIC_VISUAL_ISOLATED_OK"
      - name: Confirm current review branch cannot inherit live backend
        shell: bash
        run: |
          set +e
          CONTEXT=production BRANCH=review/notification-readability-20261029 NETLIFY=true bash scripts/build-public-netlify.sh >/tmp/ds-staging-site-blocked.log 2>&1
          result=$?
          set -e
          test "$result" -eq 47
          grep -Fq "non-production deploy blocked until isolated Netlify/Supabase staging is configured" /tmp/ds-staging-site-blocked.log
          echo "REVIEW_BRANCH_PRODUCTION_CONTEXT_BLOCKED_OK"
      - name: Build Netlify static distribution without deployment
        run: bash scripts/build-public-netlify.sh
      - name: Validate assembled static routes and private-source exclusions
        run: node scripts/check-staging-public-dist.mjs
      - name: Verify synthetic isolated-staging rewrite without publishing
        shell: bash
        env:
          DOMINIONSTAR_STAGING_NETLIFY_SITE_ID: synthetic-review-site
          DOMINIONSTAR_PRODUCTION_NETLIFY_SITE_ID: synthetic-production-site
          NETLIFY_SITE_ID: synthetic-review-site
          DOMINIONSTAR_STAGING_SITE_URL: https://dominionstar-qa-rehearsal.netlify.app
          DOMINIONSTAR_STAGING_SUPABASE_URL: https://abcdefghijabcdefghij.supabase.co
          DOMINIONSTAR_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_REHEARSAL_VALUE_NOT_REAL
          DOMINIONSTAR_STAGING_ISOLATION_APPROVED: STAGING_ONLY
        run: |
          rehearsal="$(mktemp -d)"
          trap 'rm -rf "$rehearsal"' EXIT
          cp -a public-dist "$rehearsal/public-dist"
          STAGING_REHEARSAL_DIR="$rehearsal/public-dist" node --input-type=module -e "import { stageReviewPackage } from './scripts/prepare-isolated-staging.mjs'; const result = stageReviewPackage({dist:process.env.STAGING_REHEARSAL_DIR}); if(!result.isolated)process.exit(1); console.log('STAGING_ISOLATION_REHEARSAL_OK: '+result.filesChecked+' static files verified')"
      - name: Upload short-lived review package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-review-static-public-dist
          path: public-dist/
          if-no-files-found: error
          retention-days: 3
