name: DominionStar Meet Runtime Verification

on:
  pull_request:
    paths:
      - "assets/js/meeting-engine.js"
      - "assets/js/meet/**"
      - "assets/js/meet-next/**"
      - "assets/css/meet/**"
      - "assets/css/meet-next/**"
      - "meet/**"
      - "scripts/test-*meet*.mjs"
      - "scripts/test-camera-privacy-and-native-picker.mjs"
      - "scripts/test-media-stability-guardrails.mjs"
      - "scripts/test-live-sync-regression.mjs"
      - "scripts/test-two-client-authority.mjs"
      - "scripts/test-waiting-room-surgical.mjs"
      - ".github/workflows/meet-runtime-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-meet-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Media, Waiting Room, Share and Link Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax validation
        run: |
          node --check assets/js/meeting-engine.js
          node --check assets/js/meet-next/executive6.js
          node --check assets/js/meet/desktop-share-picker.js
          node --check assets/js/meet/dock-layout-v2.js
          node --check netlify/functions/resolve-meeting-join.mjs

      - name: Camera privacy and native share picker
        run: node scripts/test-camera-privacy-and-native-picker.mjs

      - name: Media stability guardrails
        run: node scripts/test-media-stability-guardrails.mjs

      - name: Waiting room authority and lifecycle
        run: node scripts/test-waiting-room-surgical.mjs

      - name: Two-client host and co-host authority
        run: node scripts/test-two-client-authority.mjs

      - name: Live synchronization regression contract
        run: node scripts/test-live-sync-regression.mjs

      - name: Production camera, Pause Share and invitation behavior
        run: node scripts/test-production-meet-rc13.mjs

      - name: Release contract integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          contract=json.loads(Path('meet/release-contract.json').read_text())
          expected='2026.08.16-rc13.0-media-share-link-stability'
          if contract.get('releaseId') != expected:
              raise SystemExit(f"Unexpected Meet releaseId: {contract.get('releaseId')!r}")
          for rel in [
              'assets/js/meeting-engine.js',
              'assets/js/meet-next/executive6.js',
              'meet/index.html',
          ]:
              actual=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              expected_hash=contract.get('files',{}).get(rel)
              if actual != expected_hash:
                  raise SystemExit(f'{rel}: source hash {actual} != release contract {expected_hash}')
              print('HASH OK', rel, actual)
          PY

      - name: Verify current live desktop contract remains compatible
        working-directory: desktop 2
        run: bash scripts/audit-live-hosted-runtime.sh
