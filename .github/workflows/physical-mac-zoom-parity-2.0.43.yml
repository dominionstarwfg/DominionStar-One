name: DominionStar Meet Physical Mac Parity 2.0.44

on:
  pull_request:
    branches: [main]
    paths:
      - 'meet-desktop/**'
      - '.github/workflows/physical-mac-zoom-parity-2.0.43.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-physical-mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-mac-parity:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
      DOMINIONSTAR_QA_INTERACTION_FIXTURES: '1'
    steps:
      - name: Checkout exact physical Mac candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean generated state
        run: |
          rm -rf meet-desktop/node_modules meet-desktop/dist qa-artifact
          find . -maxdepth 2 \( -name '*.dmg' -o -name '*.pkg' -o -name '*.zip' \) -print0 | xargs -0 -I{} rm -f '{}' || true

      - name: Install exact rebuild dependencies
        working-directory: meet-desktop
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Resolve candidate version
        id: meta
        working-directory: meet-desktop
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Verify physical Mac source contract
        working-directory: meet-desktop
        run: |
          node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number); if(!(a>2||(a===2&&(b>0||(b===0&&c>=44))))) process.exit(1);"
          node --check src/preload.cjs
          node --check src/share-service.mjs
          node --check src/mac-share-presenter-overlay.mjs
          node --check ui/share-controller.js
          node --check ui/share-integration.js
          node --check ui/mac-presenter-toolbar.js
          node --check ui/meeting-feature-ready-2.0.41.js
          node --check scripts/verify-physical-mac-zoom-parity-2.0.43.mjs
          node scripts/verify-physical-mac-zoom-parity-2.0.43.mjs

      - name: Build clean universal Mac QA app
        working-directory: meet-desktop
        run: npx electron-builder --mac dir --universal --publish never

      - name: Locate packaged app
        id: app
        shell: bash
        run: |
          APP_PATH="$(find meet-desktop/dist -maxdepth 3 -type d -name 'DominionStar Meet.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Diagnose presenter loop with native surfaces hidden
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_KEEP_MAC_PRESENTER_HIDDEN: '1'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose capture worker prepare boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-prepare-only'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose capture worker message boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-message-only'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose detached worker lifecycle boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-detached-lifecycle'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose acknowledged worker lifecycle boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-ack-only'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose acknowledged worker with controller listeners
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-ack-with-listeners'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose controller immediately after worker acquire
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'controller-after-acquire'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose controller before worker-active commit
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'controller-before-worker-active'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose share controller before presenter handshake
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'controller-worker-no-handshake'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose capture worker boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-only'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose capture-started event boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'capture-event-only'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose combined active-share boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-plus-event'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Diagnose presenter state fan-out boundary
        working-directory: meet-desktop
        env:
          DOMINIONSTAR_QA_ACTIVE_SHARE_DIAGNOSTIC: 'worker-plus-event-plus-state'
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Exercise packaged presenter command round trip
        working-directory: meet-desktop
        run: node scripts/verify-packaged-presenter-toolbar-roundtrip-2.0.22.mjs "../${{ steps.app.outputs.path }}"

      - name: Exercise packaged physical meeting acceptance
        working-directory: meet-desktop
        run: node scripts/verify-packaged-physical-acceptance.mjs "../${{ steps.app.outputs.path }}"

      - name: Create physical Mac QA installers
        shell: bash
        run: |
          mkdir -p qa-artifact
          APP="${{ steps.app.outputs.path }}"
          ZIP="qa-artifact/DominionStar-Meet-${{ steps.meta.outputs.version }}-Physical-Mac-QA.zip"
          DMG="qa-artifact/DominionStar-Meet-${{ steps.meta.outputs.version }}-Physical-Mac-QA.dmg"
          STAGE="$RUNNER_TEMP/dominionstar-physical-dmg-root"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          ditto "$APP" "$STAGE/DominionStar Meet.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DominionStar Meet" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$ZIP" "$DMG" | tee qa-artifact/SHA256.txt
          du -h "$ZIP" "$DMG"

      - name: Upload physical Mac QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-physical-mac-qa
          path: qa-artifact/*
          if-no-files-found: error
          retention-days: 14
