<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090d14">
  <title>DominionStar Meet · Secure Google Sign-In</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d14;color:#f3f5f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#263249,#111722 42%,#090d14 78%)}main{width:min(460px,calc(100vw - 36px));padding:34px;border:1px solid #334055;border-radius:22px;background:#111925;box-shadow:0 32px 90px #0009;text-align:center}img{width:62px;height:62px;border-radius:16px;object-fit:cover}h1{margin:18px 0 8px;font-size:23px}p{margin:0;color:#aeb8c7;line-height:1.55}.status{margin-top:20px;padding:13px;border:1px solid #ffffff14;border-radius:12px;background:#0b111b;color:#e3bd55;font-size:13px}.error{color:#ff8e96}button{margin-top:17px;border:1px solid #d6ab43;border-radius:10px;padding:10px 15px;background:#d6ab43;color:#171208;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
<main>
  <img src="/assets/logo.jpeg" alt="DominionStar">
  <h1>Returning to DominionStar Meet</h1>
  <p>Google sign-in opens in this browser, then returns securely to the installed DominionStar Meet app.</p>
  <div id="status" class="status">Preparing secure Google sign-in…</div>
  <button id="retry" type="button" hidden>Try Again</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js?v=2-meet-auth"></script>
<script>
(async()=>{
  'use strict';
  const status=document.getElementById('status'),retry=document.getElementById('retry');
  const fail=message=>{status.textContent=message;status.classList.add('error');retry.hidden=false;};
  const begin=async()=>{
    retry.hidden=true;status.classList.remove('error');status.textContent='Opening Google…';
    try{
      if(!window.supabase?.createClient||!window.DOMINIONSTAR_SUPABASE?.url||!window.DOMINIONSTAR_SUPABASE?.anonKey)throw new Error('DominionStar authentication could not initialize.');
      // Session storage survives the Google/Supabase round trip in this browser
      // tab, but is isolated from unrelated tabs and ordinary public visitors.
      sessionStorage.setItem('ds_desktop_oauth_return_v1','1');
      const client=window.supabase.createClient(window.DOMINIONSTAR_SUPABASE.url,window.DOMINIONSTAR_SUPABASE.anonKey,{auth:{detectSessionInUrl:false,persistSession:false,autoRefreshToken:false}});
      const {data,error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:'https://dominionstarld.com/',skipBrowserRedirect:true,queryParams:{prompt:'select_account'}}});
      if(error)throw error;if(!data?.url)throw new Error('Google sign-in URL was not returned.');
      window.location.assign(data.url);
    }catch(error){sessionStorage.removeItem('ds_desktop_oauth_return_v1');fail(error?.message||'Google sign-in could not start.');}
  };
  retry.addEventListener('click',()=>void begin());
  await begin();
})();
</script>
</body>
</html>
