name: DominionStar Desktop Manual QA Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-manual-qa.yml"
      - "desktop 2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-desktop-manual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-manual-qa:
    name: macOS Manual QA Artifact
    runs-on: macos-26-intel
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Confirm Intel runner parity
        run: |
          test "$(uname -m)" = "x86_64"
          sw_vers
          uname -m

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce release trust policy
        run: node scripts/verify-release-trust.mjs

      - name: Enforce publisher trust policy
        run: node scripts/verify-publisher-trust.mjs

      - name: Audit production dependency supply chain
        run: npm audit --omit=dev --audit-level=high

      - name: Audit live hosted Meet runtime
        run: bash scripts/audit-live-hosted-runtime.sh

      - name: Prepare native replacement tooling
        run: chmod 0755 build/pkg-scripts/preinstall build/pkg-scripts/postinstall scripts/build-macos-pkg.sh scripts/test-macos-pkg.sh scripts/test-live-meet-contract.sh scripts/audit-live-hosted-runtime.sh

      - name: Run clean-runtime certification
        run: npm run verify

      - name: Build universal macOS app, DMG and ZIP
        run: npm run dist:mac

      - name: Build deterministic Apple replacement PKG
        run: npm run dist:mac:pkg

      - name: Enforce installer size budget
        run: node scripts/audit-artifact-sizes.mjs dist

      - name: Install over stale v1.1.8 and launch the installed app
        run: bash scripts/test-macos-pkg.sh

      - name: Reinstall and prove actual app passes live Meet contract
        run: bash scripts/test-live-meet-contract.sh

      - name: Upload manual-QA DMG
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-macos-dmg-qa
          path: desktop 2/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload manual-QA PKG
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-macos-pkg-qa
          path: desktop 2/dist/*.pkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload manual-QA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-macos-zip-qa
          path: |
            desktop 2/dist/*.zip
            desktop 2/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7
