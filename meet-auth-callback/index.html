<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Return to DominionStar Meet</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07101d;color:#f7f8fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#18243a 0,#08111f 44%,#03070e 100%);padding:24px}
    main{width:min(460px,100%);padding:34px;border:1px solid #ffffff1f;border-radius:24px;background:#0c1524e8;box-shadow:0 28px 90px #0009;text-align:center}
    img{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:14px}
    .eyebrow{margin:0 0 10px;color:#f0c95f;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0 0 12px;font-size:30px;line-height:1.1}
    p{margin:0;color:#aeb9ca;line-height:1.6}
    button{margin-top:22px;width:100%;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#f2cf66,#d8a92e);color:#12161d;font:inherit;font-weight:850;cursor:pointer}
    button:focus-visible{outline:3px solid #86b7ff;outline-offset:3px}
    .note{margin-top:14px;font-size:12px;color:#7f8ca0}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo.jpeg" alt="DominionStar">
    <p class="eyebrow">DominionStar Meet</p>
    <h1>Returning to the desktop app</h1>
    <p id="status">Finishing secure Google sign-in…</p>
    <button id="openApp" type="button" hidden>Open DominionStar Meet</button>
    <p class="note">This page only returns authentication to the installed DominionStar Meet app.</p>
  </main>
  <script>
  (()=>{
    const status=document.getElementById('status');
    const openButton=document.getElementById('openApp');
    const hash=String(window.location.hash||'');
    const hashParams=new URLSearchParams(hash.replace(/^#/,''));
    const query=new URLSearchParams(window.location.search);
    const error=query.get('error')||hashParams.get('error')||'';
    const errorDescription=query.get('error_description')||hashParams.get('error_description')||'';
    const hasSession=Boolean(hashParams.get('access_token')&&hashParams.get('refresh_token'));

    const deepLink=new URL('dominionstar://auth/callback');
    if(error){
      deepLink.searchParams.set('error',error.slice(0,120));
      if(errorDescription)deepLink.searchParams.set('error_description',errorDescription.slice(0,240));
    }
    if(hash)deepLink.hash=hash;

    // OAuth tokens are fragment-only credentials. Once the deep-link target is
    // constructed, remove them from the browser address bar before launching the app.
    try{history.replaceState(null,'',`${window.location.pathname}?desktop=1`);}catch{}

    const launch=()=>{
      try{window.location.assign(deepLink.toString());}catch{}
      setTimeout(()=>{
        openButton.hidden=false;
        status.textContent=error
          ? (errorDescription||'Google sign-in did not complete. Return to DominionStar Meet and try again.')
          : 'If DominionStar Meet did not open automatically, use the button below.';
      },900);
    };

    openButton.addEventListener('click',launch);

    if(hasSession||error){
      setTimeout(launch,120);
      return;
    }

    deepLink.searchParams.set('error','missing_oauth_session');
    status.textContent='Google returned without a usable desktop session. Return to DominionStar Meet and try again.';
    openButton.hidden=false;
  })();
  </script>
</body>
</html>
