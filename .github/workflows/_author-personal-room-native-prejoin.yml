name: Author Personal Room Native Prejoin

on:
  push:
    branches:
      - fix/personal-room-native-prejoin
    paths:
      - .github/workflows/_author-personal-room-native-prejoin.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/personal-room-native-prejoin
          fetch-depth: 0

      - name: Apply Personal Room and native permission integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          author=Path('scripts/_author_personal_room_native_prejoin.py')
          author.write_text(author.read_text().replace("Desktop prejoin bootstrap\\n", "Desktop prejoin bootstrap contract\\n"))
          PY
          python3 scripts/_author_personal_room_native_prejoin.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-desktop-prejoin-bootstrap.mjs')
          text=p.read_text()
          old='/assets/js/meet/hotfix-rc13-1-media-prejoin.js?v=2-desktop-bootstrap'
          new='/assets/js/meet/hotfix-rc13-1-media-prejoin.js?v=3-native-permission-personal'
          if old not in text:
              raise SystemExit('legacy desktop prejoin cache assertion marker missing')
          p.write_text(text.replace(old,new,1))
          PY
          node --check assets/js/meet/hotfix-rc13-1-media-prejoin.js
          node --check assets/js/meet-next/personal-room.js
          node scripts/test-personal-room-native-prejoin.mjs
          node scripts/test-desktop-prejoin-bootstrap.mjs

      - name: Commit authored product candidate
        shell: bash
        run: |
          set -euo pipefail
          # Workflow changes are written separately through the trusted GitHub connector.
          git checkout -- .github/workflows/meet-runtime-verify.yml
          git config user.name 'DominionStar Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add meet-home/index.html meet/index.html meet/release-contract.json \
            assets/js/meet/hotfix-rc13-1-media-prejoin.js \
            assets/js/meet-next/personal-room.js \
            scripts/test-personal-room-native-prejoin.mjs \
            scripts/test-desktop-prejoin-bootstrap.mjs
          git diff --cached --check
          git commit -m 'Restore Personal Room and native desktop prejoin permissions'
          git push origin HEAD:fix/personal-room-native-prejoin
