name: DominionStar Meet Realtime Transport Verification

on:
  pull_request:
    paths:
      - "assets/js/meeting-engine.js"
      - "meet/index.html"
      - "meet/release-contract.json"
      - "scripts/test-meet-realtime-transport-isolation.mjs"
      - ".github/workflows/meet-realtime-transport-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-meet-realtime-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Desktop Browser Realtime Isolation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax validation
        run: node --check assets/js/meeting-engine.js

      - name: Prove account authentication cannot own meeting transport
        run: node scripts/test-meet-realtime-transport-isolation.mjs

      - name: Re-run waiting room authority contract
        run: node scripts/test-waiting-room-surgical.mjs

      - name: Re-run two-client authority contract
        run: node scripts/test-two-client-authority.mjs
