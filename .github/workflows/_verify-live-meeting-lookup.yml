name: Verify Live Meeting Lookup

on:
  push:
    branches:
      - verify/live-meeting-lookup-a9cbc225
    paths:
      - .github/workflows/_verify-live-meeting-lookup.yml

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a9cbc225cfd50b014032d80df7912bfe61eb03d2
          fetch-depth: 1

      - name: Read deployed public Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const source=fs.readFileSync('assets/js/supabase-config.js','utf8');
          const url=source.match(/url:\s*["']([^"']+)["']/)?.[1];
          const key=source.match(/anonKey:\s*["']([^"']+)["']/)?.[1];
          if(!url||!key)throw new Error('Public Supabase config not found');
          console.log(`SUPABASE_URL=${url}`);
          console.log(`SUPABASE_PUBLIC_KEY=${key}`);
          NODE

      - name: Discover room and passcode columns with zero-row selects
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            room_code join_code access_code meeting_passcode room_passcode join_passcode
            access_passcode pin host_key password_hash passcode_hash require_passcode
            started_at ended_at scheduled_at scheduled_for starts_at expires_at
          )
          for col in "${candidates[@]}"; do
            status=$(curl -sS -o "/tmp/col-${col}.json" -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/meetings?select=${col}&limit=0" \
              -H "apikey: $SUPABASE_PUBLIC_KEY" \
              -H "Authorization: Bearer $SUPABASE_PUBLIC_KEY" \
              -H 'Accept: application/json')
            if [ "$status" = "200" ] || [ "$status" = "206" ]; then
              echo "COLUMN_EXISTS=${col}"
            else
              message=$(cat "/tmp/col-${col}.json" | tr '\n' ' ')
              echo "COLUMN_MISSING_OR_DENIED=${col} HTTP=${status} ${message}"
            fi
          done

      - name: Read only the exact supplied room using confirmed public fields
        shell: bash
        env:
          ROOM: '2389103606'
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/exact-room.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/meetings?select=id,room_code,host_id,waiting_room_enabled,status,title,created_at&room_code=eq.${ROOM}&limit=1" \
            -H "apikey: $SUPABASE_PUBLIC_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLIC_KEY" \
            -H 'Accept: application/json')
          echo "EXACT_ROOM_HTTP_STATUS=$status"
          cat /tmp/exact-room.json; echo
