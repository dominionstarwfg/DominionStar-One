name: Author Meet Media + Future Share UI Candidate

on:
  push:
    branches:
      - fix/meet-media-share-future-ui
    paths:
      - .github/workflows/_author-meet-media-share-future-ui.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meet-media-share-future-ui
          fetch-depth: 0

      - name: Apply integrated media/share corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:90]!r}')
              s=s.replace(old,new,count)
              p.write_text(s)

          # Desktop: force DominionStar's own source picker instead of the small
          # macOS/Electron system overlay that exposed own-window choices.
          main=Path('desktop 2/src/main-v2.mjs')
          s=main.read_text()
          s=re.sub(r"function supportsMacSystemPicker\(\) \{.*?\n\}", """function supportsMacSystemPicker() {
            // DominionStar owns the desktop sharing UX on every supported Mac.
            // The macOS system picker exposes a tiny generic overlay and can offer
            // the protected meeting window itself, which produces a dark capture.
            return false;
          }""", s, count=1, flags=re.S)
          old="""ipcMain.on('desktop:presenter-command', (event, command = '') => {
            if (event.sender !== presenterWindow?.webContents) return;
            const allowed = new Set(['audio', 'video', 'participants', 'chat', 'reactions', 'pause', 'new-share', 'more', 'stop']);
            const safe = String(command || '');
            if (allowed.has(safe) && mainWindow && !mainWindow.isDestroyed()) {
              mainWindow.webContents.send('desktop:presenter-command', safe);
            }
          });"""
          new="""ipcMain.on('desktop:presenter-command', (event, command = '') => {
            if (event.sender !== presenterWindow?.webContents) return;
            const allowed = new Set(['audio', 'video', 'participants', 'chat', 'reactions', 'raise-hand', 'pause', 'new-share', 'settings', 'return-meeting', 'stop']);
            const safe = String(command || '');
            if (!allowed.has(safe) || !mainWindow || mainWindow.isDestroyed()) return;
            if (safe === 'return-meeting') {
              hidePresenterWindow({ restoreMeeting: true });
              return;
            }
            mainWindow.webContents.send('desktop:presenter-command', safe);
            // Stop Share is a privacy/lifecycle boundary. Even if the hosted
            // renderer is slow or a capture track ended concurrently, the native
            // shell must return the user to a live, interactive meeting window.
            if (safe === 'stop') setTimeout(() => hidePresenterWindow({ restoreMeeting: true }), 900);
          });

          ipcMain.on('desktop:presenter-state', (event, value = {}) => {
            if (!isDesktopRoute(event.sender.getURL()) || event.sender !== mainWindow?.webContents) return;
            const state = {
              audio: value?.audio !== false,
              video: value?.video !== false,
              paused: Boolean(value?.paused),
              sharing: value?.sharing !== false,
              participantCount: Math.max(1, Math.min(999, Number(value?.participantCount) || 1))
            };
            if (presenterWindow && !presenterWindow.isDestroyed()) presenterWindow.webContents.send('desktop:presenter-state', state);
          });"""
          if old not in s: raise SystemExit('presenter-command block marker missing')
          main.write_text(s.replace(old,new,1))

          # Desktop release / bridge bump because the packaged shell changes.
          preload=Path('desktop 2/src/preload.cjs'); s=preload.read_text()
          s=s.replace("const RELEASE_VERSION = '1.2.2';", "const RELEASE_VERSION = '1.2.3';",1)
          s=s.replace('const BRIDGE_VERSION = 13;', 'const BRIDGE_VERSION = 14;',1)
          marker="""  hidePresenterToolbar: () => ipcRenderer.send('desktop:presenter-hide'),
          onPresenterCommand: callback => {"""
          repl="""  hidePresenterToolbar: () => ipcRenderer.send('desktop:presenter-hide'),
          updatePresenterState: state => ipcRenderer.send('desktop:presenter-state', state && typeof state === 'object' ? state : {}),
          onPresenterCommand: callback => {"""
          if marker not in s: raise SystemExit('preload presenter marker missing')
          preload.write_text(s.replace(marker,repl,1))

          # Presenter preload: state channel is read-only from the native shell.
          Path('desktop 2/src/presenter-preload.cjs').write_text("""const {contextBridge,ipcRenderer}=require('electron');

          contextBridge.exposeInMainWorld('presenterBridge',Object.freeze({
            command:value=>ipcRenderer.send('desktop:presenter-command',String(value||'')),
            resize:(width,height)=>ipcRenderer.send('desktop:presenter-resize',{width:Number(width),height:Number(height)}),
            onState:callback=>{
              if(typeof callback!=='function')return()=>{};
              const listener=(_event,state)=>callback(Object.freeze({...state}));
              ipcRenderer.on('desktop:presenter-state',listener);
              return()=>ipcRenderer.removeListener('desktop:presenter-state',listener);
            }
          }));
          """)

          # Futuristic native sharing toolbar: vector-only core controls, actual
          # state indicators, compact glass/depth composition, no emoji glyph UI.
          Path('desktop 2/src/presenter-toolbar.html').write_text(r'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DominionStar Presenter Controls</title>
          <style>
          *{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f8fbff;font:12px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.bar{height:74px;margin:3px;display:flex;align-items:center;border:1px solid #9bdcff2e;border-radius:21px;background:linear-gradient(115deg,#07111ef2,#0c1727ed 48%,#07101bf4);box-shadow:0 24px 70px #000b,0 0 0 1px #ffffff08 inset,0 0 44px #31c7ff14;-webkit-backdrop-filter:blur(24px) saturate(145%);backdrop-filter:blur(24px) saturate(145%);-webkit-app-region:drag;user-select:none;overflow:hidden}.status{height:100%;display:flex;align-items:center;gap:10px;padding:0 17px;border-right:1px solid #ffffff12;white-space:nowrap}.brand-orbit{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#21d4fd24,#0d233600 70%);border:1px solid #50d8ff43}.brand-orbit:before{content:"";width:9px;height:9px;border-radius:50%;background:#29e58c;box-shadow:0 0 0 5px #29e58c16,0 0 18px #29e58c88}.status-copy b{display:block;font-size:10px;letter-spacing:.15em;color:#f3ca60}.status-copy span{display:block;margin-top:3px;font-size:11px;color:#aebdd0}.controls{display:flex;align-items:center;gap:4px;padding:5px 7px;flex:1}.control{position:relative;min-width:66px;height:58px;padding:7px 8px;border:1px solid transparent;border-radius:14px;background:transparent;color:#dce8f6;cursor:pointer;-webkit-app-region:no-drag;transition:background .16s,border-color .16s,transform .16s}.control:hover{background:#ffffff0c;border-color:#ffffff16;transform:translateY(-1px)}.control svg{display:block;width:22px;height:22px;margin:0 auto 5px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.control small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}.control.is-off{color:#ff6378;background:#ff36540b}.control.is-paused{color:#ffd15d;background:#f4c84c0d}.control.primary-share{color:#66ebff}.control.stop{min-width:86px;margin-left:3px;color:#fff;background:linear-gradient(135deg,#ff3f62,#d91f47);border-color:#ff779044;box-shadow:0 8px 22px #c8174438}.control.stop:hover{background:linear-gradient(135deg,#ff5572,#e62950)}.media-slash{position:absolute;left:50%;top:10px;width:29px;height:2px;border-radius:2px;background:#ff4d67;transform:translateX(-50%) rotate(-43deg);box-shadow:0 0 8px #ff4d6766;display:none}.control.is-off .media-slash{display:block}.more-menu{position:fixed;right:92px;top:78px;width:245px;padding:8px;border:1px solid #8edcff26;border-radius:17px;background:linear-gradient(145deg,#0d1928fa,#07111df8);box-shadow:0 26px 70px #000c;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);-webkit-app-region:no-drag}.more-menu[hidden]{display:none}.more-menu button{display:flex;width:100%;align-items:center;gap:9px;padding:11px 12px;border:0;border-radius:11px;background:transparent;color:#eaf3ff;text-align:left;font-weight:700;cursor:pointer}.more-menu button:hover{background:#ffffff0c}.more-menu .danger{color:#ff8294}body.collapsed .bar{width:300px;margin-left:auto;margin-right:auto;height:46px;border-radius:15px}body.collapsed .controls{display:none}body.collapsed .status{flex:1;justify-content:center;border:0;padding:0 12px}body.collapsed .status-copy span{display:none}
          </style></head><body>
          <div class="bar"><div class="status"><span class="brand-orbit"></span><span class="status-copy"><b>DOMINIONSTAR MEET</b><span>Screen sharing active</span></span></div><div class="controls">
          <button class="control" data-command="audio" data-media="audio" aria-label="Mute or unmute"><span class="media-slash"></span><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg><small>Mute</small></button>
          <button class="control" data-command="video" data-media="video" aria-label="Start or stop video"><span class="media-slash"></span><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg><small>Stop Video</small></button>
          <button class="control" data-command="participants"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8M22 21v-2a4 4 0 0 0-3-3.8M16 3.2a4 4 0 0 1 0 7.6"/></svg><small>Participants</small></button>
          <button class="control" data-command="chat"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg><small>Chat</small></button>
          <button class="control" data-command="reactions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.4 1.8 3.5 1.8 3.5-1.8 3.5-1.8M9 9h.01M15 9h.01"/></svg><small>Reactions</small></button>
          <button class="control" data-command="pause" data-media="pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg><small>Pause</small></button>
          <button class="control primary-share" data-command="new-share"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M12 15V8M9 11l3-3 3 3M8 21h8"/></svg><small>New Share</small></button>
          <button class="control" data-command="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><small>More</small></button>
          <button class="control stop" data-command="stop"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><small>Stop Share</small></button></div></div>
          <div id="presenterMoreMenu" class="more-menu" hidden role="menu"><button data-command="return-meeting">Return to Meeting</button><button data-command="settings">Meeting Settings</button><button data-command="raise-hand">Raise / Lower Hand</button><button data-command="participants">Participants</button><button data-command="chat">Chat</button><button data-command="new-share">New Share</button><button data-command="stop" class="danger">Stop Share</button></div><script src="presenter-toolbar.js"></script></body></html>''')

          Path('desktop 2/src/presenter-toolbar.js').write_text("""const menu=document.getElementById('presenterMoreMenu');
          const more=document.querySelector('[data-command="more"]');
          const audio=document.querySelector('[data-media="audio"]');
          const video=document.querySelector('[data-media="video"]');
          const pause=document.querySelector('[data-media="pause"]');
          let collapseTimer=0;
          const expandedHeight=menu?350:80;
          const setLabel=(button,text)=>{const node=button?.querySelector('small');if(node)node.textContent=text;};
          const applyState=state=>{
            if(audio){audio.classList.toggle('is-off',state?.audio===false);setLabel(audio,state?.audio===false?'Unmute':'Mute');}
            if(video){video.classList.toggle('is-off',state?.video===false);setLabel(video,state?.video===false?'Start Video':'Stop Video');}
            if(pause){pause.classList.toggle('is-paused',Boolean(state?.paused));setLabel(pause,state?.paused?'Resume':'Pause');}
          };
          window.presenterBridge?.onState?.(applyState);
          const scheduleCollapse=()=>{clearTimeout(collapseTimer);collapseTimer=setTimeout(()=>{menu.hidden=true;document.body.classList.add('collapsed');window.presenterBridge.resize?.(300,52);},3200);};
          const expand=()=>{clearTimeout(collapseTimer);document.body.classList.remove('collapsed');window.presenterBridge.resize?.(980,menu.hidden?80:expandedHeight);};
          document.addEventListener('pointerenter',expand);document.addEventListener('pointermove',scheduleCollapse);document.addEventListener('pointerleave',scheduleCollapse);
          document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',event=>{const command=button.dataset.command;if(command==='more'){event.stopPropagation();menu.hidden=!menu.hidden;window.presenterBridge.resize?.(980,menu.hidden?80:expandedHeight);return;}menu.hidden=true;window.presenterBridge.resize?.(980,80);window.presenterBridge.command(command);scheduleCollapse();}));
          document.addEventListener('click',event=>{if(!menu.hidden&&!menu.contains(event.target)&&event.target!==more){menu.hidden=true;window.presenterBridge.resize?.(980,80);}});scheduleCollapse();
          """)

          # Hosted Meet: truthful local state -> native toolbar; targeted remote
          # video resync after admission; clear presentation media before stage restore.
          ui=Path('assets/js/meet-next/executive6.js'); s=ui.read_text()
          marker="""  engine.on('local-media-state',payload=>{
            if(typeof payload?.audio==='boolean'){"""
          repl="""  const syncNativePresenterState=()=>window.dominionDesktop?.updatePresenterState?.({audio:state.audio,video:state.video,paused:state.sharePaused,sharing:state.sharing,participantCount:state.participants.size+1});

          engine.on('local-media-state',payload=>{
            if(typeof payload?.audio==='boolean'){"""
          if marker not in s: raise SystemExit('local media marker missing')
          s=s.replace(marker,repl,1)
          marker="""    updateLocalStage();
            ensureLocalDockTile();
            renderParticipants();
          });
          engine.on('local-stream'"""
          repl="""    updateLocalStage();
            ensureLocalDockTile();
            renderParticipants();
            syncNativePresenterState();
          });
          engine.on('local-stream'"""
          if marker not in s: raise SystemExit('local media tail marker missing')
          s=s.replace(marker,repl,1)

          # New Share was a dead native command; map every command explicitly.
          s=s.replace("""        share:()=>ids.newShareBtn?.click(),
                  reactions:()=>ids.reactionBtn?.click(),""", """        share:()=>ids.newShareBtn?.click(),
                  'new-share':()=>ids.newShareBtn?.click(),
                  reactions:()=>ids.reactionBtn?.click(),""",1)
          s=s.replace("""        settings:()=>ids.settingsDialog?.showModal(),
                  stop:()=>ids.stopShareBtn?.click()""", """        settings:()=>ids.settingsDialog?.showModal(),
                  'return-meeting':()=>window.dominionDesktop?.hidePresenterToolbar?.(),
                  stop:()=>ids.stopShareBtn?.click()""",1)

          # Host requests a targeted media refresh when an admitted participant
          # joins with Video On but the host has not decoded the camera track yet.
          marker="""    state.participants.set(payload.from,{...p,...payload,...payload.meta,avatarUrl:payload.avatarUrl||payload.meta?.avatarUrl||p.avatarUrl||''});
            renderParticipants();
            playTone('join');toast(`${payload.displayName||payload.meta?.displayName||'Guest'} joined the meeting`);"""
          repl="""    const joined={...p,...payload,...payload.meta,avatarUrl:payload.avatarUrl||payload.meta?.avatarUrl||p.avatarUrl||''};
            state.participants.set(payload.from,joined);
            renderParticipants();
            if(joined.video!==false&&!hasLiveVideo(joined.stream)){
              [300,1100,2600].forEach(delay=>setTimeout(()=>{
                const current=state.participants.get(payload.from);
                if(current?.video!==false&&!hasLiveVideo(current?.stream))engine.requestMediaResync?.(payload.from).catch(()=>{});
              },delay));
            }
            playTone('join');toast(`${payload.displayName||payload.meta?.displayName||'Guest'} joined the meeting`);"""
          if marker not in s: raise SystemExit('participant joined marker missing')
          s=s.replace(marker,repl,1)

          # Media state is authoritative. Ask once more for actual video transport
          # when the state says Video On but the host has no live track.
          marker="""    state.participants.set(payload.from,updated);
            // A mute is authoritative."""
          repl="""    state.participants.set(payload.from,updated);
            if(updated.video!==false&&!hasLiveVideo(updated.stream))setTimeout(()=>{const current=state.participants.get(payload.from);if(current?.video!==false&&!hasLiveVideo(current?.stream))engine.requestMediaResync?.(payload.from).catch(()=>{});},420);
            // A mute is authoritative."""
          if marker not in s: raise SystemExit('media-state marker missing')
          s=s.replace(marker,repl,1)

          # Never leave the last screen-share frame attached after Stop Share.
          marker="""  function endPresentationMode() {
            const oldPresenter = state.sharingParticipantId;
            state.sharing = false;
            state.sharingParticipantId = null;
            setPresentationMode(false);"""
          repl="""  function endPresentationMode() {
            const oldPresenter = state.sharingParticipantId;
            state.sharing = false;
            state.sharingParticipantId = null;
            ids.stageVideo.pause?.();
            ids.stageVideo.srcObject=null;
            ids.stageVideo.hidden=true;
            ids.stageFallback.hidden=false;
            setPresentationMode(false);"""
          if marker not in s: raise SystemExit('end presentation marker missing')
          s=s.replace(marker,repl,1)

          # Keep native presenter state synchronized while sharing and on share exit.
          s=s.replace("""    setPresentationMode(true, ids.selfName.textContent || 'You');
            if(window.dominionDesktop?.isDesktop)ids.shareStatusBar.hidden=true;""", """    setPresentationMode(true, ids.selfName.textContent || 'You');
            syncNativePresenterState();
            if(window.dominionDesktop?.isDesktop)ids.shareStatusBar.hidden=true;""",1)
          s=s.replace("""    ids.shareBtn.querySelector('.tool-label').textContent='Share Screen';
            endPresentationMode();""", """    ids.shareBtn.querySelector('.tool-label').textContent='Share Screen';
            endPresentationMode();
            syncNativePresenterState();""",1)
          ui.write_text(s)

          # Add explicit video-state glyph styling to the hosted participant tile.
          css=Path('assets/css/meet/deep-clean-layout.css')
          css.write_text(css.read_text()+'''\n/* RC13.2 authoritative media state */\n.remote-tile.camera-off .tile-overlay:after{content:"";width:15px;height:15px;display:inline-block;margin-left:5px;background:linear-gradient(135deg,transparent 44%,#ff4d67 45%,#ff4d67 55%,transparent 56%);border:1px solid #ff657733;border-radius:4px;vertical-align:-3px}\n.remote-tile.camera-off .remote-fallback{background:radial-gradient(circle at 50% 35%,#17283b,#070d16 74%)}\n''')

          # Desktop package version and deterministic PKG attestation.
          package=Path('desktop 2/package.json'); data=json.loads(package.read_text()); data['version']='1.2.3'; package.write_text(json.dumps(data,indent=2)+"\n")
          lock=Path('desktop 2/package-lock.json'); data=json.loads(lock.read_text()); data['version']='1.2.3';
          if isinstance(data.get('packages'),dict) and '' in data['packages']: data['packages']['']['version']='1.2.3'
          lock.write_text(json.dumps(data,indent=2)+"\n")
          replace('desktop 2/build/pkg-scripts/postinstall','EXPECTED_VERSION="1.2.2"','EXPECTED_VERSION="1.2.3"')

          # Bridge 14 is required because share-picker and presenter behavior are
          # packaged changes. Update main's bridge marker too.
          replace('desktop 2/src/main-v2.mjs','const DESKTOP_BRIDGE_VERSION = 13;','const DESKTOP_BRIDGE_VERSION = 14;')

          # Release contract: bump runtime identity, bridge floor, and changed file hashes.
          contract_path=Path('meet/release-contract.json'); contract=json.loads(contract_path.read_text())
          contract['releaseId']='2026.08.17-rc13.2-media-share-forward'
          contract['desktopBridge']=14
          changed=['assets/js/meet-next/executive6.js','assets/css/meet/deep-clean-layout.css']
          for rel in changed: contract['files'][rel]=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
          contract_path.write_text(json.dumps(contract,indent=2)+"\n")
          PY

      - name: Verify candidate source
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/meet-next/executive6.js
          node --check 'desktop 2/src/main-v2.mjs'
          node --check 'desktop 2/src/preload.cjs'
          node --check 'desktop 2/src/presenter-preload.cjs'
          node --check 'desktop 2/src/presenter-toolbar.js'
          ! grep -Eq '🎙|◉|♙|▢|☺|Ⅱ|↗' 'desktop 2/src/presenter-toolbar.html'
          grep -F "'new-share':()=>ids.newShareBtn?.click()" assets/js/meet-next/executive6.js
          grep -F "updatePresenterState" 'desktop 2/src/preload.cjs'
          grep -F "desktop:presenter-state" 'desktop 2/src/main-v2.mjs'
          grep -F "return false;" 'desktop 2/src/main-v2.mjs' >/dev/null
          test "$(node -p "require('./desktop 2/package.json').version")" = "1.2.3"
          grep -F 'const BRIDGE_VERSION = 14' 'desktop 2/src/preload.cjs'
          grep -F 'const DESKTOP_BRIDGE_VERSION = 14' 'desktop 2/src/main-v2.mjs'
          grep -F 'EXPECTED_VERSION="1.2.3"' 'desktop 2/build/pkg-scripts/postinstall'
          node -e "const c=require('./meet/release-contract.json'); if(c.desktopBridge!==14||c.releaseId!=='2026.08.17-rc13.2-media-share-forward') process.exit(1)"
          cd 'desktop 2' && npm ci --ignore-scripts && npm run verify

      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DominionStar Release Bot'
          git config user.email 'release-bot@dominionstarld.com'
          git add assets/js/meet-next/executive6.js assets/css/meet/deep-clean-layout.css meet/release-contract.json 'desktop 2/src/main-v2.mjs' 'desktop 2/src/preload.cjs' 'desktop 2/src/presenter-preload.cjs' 'desktop 2/src/presenter-toolbar.html' 'desktop 2/src/presenter-toolbar.js' 'desktop 2/package.json' 'desktop 2/package-lock.json' 'desktop 2/build/pkg-scripts/postinstall'
          git commit -m 'Rebuild Meet media state and desktop sharing UX'
          git push origin HEAD:fix/meet-media-share-future-ui
