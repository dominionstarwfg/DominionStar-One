name: DominionStar Meet Clean Desktop Verification

on:
  pull_request:
    paths:
      - "desktop 2/**"
      - "assets/js/meet/**"
      - "assets/js/meet-next/**"
      - "assets/js/member-auth.js"
      - "assets/js/member-login.js"
      - "assets/css/meet/**"
      - "assets/css/meet-next/**"
      - "meet/**"
      - "meet-home/**"
      - "member-login/**"
      - ".github/workflows/desktop-pr-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-clean-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean Desktop Runtime Verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Prove repository starts clean
        shell: bash
        run: |
          set -euo pipefail
          git -C .. reset --hard HEAD
          git -C .. clean -ffdx
          test -z "$(git -C .. status --porcelain)"
          test ! -e ../desktop
          test ! -e "src/macos-system-picker-session.mjs"
          test ! -e "src/desktop-home-injection.mjs"
          test ! -e "../assets/js/meet/desktop-home-compact-launch.js"
          echo "DOMINIONSTAR_DESKTOP_REPOSITORY_CLEAN_OK"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Remove dependency and build residue
        run: rm -rf node_modules dist

      - name: Install only locked dependencies
        run: npm ci

      - name: Prove DominionStar Meet package identity is consistent
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(pkg.version!==lock.version || pkg.version!==lock.packages?.['']?.version){
            throw new Error(`Package version mismatch package=${pkg.version} lock=${lock.version} root=${lock.packages?.['']?.version}`);
          }
          if(pkg.build?.appId!=='com.dominionstar.desktop') throw new Error('DominionStar Meet bundle ID changed');
          if(pkg.build?.productName!=='DominionStar Meet') throw new Error('DominionStar Meet product name changed');
          if(pkg.build?.protocols?.[0]?.schemes?.[0]!=='dominionstar') throw new Error('DominionStar deep-link protocol changed');
          if(pkg.build?.mac?.notarize!==false) throw new Error('QA build must not require Apple notarization');
          if(pkg.build?.mac?.identity!==null) throw new Error('QA build must not auto-discover a signing identity');
          if(!String(pkg.scripts?.['dist:mac']||'').startsWith('npm run clean &&')) throw new Error('macOS build does not clean dist first');
          console.log('DOMINIONSTAR_MEET_PACKAGE_IDENTITY_OK',pkg.version,pkg.build.appId,pkg.build.productName);
          NODE

      - name: Audit production dependency supply chain
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete desktop contract suite
        run: npm run verify

      - name: Unit-test artifact size guardrail
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          truncate -s 1M "$tmp/good.pkg"
          node scripts/audit-artifact-sizes.mjs "$tmp"
          truncate -s 801M "$tmp/too-large.pkg"
          set +e
          DOMINIONSTAR_MAX_ARTIFACT_MIB=800 node scripts/audit-artifact-sizes.mjs "$tmp"
          status=$?
          set -e
          test "$status" -eq 42
          echo "DOMINIONSTAR_DESKTOP_SIZE_GUARD_OK"

  macos:
    name: macOS Clean DominionStar Meet Local Runtime Acceptance
    if: github.event_name == 'pull_request'
    runs-on: macos-26-intel
    timeout-minutes: 40
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Erase all generated state before testing
        shell: bash
        run: |
          set -euo pipefail
          git -C .. reset --hard HEAD
          git -C .. clean -ffdx
          test -z "$(git -C .. status --porcelain)"
          test ! -e ../desktop
          test ! -e "src/macos-system-picker-session.mjs"
          test ! -e "src/desktop-home-injection.mjs"
          test ! -e "../assets/js/meet/desktop-home-compact-launch.js"
          rm -rf node_modules dist
          echo "QA_PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          echo "DOMINIONSTAR_DESKTOP_DEEP_CLEAN_OK"

      - name: Certify packaged local runtime authority
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const navigation=fs.readFileSync('src/desktop-navigation-authority.mjs','utf8');
          const main=fs.readFileSync('src/main-v2.mjs','utf8');
          const login=fs.readFileSync('../assets/js/member-login.js','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const requiredNavigation=[
            "const PRODUCTION_HOSTS=new Set(['dominionstarld.com','www.dominionstarld.com'])",
            "const INTERNAL_PATHS=new Set(['/meet','/meet-home','/meet-login','/member-login'])",
            "function installLocalDesktopRuntime()",
            "desktopSession.protocol.handle('https'",
            "if(DESKTOP_HOME_ALIASES.has(route))return 'meet-home/desktop.html'",
            "if(rawPath.startsWith('/assets/'))return rawPath.slice(1)"
          ];
          for(const marker of requiredNavigation) if(!navigation.includes(marker)) throw new Error(`Local runtime authority missing: ${marker}`);
          if(!main.includes("const APP_ORIGIN = 'https://dominionstarld.com';")) throw new Error('QA app must retain canonical DominionStar origin');
          if(!login.includes("const DESKTOP_OAUTH_CALLBACK = 'dominionstar://auth/callback';")) throw new Error('Direct OAuth callback missing from packaged login');
          const resources=pkg.build?.extraResources||[];
          const resource=(from)=>resources.find(entry=>entry?.from===from);
          for(const from of ['../assets','../meet','../member-login']) if(!resource(from)) throw new Error(`Packaged runtime resource missing: ${from}`);
          const home=resource('../meet-home');
          if(!home || JSON.stringify(home.filter)!==JSON.stringify(['desktop.html'])) throw new Error('Desktop Home package must contain desktop.html only');
          if(pkg.build?.protocols?.[0]?.schemes?.[0]!=='dominionstar') throw new Error('DominionStar protocol missing from package');
          console.log('DOMINIONSTAR_DESKTOP_LOCAL_RUNTIME_CERTIFIED canonical-origin packaged-pr-assets direct-deep-link');
          console.log('BACKEND_QA_GATE Supabase Additional Redirect URLs must include dominionstar://auth/callback');
          NODE

      - name: Confirm Intel runner parity
        run: |
          test "$(uname -m)" = "x86_64"
          sw_vers
          uname -m

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Install locked dependencies into clean workspace
        run: |
          rm -rf node_modules dist
          npm ci

      - name: Audit production dependency supply chain
        run: npm audit --omit=dev --audit-level=high

      - name: Run complete runtime certification against packaged source
        run: npm run verify

      - name: Prove source Electron shell opens packaged DominionStar Meet runtime
        run: bash scripts/test-desktop-source-shell.sh

      - name: Disable production auto-update only inside this QA package
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='src/main-v2.mjs';
          let text=fs.readFileSync(path,'utf8');
          const marker='  scheduleUpdaterInitialization();';
          if(!text.includes(marker)) throw new Error('Updater initialization marker missing');
          text=text.replace(marker,'  // QA package: production updater intentionally disabled.');
          fs.writeFileSync(path,text);
          console.log('DOMINIONSTAR_DESKTOP_QA_UPDATER_DISABLED');
          NODE

      - name: Build unsigned universal DominionStar Meet from empty dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Build deterministic DominionStar Meet PKG
        run: npm run dist:mac:pkg

      - name: Enforce installer size budget
        run: node scripts/audit-artifact-sizes.mjs dist

      - name: Prove universal app DMG payload and packaged runtime
        run: bash scripts/test-macos-clean-app.sh

      - name: Prove PKG replaces stale app and launches the real DominionStar Meet
        run: bash scripts/test-macos-pkg.sh

      - name: Create auditable QA PKG and provenance
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          PKG="dist/DominionStar-Meet-${VERSION}-mac-universal.pkg"
          test -f "$PKG"
          mkdir -p dist/qa
          SHORT_SHA="${GITHUB_SHA:0:8}"
          OUT="dist/qa/DominionStar-Meet-CLEAN-QA-PR${QA_PR_NUMBER}-${SHORT_SHA}-mac-universal.pkg"
          cp "$PKG" "$OUT"
          cat > dist/qa/BUILD-PROVENANCE.txt <<EOF
          DominionStar Meet clean QA build
          PR: ${QA_PR_NUMBER}
          Commit: ${GITHUB_SHA}
          Runtime source: packaged local desktop-runtime served under https://dominionstarld.com
          Package version: ${VERSION}
          Bundle ID: com.dominionstar.desktop
          Product: DominionStar Meet
          Protocol: dominionstar
          Production updater: disabled in this QA artifact
          Apple Developer signing/notarization: intentionally deferred during functional QA
          OAuth backend gate: Supabase Additional Redirect URLs must include dominionstar://auth/callback
          EOF
          shasum -a 256 "$OUT" | tee dist/qa/SHA256.txt
          echo "DOMINIONSTAR_MEET_CLEAN_QA_PKG $(basename "$OUT")"

      - name: Retain only the certified DominionStar Meet PKG
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-pr${{ github.event.pull_request.number }}-CLEAN-QA-macos-pkg
          path: |
            desktop 2/dist/qa/*.pkg
            desktop 2/dist/qa/BUILD-PROVENANCE.txt
            desktop 2/dist/qa/SHA256.txt
          if-no-files-found: error
          retention-days: 2
