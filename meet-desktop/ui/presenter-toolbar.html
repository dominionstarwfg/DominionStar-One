<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sharing controls</title>
  <link rel="stylesheet" href="./presenter-toolbar.css">
</head>
<body>
  <main class="toolbar" id="toolbar">
    <div class="share-state"><span class="live-dot"></span><span id="shareStateLabel">You are sharing</span></div>
    <button type="button" data-command="audio" aria-label="Mute or unmute microphone"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg></span><span id="audioLabel">Audio</span></button>
    <button type="button" data-command="video" aria-label="Start or stop video"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3z"/></svg></span><span id="videoLabel">Video</span></button>
    <button type="button" data-command="participants" aria-label="Open participants"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20a6 6 0 0 1 12 0M14 19a4.8 4.8 0 0 1 7 0"/></svg></span><span>Participants</span></button>
    <button type="button" data-command="chat" aria-label="Open meeting chat"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg></span><span>Chat</span></button>
    <button type="button" data-command="pause" aria-label="Pause or resume screen share"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span><span id="pauseLabel">Pause</span></button>
    <button type="button" data-command="annotate" aria-label="Annotate shared content"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 16-1 4 4-1L19 8l-3-3zM14.5 6.5l3 3"/></svg></span><span>Annotate</span></button>
    <button type="button" data-command="show-meeting" aria-label="Show or hide meeting window"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="M8 21h8M12 18v3"/></svg></span><span id="meetingLabel">Show meeting</span></button>
    <div class="more-wrap">
      <button id="moreButton" type="button" aria-label="More sharing controls"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></span><span>More</span></button>
      <div id="moreMenu" class="more-menu" hidden>
        <button type="button" data-command="new-share">New Share</button>
        <button type="button" data-command="reactions">Reactions</button>
        <button type="button" data-command="layout-speaker">Speaker video</button>
        <button type="button" data-command="layout-gallery">Gallery video</button>
        <button type="button" data-command="layout-hide">Hide participant video</button>
      </div>
    </div>
    <button class="stop" type="button" data-command="stop" aria-label="Stop screen sharing"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></span><span>Stop Share</span></button>
  </main>
  <script src="./presenter-toolbar.js"></script>
</body>
</html>
