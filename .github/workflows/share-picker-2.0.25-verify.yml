name: DominionStar Meet Share Picker 2.0.25

on:
  pull_request:
    branches: [ci/stacked-2.0.25-base]
    paths:
      - 'meet-desktop/ui/share-picker.html'
      - 'meet-desktop/ui/share-picker.css'
      - 'meet-desktop/ui/share-picker.js'
      - 'meet-desktop/src/share-service.mjs'
      - 'meet-desktop/src/preload.cjs'
      - 'meet-desktop/scripts/verify-share-picker-2.0.25.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  share-picker-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact picker candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify picker syntax
        working-directory: meet-desktop
        run: |
          node --check ui/share-picker.js
          node --check scripts/verify-share-picker-2.0.25.mjs
      - name: Verify modern working-only picker contract
        working-directory: meet-desktop
        run: node scripts/verify-share-picker-2.0.25.mjs
      - name: Re-run inherited share and runtime authority gates
        working-directory: meet-desktop
        run: |
          node scripts/verify-share-authority.mjs
          node scripts/verify-runtime-stability-2.0.22.mjs

  share-picker-mac-package:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Checkout exact picker candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rebuild dependencies
        working-directory: meet-desktop
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build signed arm64 QA app
        working-directory: meet-desktop
        run: npx electron-builder --mac dir --arm64 --publish never
      - name: Locate packaged app
        id: app
        shell: bash
        run: |
          APP_PATH="$(find meet-desktop/dist -maxdepth 3 -type d -name 'DominionStar Meet.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Audit packaged app contents
        working-directory: meet-desktop
        run: node scripts/verify-packaged-app.mjs "../${{ steps.app.outputs.path }}"
      - name: Exercise inherited packaged desktop controls
        working-directory: meet-desktop
        run: node scripts/verify-packaged-interactions.mjs "../${{ steps.app.outputs.path }}"
