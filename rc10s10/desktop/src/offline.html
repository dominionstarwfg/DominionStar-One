<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar — Reconnecting</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#17213b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#e4f3ff,transparent 35%),radial-gradient(circle at 85% 85%,#eee8ff,transparent 35%),#f7f9fc}.card{width:min(520px,calc(100vw - 40px));padding:46px;border:1px solid #dfe6f0;border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 24px 70px rgba(35,52,87,.15);text-align:center}.mark{width:70px;height:70px;margin:auto;display:grid;place-items:center;border-radius:22px;background:#13285b;color:#fff;font-size:30px;font-weight:800}h1{margin:24px 0 10px;font-size:28px}p{line-height:1.6;color:#5a6680}button{margin-top:18px;padding:13px 23px;border:0;border-radius:12px;background:#245eea;color:#fff;font:inherit;font-weight:700;cursor:pointer}small{display:block;margin-top:18px;color:#8190a7}</style>
</head>
<body>
  <main class="card">
    <div class="mark">D</div>
    <h1>Let’s reconnect</h1>
    <p>DominionStar could not reach the platform. Check your internet connection, then try again. Your account and meeting settings are safe.</p>
    <button onclick="location.href='https://dominionstarld.com/workspace/'">Try again</button>
    <small>Guardian recovery is standing by.</small>
  </main>
</body>
</html>
