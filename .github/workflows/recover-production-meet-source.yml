name: Recover DominionStar Meet Production Source

on:
  push:
    branches:
      - rebuild/meet-production-source-recovery
    paths:
      - "scripts/recover-production-meet-source.py"
      - ".github/workflows/recover-production-meet-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/meet-production-source-recovery
          fetch-depth: 0
          clean: true

      - name: Recover exact live production source
        run: python3 scripts/recover-production-meet-source.py

      - name: Verify recovered release-contract hashes
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          contract=json.loads(Path('meet/release-contract.json').read_text())
          failures=[]
          for rel,expected in contract.get('files',{}).items():
              p=Path(rel)
              if not p.exists():
                  failures.append(f'{rel}: missing')
                  continue
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual!=expected:
                  failures.append(f'{rel}: {actual} != {expected}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Recovered production source matches every hash in the live release contract.')
          PY

      - name: Commit recovered production baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRODUCTION-MEET-SOURCE-MANIFEST.json meet meet-home meet-login assets netlify supabase
          if git diff --cached --quiet; then
            echo "Production baseline already recovered."
            exit 0
          fi
          git commit -m "Recover exact live DominionStar Meet production baseline"
          git push origin HEAD:rebuild/meet-production-source-recovery
