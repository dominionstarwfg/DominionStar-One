<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar Meet – Presenter Video</title>
  <link rel="stylesheet" href="./mac-share-video.css">
</head>
<body>
  <main id="dock" class="video-dock" aria-label="DominionStar Meet presenter video">
    <section class="video-stage">
      <img id="cameraMirror" class="camera-mirror" alt="" hidden>
      <div id="cameraPending" class="camera-pending" hidden><span>Starting video…</span></div>
      <div id="cameraFallback" class="camera-fallback">
        <img id="profileImage" alt="">
        <span id="profileInitials">DS</span>
      </div>
      <div class="participant-name"><span id="micState" class="mic-state" aria-hidden="true">●</span><strong id="displayName">You</strong></div>
    </section>
  </main>
  <script src="./mac-share-video.js"></script>
</body>
</html>
