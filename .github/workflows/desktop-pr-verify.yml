name: DominionStar Desktop PR Verification

on:
  pull_request:
    paths:
      - "desktop 2/**"
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/desktop-pr-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-desktop-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean Runtime Contract Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Install locked dependencies
        run: npm ci

      - name: Run clean-runtime certification
        run: npm run verify

      - name: Confirm release workflow keeps the same gates
        shell: bash
        run: |
          set -euo pipefail
          workflow="../.github/workflows/desktop-build.yml"
          grep -q "npm run verify" "$workflow"
          grep -q "Build deterministic Apple replacement PKG" "$workflow"
          grep -q "bash scripts/test-macos-pkg.sh" "$workflow"
          grep -q "bash scripts/test-live-meet-contract.sh" "$workflow"
          grep -q "macos-26-intel" "$workflow"

  hosted-runtime-audit:
    name: Live Hosted Runtime Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Audit deployed Meet scripts and release contract
        run: bash scripts/audit-live-hosted-runtime.sh

  macos-intel:
    name: macOS Intel Install + Live Meet Acceptance
    runs-on: macos-26-intel
    timeout-minutes: 25
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Confirm Intel runner parity
        run: |
          test "$(uname -m)" = "x86_64"
          sw_vers
          uname -m

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare native replacement tooling
        run: chmod 0755 build/pkg-scripts/preinstall build/pkg-scripts/postinstall scripts/build-macos-pkg.sh scripts/test-macos-pkg.sh scripts/test-live-meet-contract.sh scripts/audit-live-hosted-runtime.sh

      - name: Run clean-runtime certification
        run: npm run verify

      - name: Build universal macOS app
        run: npm run dist:mac

      - name: Build deterministic Apple replacement PKG
        run: npm run dist:mac:pkg

      - name: Install over stale v1.1.8 and launch the installed app
        run: bash scripts/test-macos-pkg.sh

      - name: Reinstall and prove the actual app passes the live Meet contract
        run: bash scripts/test-live-meet-contract.sh
