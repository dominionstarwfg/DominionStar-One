name: DominionStar Executive OS — Agent Website QA
on:
  push:
    branches:
      - review/login2-recovery-netlify-hold-20261019
    paths:
      - 'account-settings/**'
      - 'member-login/**'
      - 'assets/js/member-login.js'
      - 'assets/js/member-dashboard.js'
      - 'assets/js/global-call-manager.js'
      - 'assets/js/direct-messages.js'
      - 'scripts/security/agent-call-realtime-v2.DO-NOT-RUN.review.sql'
      - 'assets/js/member-login-google-flags.js'
      - 'assets/js/account-settings.js'
      - 'assets/js/account-google-identity-review.js'
      - 'assets/css/agent-settings-boundary-review.css'
      - 'assets/js/dominionstar-agent-nav-shell.js'
      - 'assets/js/dominionstar-os.js'
      - 'meet-desktop/ui/index.html'
      - 'meet-desktop/ui/av-settings.js'
      - 'meet-desktop/ui/preferences.js'
      - 'tests/**'
      - '.github/workflows/agent-settings-review-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Node and source regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/account-settings.js
          node --check assets/js/member-login.js
          node --check assets/js/member-dashboard.js
          node --check assets/js/global-call-manager.js
          node --check assets/js/direct-messages.js
          node --check assets/js/dominionstar-agent-nav-shell.js
          node --check assets/js/dominionstar-os.js
          node --check meet-desktop/ui/preferences.js
          node --check meet-desktop/ui/av-settings.js
      - name: Test Agent website and settings boundaries
        run: |
          node --test \
            tests/agent-meet-settings-boundary-review.test.mjs \
            tests/agent-notification-meet-isolation-runtime.test.mjs \
            tests/google-identity-connection-review.test.mjs
      - name: Test full Node suite
        run: |
          shopt -s nullglob
          tests=(tests/*.test.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo "No Node tests found" >&2
            exit 1
          fi
          node --test "${tests[@]}"
