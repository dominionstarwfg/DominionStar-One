name: DominionStar Meet Runtime Verification

on:
  pull_request:
    paths:
      - "assets/js/meeting-engine.js"
      - "assets/js/meet/**"
      - "assets/js/meet-next/**"
      - "assets/css/meet/**"
      - "assets/css/meet-next/**"
      - "meet/**"
      - "scripts/test-*meet*.mjs"
      - "scripts/test-camera-privacy-and-native-picker.mjs"
      - "scripts/test-media-stability-guardrails.mjs"
      - "scripts/test-live-sync-regression.mjs"
      - "scripts/test-two-client-authority.mjs"
      - "scripts/test-waiting-room-surgical.mjs"
      - "scripts/test-netlify-cutover-approval.sh"
      - "scripts/build-netlify-site.sh"
      - "netlify.toml"
      - ".github/workflows/meet-runtime-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-meet-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Media, Waiting Room, Share and Link Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax validation
        run: |
          node --check assets/js/meeting-engine.js
          node --check assets/js/meet-next/executive6.js
          node --check assets/js/meet/desktop-share-picker.js
          node --check assets/js/meet/dock-layout-v2.js
          node --check netlify/functions/resolve-meeting-join.mjs

      - name: Camera privacy and native share picker
        run: node scripts/test-camera-privacy-and-native-picker.mjs

      - name: Media stability guardrails
        run: node scripts/test-media-stability-guardrails.mjs

      - name: Waiting room authority and lifecycle
        run: node scripts/test-waiting-room-surgical.mjs

      - name: Two-client host and co-host authority
        run: node scripts/test-two-client-authority.mjs

      - name: Live synchronization regression contract
        run: node scripts/test-live-sync-regression.mjs

      - name: Production camera, Pause Share and invitation behavior
        run: node scripts/test-production-meet-rc13.mjs

      - name: Release contract integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          contract=json.loads(Path('meet/release-contract.json').read_text())
          expected_release='2026.08.16-rc13.1-modern-ui-contract'
          if contract.get('releaseId') != expected_release:
              raise SystemExit(f"Unexpected Meet releaseId: {contract.get('releaseId')!r}")

          files=contract.get('files') or {}
          if not files:
              raise SystemExit('Meet release contract contains no file hashes')

          mismatches=[]
          for rel, expected_hash in sorted(files.items()):
              path=Path(rel)
              if not path.is_file():
                  mismatches.append((rel,'MISSING',expected_hash))
                  print('HASH MISSING', rel, expected_hash)
                  continue
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected_hash:
                  mismatches.append((rel,actual,expected_hash))
                  print('HASH MISMATCH', rel, 'actual='+actual, 'contract='+str(expected_hash))
              else:
                  print('HASH OK', rel, actual)

          if mismatches:
              raise SystemExit(f'Meet release contract mismatch count: {len(mismatches)}')
          print('MEET_RELEASE_CONTRACT_ALL_FILES_OK', len(files))
          PY

      - name: Cutover approval gate unit tests
        run: bash scripts/test-netlify-cutover-approval.sh

      - name: Prove Netlify production remains fail-closed
        shell: bash
        run: |
          set +e
          output=$(bash scripts/build-netlify-site.sh 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 42 ]; then
            echo "$output" | grep -F "refusing to build an incomplete DominionStar production deploy" >/dev/null
            test ! -e dist
            echo "PRODUCTION_DEPLOY_BLOCKED_INCOMPLETE_SOURCE"
            exit 0
          fi

          if [ "$status" -eq 43 ]; then
            echo "$output" | grep -E "cutover approval is intentionally withheld|cutover approval is invalid or incomplete" >/dev/null
            test ! -e dist
            echo "PRODUCTION_DEPLOY_BLOCKED_PENDING_APPROVAL"
            exit 0
          fi

          if [ "$status" -ne 0 ]; then
            echo "ERROR: Netlify build failed unexpectedly with status $status" >&2
            exit "$status"
          fi

          test ! -e dist/.github
          test ! -e dist/desktop
          test ! -e 'dist/desktop 2'
          test ! -e dist/scripts
          test ! -e dist/supabase
          test ! -e dist/netlify
          test ! -e dist/PRODUCTION-CUTOVER-APPROVAL.json
          node --check dist/assets/js/meeting-engine.js
          node --check dist/assets/js/meet-next/executive6.js
          echo "COMPLETE_APPROVED_PRODUCTION_SURFACE_BUILT"

      - name: Verify current live desktop contract remains compatible
        working-directory: desktop 2
        run: bash scripts/audit-live-hosted-runtime.sh
