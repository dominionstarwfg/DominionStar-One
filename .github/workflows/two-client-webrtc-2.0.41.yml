name: DominionStar Meet Two-Client WebRTC

on:
  pull_request:
    branches:
      - main
    paths:
      - 'meet-desktop/**'
      - '.github/workflows/two-client-webrtc-2.0.41.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-client-webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact candidate and QA script syntax
        run: |
          node --check meet-desktop/scripts/test-two-client-webrtc-2.0.41.mjs
          node --check meet-desktop/ui/webrtc-controller.js
          node --check meet-desktop/ui/browser-bridge.js
          node --check meet-desktop/ui/meeting-features.js
          node --check meet-desktop/ui/participant-controls.js

      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Install Chromium for runtime proof
        run: npx playwright install --with-deps chromium

      - name: Run real two-client meeting communication acceptance
        run: node meet-desktop/scripts/test-two-client-webrtc-2.0.41.mjs
