<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar Meet – Annotation</title>
  <link rel="stylesheet" href="./mac-annotation-toolbar.css">
</head>
<body>
  <main class="annotation-palette" aria-label="Annotation tools">
    <button type="button" data-command="annotate-pen" class="active" aria-label="Pen">
      <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.4-1.1L19 8.3 15.7 5 5.1 15.6 4 20Z"/><path d="m13.9 6.8 3.3 3.3"/></svg></span><small>Pen</small>
    </button>
    <button type="button" data-command="annotate-highlight" aria-label="Highlight">
      <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 15 7.8-7.8 3 3L10 18H7v-3Z"/><path d="M5 20h14"/></svg></span><small>Highlight</small>
    </button>
    <button type="button" data-command="annotate-laser" aria-label="Laser">
      <span class="tool-icon laser-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span><small>Laser</small>
    </button>
    <button type="button" data-command="annotate-erase" aria-label="Erase">
      <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 8.8-8.8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L10 20H7.8L5 17.2A1.6 1.6 0 0 1 5 15Z"/><path d="m11.5 8.5 4 4M10 20h9"/></svg></span><small>Erase</small>
    </button>
    <div class="palette-colors" aria-label="Annotation colors">
      <button type="button" data-command="annotate-color-red" class="swatch red active" aria-label="Red"></button>
      <button type="button" data-command="annotate-color-blue" class="swatch blue" aria-label="Blue"></button>
      <button type="button" data-command="annotate-color-green" class="swatch green" aria-label="Green"></button>
      <button type="button" data-command="annotate-color-white" class="swatch white" aria-label="White"></button>
    </div>
    <div class="separator"></div>
    <button type="button" data-command="annotate-undo" aria-label="Undo">
      <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8H4V3"/><path d="M4.5 8.2A8 8 0 1 1 6.2 18"/></svg></span><small>Undo</small>
    </button>
    <button type="button" data-command="annotate-clear" aria-label="Clear">
      <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12"/><path d="M11 10v6M13 10v6"/></svg></span><small>Clear</small>
    </button>
    <button type="button" data-command="annotate-close" class="done" aria-label="Done">
      <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.2 4.2L19 6.5"/></svg></span><small>Done</small>
    </button>
  </main>
  <script src="./mac-annotation-toolbar.js"></script>
</body>
</html>
