name: DominionStar — Production Release Control Review

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/check-agent-release-gates.mjs'
      - 'assets/js/notification-feature-flags.js'
      - '.github/workflows/production-release-control-review.yml'
      - '.github/workflows/authenticated-os-consistency-review.yml'
      - '.github/workflows/notification-readability-review-gate.yml'
      - '.github/workflows/review-public-build-package.yml'
      - 'docs/agent-os-production-cutover-20261029.md'
      - 'docs/agent-os-cutover-manifest-20261030.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-main-protection:
    name: Verify main release controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect main release protection
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          api_get() {
            local url="$1"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url"
          }

          api_get "https://api.github.com/repos/$REPOSITORY/branches/main" > /tmp/main-branch.json
          api_get "https://api.github.com/repos/$REPOSITORY/rulesets" > /tmp/rulesets.json

          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');

          const branch=JSON.parse(fs.readFileSync('/tmp/main-branch.json','utf8'));
          const summaries=JSON.parse(fs.readFileSync('/tmp/rulesets.json','utf8'));

          if(branch.protected!==true){
            console.error('RELEASE_BLOCKED: main is not protected.');
            process.exit(1);
          }

          const requiredChecks=[
            'Verify authenticated Agent and Founder OS',
            'Verify Agent OS notification and readability review',
            'Build & validate review package — never deploy',
            'Verify main release controls'
          ];

          const classicContexts=new Set([
            ...(branch.protection?.required_status_checks?.contexts||[]),
            ...((branch.protection?.required_status_checks?.checks||[]).map(x=>x.context).filter(Boolean))
          ]);

          const classicHasAll=requiredChecks.every(name=>classicContexts.has(name));
          const classicStrict=branch.protection?.required_status_checks?.enforcement_level &&
            branch.protection.required_status_checks.enforcement_level!=='off';

          let rulesetMatch=null;
          for(const summary of summaries){
            if(summary.target!=='branch' || summary.enforcement!=='active') continue;

            const raw=cp.execFileSync('curl',[
              '--fail-with-body','--silent','--show-error',
              '-H',`Authorization: Bearer ${process.env.GH_TOKEN}`,
              '-H','Accept: application/vnd.github+json',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              `https://api.github.com/repos/${process.env.REPOSITORY}/rulesets/${summary.id}`
            ],{encoding:'utf8'});

            const detail=JSON.parse(raw);
            const includesDefault=(detail.conditions?.ref_name?.include||[]).includes('~DEFAULT_BRANCH');
            if(!includesDefault) continue;

            const types=new Set((detail.rules||[]).map(r=>r.type));
            const pr=(detail.rules||[]).find(r=>r.type==='pull_request');
            const status=(detail.rules||[]).find(r=>r.type==='required_status_checks');
            const contexts=new Set(
              status?.parameters?.required_status_checks?.map(x=>x.context).filter(Boolean)||[]
            );

            const valid=
              types.has('deletion') &&
              types.has('non_fast_forward') &&
              !!pr &&
              pr.parameters?.required_review_thread_resolution===true &&
              !!status &&
              status.parameters?.strict_required_status_checks_policy===true &&
              status.parameters?.do_not_enforce_on_create===false &&
              requiredChecks.every(name=>contexts.has(name));

            if(valid){
              rulesetMatch={id:detail.id,name:detail.name,contexts:[...contexts]};
              break;
            }
          }

          if(!(rulesetMatch || (classicHasAll && classicStrict))){
            console.error('RELEASE_BLOCKED: main is protected, but required DominionStar release controls are not fully enforced.');
            console.error('Classic contexts:', [...classicContexts].join(', ') || '(none)');
            process.exit(1);
          }

          if(rulesetMatch){
            console.log(`MAIN_RELEASE_CONTROLS_OK via active ruleset: ${rulesetMatch.name} (#${rulesetMatch.id})`);
          }else{
            console.log('MAIN_RELEASE_CONTROLS_OK via classic branch protection');
          }
          NODE

      - name: Confirm review workflow is inspection-only
        run: |
          echo "This workflow performs release-control inspection only."
