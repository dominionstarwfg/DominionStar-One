name: Apply approved DominionStar Meet parity fix v2

on:
  push:
    branches:
      - prototype/meet-clean-foundation
    paths:
      - .github/workflows/apply-approved-meet-parity-fix-v2.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/meet-clean-foundation
          fetch-depth: 0

      - name: Apply approved desktop behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def require_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: required source not found')
              return text.replace(old, new, 1)

          # Google OAuth: authenticate in the normal browser, return to the installed app.
          p='assets/js/member-login.js'
          text=read(p)
          text=require_replace(text,
              'const DESKTOP_OAUTH_RETURN = `${window.location.origin}/member-login/?desktop=1&oauth=complete`;',
              "const DESKTOP_OAUTH_CALLBACK = 'dominionstar://auth/callback';", p)
          text=text.replace('redirectTo: DESKTOP_OAUTH_RETURN','redirectTo: DESKTOP_OAUTH_CALLBACK')
          text=require_replace(text,'window.location.assign(data.url);',
              "const opened = await window.dominionDesktop?.openExternal?.(data.url);\n        if (opened === false) throw new Error('Google sign-in could not open in the browser.');",p)
          write(p,text)

          # If Supabase falls back to the public Site URL, immediately relay the tokens to the app.
          write('assets/js/desktop-oauth-return.js',"""(() => {
            try {
              const params = new URLSearchParams(String(window.location.hash || '').replace(/^#/,''));
              if (!params.get('access_token') || !params.get('refresh_token')) return;
              window.location.replace(`dominionstar://auth/callback${window.location.hash}`);
            } catch {}
          })();
          """)
          p='index.html'; text=read(p)
          marker='<script src="/assets/js/desktop-oauth-return.js"></script>'
          if marker not in text:
              if '</body>' not in text: raise SystemExit('index.html: closing body not found')
              text=text.replace('</body>',f'  {marker}\n</body>',1)
              write(p,text)

          # Remove the unapproved Home copy visible in the supplied screenshot.
          p='meet-home/desktop.html'; text=read(p)
          unwanted='<p>Meeting and device defaults live in Settings so Home stays simple.</p>'
          if unwanted not in text: raise SystemExit('meet-home/desktop.html: unwanted Home copy not found')
          write(p,text.replace(unwanted,'',1))

          # DominionStar custom share picker is the single visible share-selection authority.
          p='desktop 2/src/main-v2.mjs'; text=read(p)
          text,n=re.subn(
              r"function supportsMacSystemPicker\(\) \{\n  if \(process\.platform !== 'darwin'\) return false;\n  const major = Number\(String\(process\.getSystemVersion\?\.\(\) \|\| '0'\)\.split\('\.'\)\[0\] \|\| 0\);\n  return Number\.isFinite\(major\) && major >= 15;\n\}",
              "function supportsMacSystemPicker() {\n  return false;\n}",text,count=1)
          if n!=1: raise SystemExit('main-v2.mjs: macOS picker authority not matched')
          text=require_replace(text,
              'if (mainWindow && !mainWindow.isDestroyed()) mainWindow.hide();',
              'if (mainWindow && !mainWindow.isDestroyed() && !mainWindow.isVisible()) mainWindow.showInactive();',p)
          write(p,text)

          p='desktop 2/src/macos-native-capture-authority.mjs'; text=read(p)
          text,n=re.subn(r"export function supportsNativeMacPicker\(\) \{.*?\n\}",
              "export function supportsNativeMacPicker() {\n  return false;\n}",text,count=1,flags=re.S)
          if n!=1: raise SystemExit('macos-native-capture-authority.mjs: function not matched')
          write(p,text)

          # Keep Meet visible during presentation; OS capture protection owns recursion prevention.
          p='desktop 2/src/share-lifecycle.mjs'; text=read(p)
          old="""function keepMeetingOffSharedDesktop() {
            if (!sharing || meetingExplicitlyShown) return false;
            const win = meetingWindow();
            if (!win || win.isDestroyed() || !win.isVisible()) return false;
            try {
              win.hide();
              return true;
            } catch {
              return false;
            }
          }
          """
          new="""function keepMeetingOffSharedDesktop() {
            // Compatibility export only. The approved presentation state keeps Meet visible;
            // native content protection prevents the app surface from leaking into capture.
            return false;
          }
          """
          text=require_replace(text,old,new,p)
          text=text.replace('  setImmediate(keepMeetingOffSharedDesktop);\n','')
          text=text.replace('    keepMeetingOffSharedDesktop();\n','')
          text=text.replace("  // main-v2 restores the normal meeting window on macOS activation. During a\n  // presentation that must not undo the Zoom-style presenter state. Re-hide it\n  // on the next turn unless the presenter explicitly chose Show meeting.\n  if (sharing && !meetingExplicitlyShown) setImmediate(keepMeetingOffSharedDesktop);\n",'')
          write(p,text)

          # Match the approved share illustration labels and primary action.
          p='assets/js/meet/desktop-share-picker.js'; text=read(p)
          text=text.replace('<strong>Share your screen</strong>','<strong>Choose what to share</strong>')
          text=text.replace('data-filter="window">Application windows','data-filter="window">Applications')
          text=text.replace('<span>Share sound</span>','<span>Share system audio</span>')
          text=text.replace('<label><input type="checkbox" data-own-windows','<label hidden><input type="checkbox" data-own-windows')
          text=text.replace('background:linear-gradient(135deg,#f5c85b,#c99619);color:#111827','background:linear-gradient(135deg,#3b82f6,#2563eb);color:#ffffff')
          write(p,text)

          # OAuth contract: enforce browser authentication + app deep-link return.
          write('desktop 2/scripts/test-desktop-google-oauth-return.mjs',"""import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const here=path.dirname(fileURLToPath(import.meta.url));
          const root=path.resolve(here,'..','..');
          const read=relative=>fs.readFileSync(path.join(root,relative),'utf8');
          const login=read('assets/js/member-login.js');
          const auth=read('assets/js/member-auth.js');
          const main=read('desktop 2/src/main-v2.mjs');
          const relay=read('assets/js/desktop-oauth-return.js');
          assert(login.includes("const DESKTOP_OAUTH_CALLBACK = 'dominionstar://auth/callback'"));
          assert(login.includes('redirectTo: DESKTOP_OAUTH_CALLBACK'));
          assert(login.includes('skipBrowserRedirect: true'));
          assert(login.includes('window.dominionDesktop?.openExternal?.(data.url)'));
          assert(!login.includes('window.location.assign(data.url)'));
          assert(login.includes('let { data } = await supabase.auth.getSession();'));
          assert(login.includes('supabase.auth.setSession({'));
          assert(login.includes("return '/meet-home/?desktop=1';"));
          assert(main.includes("const CUSTOM_PROTOCOL = 'dominionstar';"));
          assert(main.includes('routeAuthCallback(rawUrl)'));
          assert(main.includes("url.hostname === 'auth' && url.pathname === '/callback'"));
          assert(relay.includes('dominionstar://auth/callback'));
          assert(auth.includes('const desktop = Boolean(window.dominionDesktop?.isDesktop)'));
          console.log('DOMINIONSTAR_DESKTOP_GOOGLE_OAUTH_CODE_CONTRACT_OK system-browser deep-link meet-home');
          """)

          # Preserve the larger approved-share guardrail suite, but correct the assertions
          # that had been blessing the regression seen in the screenshots.
          p='desktop 2/scripts/test-approved-share-ui.mjs'; text=read(p)
          text=text.replace("// Physical Mac: exactly one Electron display-media authority. macOS 15+ uses\n// Apple's native system picker; the DominionStar source picker is fallback only.","// Physical Mac: exactly one Electron display-media authority. DominionStar's\n// approved picker is primary while macOS remains the underlying capture authority.")
          text=text.replace("assert(nativeCapture.includes('major >= 15'));","assert(nativeCapture.includes('return false;'));")
          text=text.replace("assert(nativeCapture.includes(\"'macos-system-picker'\"));","assert(nativeCapture.includes(\"'dominionstar-custom-picker'\"));")
          text=text.replace("assert(desktopMain.includes(\"if (process.platform !== 'darwin') return false;\"));\nassert(desktopMain.includes('process.getSystemVersion?.()'));\nassert(desktopMain.includes('major >= 15'));","assert(desktopMain.includes('function supportsMacSystemPicker()'));\nassert(desktopMain.includes('return false;'));")
          text=text.replace('// Custom fallback picker remains non-modal/bounded for older macOS/Windows.','// Approved custom picker remains non-modal/bounded on macOS and Windows.')
          text=text.replace('data-filter="window">Application windows','data-filter="window">Applications')
          text=text.replace("assert(shareLifecycle.includes('setImmediate(keepMeetingOffSharedDesktop)'));","assert(!shareLifecycle.includes('win.hide()'));\nassert(!shareLifecycle.includes('setImmediate(keepMeetingOffSharedDesktop)'));")
          text=text.replace('Approved one-handler native-mac/fallback share UI and final-illustration guardrails passed.','Approved one-handler DominionStar share UI and final-illustration guardrails passed.')
          write(p,text)

          p='desktop 2/scripts/test-real-mac-regressions.mjs'; text=read(p)
          text=text.replace("assert(memberLogin.includes('const DESKTOP_OAUTH_RETURN = `${window.location.origin}/member-login/?desktop=1&oauth=complete`'));","assert(memberLogin.includes(\"const DESKTOP_OAUTH_CALLBACK = 'dominionstar://auth/callback'\"));")
          text=text.replace("assert(memberLogin.includes('redirectTo: DESKTOP_OAUTH_RETURN'));","assert(memberLogin.includes('redirectTo: DESKTOP_OAUTH_CALLBACK'));")
          text=text.replace("assert(memberLogin.includes('window.location.assign(data.url)'));","assert(memberLogin.includes('window.dominionDesktop?.openExternal?.(data.url)'));")
          text=text.replace("assert(!memberLogin.includes('window.dominionDesktop?.openExternal?.(data.url)'));\n",'')
          text=text.replace("// Modern macOS uses Apple's native picker through the one Electron handler.","// Modern macOS uses the approved DominionStar picker through one Electron handler.")
          text=text.replace("assert(nativeCapture.includes('major >= 15'));","assert(nativeCapture.includes('return false;'));")
          text=text.replace("assert(nativeCapture.includes(\"'macos-system-picker'\"));","assert(nativeCapture.includes(\"'dominionstar-custom-picker'\"));")
          text=text.replace("assert(main.includes(\"if (process.platform !== 'darwin') return false;\"));\nassert(main.includes('process.getSystemVersion?.()'));\nassert(main.includes('major >= 15'));","assert(main.includes('function supportsMacSystemPicker()'));\nassert(main.includes('return false;'));")
          text=text.replace('// Fallback remains safe for older macOS/Windows.','// Approved custom picker remains safe on macOS/Windows.')
          text=text.replace('REAL_MAC_RECOVERY_CONTRACT_OK single-home in-app-auth native-system-picker single-handler fallback-guarded','REAL_MAC_RECOVERY_CONTRACT_OK single-home browser-deeplink-auth dominionstar-picker single-handler guarded')
          write(p,text)
          PY

      - name: Verify desktop contracts
        run: |
          git diff --check
          npm --prefix "desktop 2" run verify

      - name: Commit parity correction
        shell: bash
        run: |
          rm -f .github/workflows/apply-approved-meet-parity-fix.yml
          rm -f .github/workflows/apply-approved-meet-parity-fix-v2.yml
          git config user.name "DominionStar QA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(meet): restore approved auth and screen-share parity"
          git push origin HEAD:prototype/meet-clean-foundation
