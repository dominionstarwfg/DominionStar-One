<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose what to share</title><link rel="stylesheet" href="./share-picker.css"></head><body><main class="picker-shell"><header class="picker-head"><strong>Choose what to share</strong></header><div class="picker-body"><section class="source-area"><div id="loadingState" class="loading-state"><div class="spinner"></div><strong>Loading shareable content…</strong><span>Your meeting remains active.</span></div><div id="errorState" class="error-state" hidden><strong>Screen sharing needs attention</strong><span id="errorCopy">DominionStar Meet could not load shareable screens.</span><div><button id="retrySources" type="button">Try Again</button><button id="openPrivacySettings" type="button">Open System Settings</button></div></div><div id="sourceContent" hidden><section class="source-group"><h2>Entire screen</h2><div id="screenGrid" class="source-grid screen-grid"></div></section><section class="source-group"><h2>Application windows</h2><div id="windowGrid" class="source-grid window-grid"></div></section></div></section><aside class="share-options"><h2>Share options</h2><label class="option-row"><input id="shareAudio" type="checkbox"><span>Share sound</span></label><label class="option-row"><input id="optimizeVideo" type="checkbox"><span>Optimize for video sharing</span></label><label class="option-row secondary-option"><input id="showDominionStar" type="checkbox"><span>Show DominionStar Meet windows</span></label><div class="selection-summary"><span>Selected</span><strong id="selectedName">Choose a source</strong></div></aside></div><footer class="picker-footer"><button id="cancelBottom" class="secondary" type="button">Cancel</button><button id="shareButton" class="primary" type="button" disabled>Share</button></footer></main><script src="./share-picker.js"></script></body></html>
