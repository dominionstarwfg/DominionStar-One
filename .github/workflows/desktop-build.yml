name: DominionStar Desktop Installers

on:
  workflow_dispatch:

  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: dominionstar-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:

  windows:
    name: Windows Desktop
    runs-on: windows-latest

    defaults:
      run:
        working-directory: "desktop 2"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".Replace("desktop-v", "")

          if ($packageVersion -ne $tagVersion) {
            Write-Error "Version mismatch: package.json=$packageVersion tag=$tagVersion"
            exit 1
          }

      - name: Clean previous build output
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Run DominionStar certification
        run: npm run verify

      - name: Build Windows installers
        run: npm run dist:windows

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object {
              $_.Extension -in ".exe", ".yml", ".blockmap"
            } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File dist/SHA256SUMS-Windows.txt -Encoding utf8

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: DominionStar-Windows-${{ github.sha }}
          path: |
            desktop 2/dist/*.exe
            desktop 2/dist/*.blockmap
            desktop 2/dist/latest*.yml
            desktop 2/dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 14


  macos:
    name: macOS Desktop
    runs-on: macos-latest

    defaults:
      run:
        working-directory: "desktop 2"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PACKAGE_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Clean previous build output
        run: rm -rf dist

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare native replacement tooling
        run: chmod 0755 build/pkg-scripts/preinstall build/pkg-scripts/postinstall scripts/build-macos-pkg.sh

      - name: Run DominionStar certification
        run: npm run verify

      - name: Build universal macOS app, DMG and ZIP
        run: npm run dist:mac

      - name: Build deterministic Apple replacement PKG
        run: npm run dist:mac:pkg

      - name: Certify and smoke-test macOS replacement PKG
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          PKG="dist/DominionStar-Meet-${VERSION}-mac-universal.pkg"
          STAGED_PLIST="dist/mac-universal/DominionStar Meet.app/Contents/Info.plist"
          TEST_APP="/Applications/DominionStar Meet.app"
          TEST_PLIST="$TEST_APP/Contents/Info.plist"

          cleanup() {
            sudo rm -rf "$TEST_APP" >/dev/null 2>&1 || true
            rm -rf dist/pkg-audit /tmp/dominionstar-stale.plist
          }
          trap cleanup EXIT

          test -f "$PKG"
          test -f "$STAGED_PLIST"

          STAGED_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$STAGED_PLIST")
          STAGED_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$STAGED_PLIST")
          if [ "$STAGED_VERSION" != "$VERSION" ] || [ "$STAGED_ID" != "com.dominionstar.desktop" ]; then
            echo "::error::Staged app identity failed: version=$STAGED_VERSION bundle=$STAGED_ID" >&2
            exit 1
          fi
          echo "Staged app identity verified: version=$STAGED_VERSION bundle=$STAGED_ID"

          rm -rf dist/pkg-audit
          /usr/sbin/pkgutil --expand-full "$PKG" dist/pkg-audit

          PAYLOAD_PLIST=$(find dist/pkg-audit -type f -path '*/Applications/DominionStar Meet.app/Contents/Info.plist' -print -quit)
          PREINSTALL=$(find dist/pkg-audit -type f -name preinstall -print -quit)
          POSTINSTALL=$(find dist/pkg-audit -type f -name postinstall -print -quit)

          if [ -z "$PAYLOAD_PLIST" ]; then
            echo "::error::Native PKG is missing the DominionStar Meet application payload" >&2
            find dist/pkg-audit -maxdepth 5 -print | sort
            exit 1
          fi
          if [ -z "$PREINSTALL" ]; then
            echo "::error::Native PKG is missing the preinstall stale-app replacement hook" >&2
            find dist/pkg-audit -maxdepth 5 -print | sort
            exit 1
          fi
          if [ -z "$POSTINSTALL" ]; then
            echo "::error::Native PKG is missing the postinstall version-attestation hook" >&2
            find dist/pkg-audit -maxdepth 5 -print | sort
            exit 1
          fi

          /bin/sh -n "$PREINSTALL"
          /bin/sh -n "$POSTINSTALL"
          PAYLOAD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PAYLOAD_PLIST")
          PAYLOAD_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PAYLOAD_PLIST")
          test "$PAYLOAD_VERSION" = "$VERSION"
          test "$PAYLOAD_ID" = "com.dominionstar.desktop"
          grep -F '/Applications/DominionStar Meet.app' "$PREINSTALL"
          grep -F "EXPECTED_VERSION=\"$VERSION\"" "$POSTINSTALL"
          grep -F 'EXPECTED_ID="com.dominionstar.desktop"' "$POSTINSTALL"
          echo "Native PKG structure verified: payload=$PAYLOAD_VERSION hooks=present"

          sudo -n true
          sudo rm -rf "$TEST_APP"
          sudo mkdir -p "$TEST_APP/Contents"
          cat > /tmp/dominionstar-stale.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.dominionstar.desktop</string>
            <key>CFBundleShortVersionString</key><string>1.1.8</string>
            <key>CFBundleVersion</key><string>1.1.8</string>
          </dict></plist>
          PLIST
          sudo cp /tmp/dominionstar-stale.plist "$TEST_PLIST"
          sudo touch "$TEST_APP/STALE-1.1.8-SENTINEL"
          sudo rm -f /var/log/dominionstar-meet-installer.log

          echo "Installing native PKG over synthetic stale DominionStar Meet v1.1.8..."
          sudo /usr/sbin/installer -pkg "$PKG" -target /

          test -f "$TEST_PLIST"
          if [ -e "$TEST_APP/STALE-1.1.8-SENTINEL" ]; then
            echo "::error::Stale v1.1.8 bundle survived package installation" >&2
            exit 1
          fi

          INSTALLED_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$TEST_PLIST")
          INSTALLED_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_PLIST")
          test "$INSTALLED_VERSION" = "$VERSION"
          test "$INSTALLED_ID" = "com.dominionstar.desktop"
          test -x "$TEST_APP/Contents/MacOS/DominionStar Meet"

          ARCHS=$(/usr/bin/lipo -archs "$TEST_APP/Contents/MacOS/DominionStar Meet")
          echo "$ARCHS" | grep -F 'x86_64'
          echo "$ARCHS" | grep -F 'arm64'

          sudo test -f /var/log/dominionstar-meet-installer.log
          sudo grep -F '[preinstall]' /var/log/dominionstar-meet-installer.log
          sudo grep -F 'Removing existing app version 1.1.8' /var/log/dominionstar-meet-installer.log
          sudo grep -F 'Install attested successfully' /var/log/dominionstar-meet-installer.log

          echo "macOS native PKG replacement smoke test passed: 1.1.8 -> $INSTALLED_VERSION; archs=$ARCHS"

      - name: Generate macOS checksums
        run: |
          cd dist

          find . -maxdepth 1 -type f \
            \( -name "*.dmg" -o -name "*.zip" -o -name "*.pkg" -o -name "*.blockmap" -o -name "*.yml" \) \
            -print0 |
          sort -z |
          xargs -0 shasum -a 256 > SHA256SUMS-macOS.txt

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: DominionStar-macOS-${{ github.sha }}
          path: |
            desktop 2/dist/*.dmg
            desktop 2/dist/*.zip
            desktop 2/dist/*.pkg
            desktop 2/dist/*.blockmap
            desktop 2/dist/latest*.yml
            desktop 2/dist/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 14


  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - windows
      - macos

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download verified Windows and macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DominionStar-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail

          echo "Release payload:"
          find release -maxdepth 1 -type f -print | sort

          test -n "$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -f release/latest.yml
          test -f release/latest-mac.yml
          test -f release/SHA256SUMS-Windows.txt
          test -f release/SHA256SUMS-macOS.txt

      - name: Publish DominionStar GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#desktop-v}"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "DominionStar Meet v${VERSION}" \
              --generate-notes
          fi
