[build]
  command = "bash scripts/build-netlify-site.sh"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Pull-request deploy previews must package the current candidate, not the last
# production-certified release. Production continues to use the locked build
# above, so this does not weaken production cutover protection.
[context.deploy-preview]
  command = "bash scripts/build-netlify-preview.sh"
  publish = ".preview-package/public"

[[redirects]]
  from = "/api/founder-data"
  to = "/.netlify/functions/founder-data"
  status = 200

[[headers]]
  for = "/founder-dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/meet/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)"

[[headers]]
  for = "/meet-home/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/meet-login/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
