name: Operation 2030 Annotation Hash

on:
  push:
    branches:
      - agent/operation-2030-synced-annotation

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Compute protected annotation hashes
        run: |
          sha256sum assets/js/meet/share-view-controls.js
          sha256sum assets/js/meet/share-annotation.js
