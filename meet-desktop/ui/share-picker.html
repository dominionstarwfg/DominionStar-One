<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar Meet – Share Screen</title>
  <link rel="stylesheet" href="./share-picker.css">
</head>
<body>
  <main class="picker-shell">
    <header class="picker-head">
      <h1>Select a window or an application that you want to share</h1>
      <button id="cancelTop" class="icon-button" type="button" aria-label="Close share chooser">×</button>
    </header>

    <nav class="source-tabs" aria-label="Share source category">
      <button class="tab active" type="button" data-tab="basic">Basic</button>
      <button class="tab" type="button" data-tab="advanced">Advanced</button>
      <button class="tab" type="button" data-tab="files">Files</button>
    </nav>

    <section class="source-area">
      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <strong>Finding screens and applications…</strong>
      </div>
      <div id="errorState" class="error-state" hidden>
        <strong>Share sources are unavailable</strong>
        <span id="errorCopy">Check Screen Recording permission and try again.</span>
        <button id="retrySources" type="button">Try Again</button>
      </div>
      <div id="sourceGrid" class="source-grid" hidden></div>
      <div id="advancedGrid" class="source-grid mode-grid" hidden></div>
      <div id="filesGrid" class="source-grid mode-grid" hidden></div>
    </section>

    <footer class="picker-footer">
      <div class="share-options">
        <label id="shareAudioRow" class="option-row">
          <input id="shareAudio" type="checkbox">
          <span>Share sound</span>
        </label>
        <label class="option-row">
          <input id="optimizeVideo" type="checkbox">
          <span>Optimize for video clip</span>
        </label>
        <label class="option-row">
          <input id="optimizeSharingVideo" type="checkbox">
          <span>Optimize for sharing video</span>
        </label>
      </div>
      <div class="footer-actions">
        <button id="cancelBottom" class="secondary" type="button">Cancel</button>
        <button id="shareButton" class="primary" type="button" disabled>Share</button>
      </div>
    </footer>
  </main>
  <script src="./share-picker.js"></script>
</body>
</html>
