<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DominionStar Meet – Presenter Controls</title>
  <link rel="stylesheet" href="./mac-presenter-toolbar.css">
</head>
<body>
  <main id="toolbar" class="toolbar" aria-label="DominionStar Meet sharing controls">
    <section class="control-strip">
      <button type="button" data-command="audio"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg></span><span id="audioLabel">Audio</span></button>
      <button type="button" data-command="video"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3z"/></svg></span><span id="videoLabel">Video</span></button>
      <button type="button" data-command="participants"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20a6 6 0 0 1 12 0M14 19a4.8 4.8 0 0 1 7 0"/></svg></span><span>Participants</span></button>
      <button type="button" data-command="chat"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></span><span>Chat</span></button>
      <button type="button" data-command="new-share"><span class="glyph share-glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="m8 11 4-4 4 4M12 7v8M8 21h8"/></svg></span><span>Share</span></button>
      <button type="button" data-command="pause"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></span><span id="pauseLabel">Pause</span></button>
      <div class="menu-wrap">
        <button id="layoutButton" type="button"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></svg></span><span>Layout</span></button>
        <div id="layoutMenu" class="popup-menu" hidden>
          <button type="button" data-command="layout-speaker">Speaker video</button>
          <button type="button" data-command="layout-gallery">Gallery video</button>
          <button type="button" data-command="layout-hide">Hide participant video</button>
        </div>
      </div>
      <button type="button" data-command="annotate"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 19 4.2-1 10-10-3.2-3.2-10 10L4 19zM13.8 6l3.2 3.2M3 21h18"/></svg></span><span>Annotate</span></button>
      <div class="menu-wrap">
        <button id="moreButton" type="button"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span><span>More</span></button>
        <div id="moreMenu" class="popup-menu more-menu" hidden>
          <button type="button" data-command="record" id="recordCommand">Record meeting</button>
          <button type="button" data-command="new-share">New Share</button>
          <button type="button" data-command="layout-speaker">Speaker video</button>
          <button type="button" data-command="layout-gallery">Gallery video</button>
          <button type="button" data-command="layout-hide">Hide participant video</button>
        </div>
      </div>
    </section>
    <section class="share-strip" aria-live="polite">
      <span class="share-copy"><span class="live-dot"></span><strong id="shareStateLabel">You are screen sharing</strong><small id="shareSourceLabel">Shared content</small></span>
      <span id="shareAudioFlag" class="flag" hidden>Sound</span><span id="shareOptimizeFlag" class="flag" hidden>Optimized</span>
      <button id="stopShare" class="stop-share" type="button"><span class="stop-share-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/></svg></span><span id="stopShareLabel">Stop Share</span></button>
    </section>
  </main>
  <script src="./mac-presenter-toolbar.js"></script>
</body>
</html>
