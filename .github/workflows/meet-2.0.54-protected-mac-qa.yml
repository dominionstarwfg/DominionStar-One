name: DominionStar Meet 2.0.54 Protected Mac QA

on:
  push:
    branches: [qa/meet-2.0.54-audit-fixes-20261021]
    paths:
      - 'meet-desktop/**'
      - '.github/workflows/meet-2.0.54-protected-mac-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dominionstar-meet-2-0-54-protected-qa
  cancel-in-progress: true

jobs:
  protected-mac-qa:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject production identities and wrong version
        run: |
          node meet-desktop/scripts/verify-qa-release-identity-2.0.54.mjs
          node --check meet-desktop/src/bootstrap.mjs
          node --check meet-desktop/src/relaunch-service.mjs
          node --check meet-desktop/src/main.mjs
          node --check meet-desktop/ui/webrtc-controller.js
      - name: WebRTC and meeting lifecycle regression checks
        run: |
          node meet-desktop/scripts/verify-physical-media-fallback-20261016.mjs
          node meet-desktop/scripts/verify-ice-relay-escalation-20261016.mjs
          node meet-desktop/scripts/verify-meeting-exit-signaling-20261016.mjs
          node meet-desktop/scripts/verify-live-share-gate-20261014.mjs --self-test
          node meet-desktop/scripts/verify-capture-answer-replay-20261014.mjs
      - name: Install app dependencies
        working-directory: meet-desktop
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install browser test runner
        working-directory: meet-desktop
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Exercise independent two-client WebRTC in Chromium
        run: node meet-desktop/scripts/test-two-client-webrtc-2.0.41.mjs
      - name: Package separately named universal macOS QA app
        working-directory: meet-desktop
        run: npx electron-builder --mac dir --universal --publish never
      - name: Verify protected bundle metadata and signature
        id: packaged
        shell: bash
        run: |
          APP="$(find meet-desktop/dist -maxdepth 3 -type d -name 'DominionStar Meet QA.app' -print -quit)"
          test -n "$APP"
          test ! -d "meet-desktop/dist/mac-universal/DominionStar Meet.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx 'com.dominionstar.desktop.qa'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | grep -Fx '2.0.54'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP/Contents/Info.plist" | grep -Fx 'DominionStar Meet QA'
          test -x "$APP/Contents/MacOS/DominionStar Meet QA"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
      - name: Launch QA app without touching the production installation
        shell: bash
        run: |
          APP="${{ steps.packaged.outputs.path }}"
          LOG="$RUNNER_TEMP/dominionstar-qa-launch.log"
          ELECTRON_ENABLE_LOGGING=1 "$APP/Contents/MacOS/DominionStar Meet QA" >"$LOG" 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG" >&2 || true
            exit 93
          fi
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if grep -E 'Library not loaded|DYLD.*Library missing|different Team IDs' "$LOG"; then
            exit 94
          fi
          echo 'PASS QA packaged app launched without replacing production'
      - name: Create isolated QA archive with provenance
        shell: bash
        run: |
          mkdir -p qa-2.0.54
          ZIP="qa-2.0.54/DominionStar-Meet-2.0.54-Mac-universal-QA.zip"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.packaged.outputs.path }}" "$ZIP"
          test -s "$ZIP"
          shasum -a 256 "$ZIP" > qa-2.0.54/SHA256.txt
          printf 'branch=qa/meet-2.0.54-audit-fixes-20261021\ncommit=%s\nversion=2.0.54\nproduct=DominionStar Meet QA\nbundle_id=com.dominionstar.desktop.qa\nproduction=false\nnotarized=false\nsigning=ad-hoc\nrequires_macos=12_or_later\nauthorization=independent_qa_app\nphysical_two_mac_acceptance=NOT_VERIFIED\n' "$GITHUB_SHA" > qa-2.0.54/BUILD-PROVENANCE.txt
      - name: Upload protected QA candidate (not a production release)
        uses: actions/upload-artifact@v4
        with:
          name: DominionStar-Meet-2.0.54-Protected-Mac-QA
          path: qa-2.0.54/*
          if-no-files-found: error
          retention-days: 14
