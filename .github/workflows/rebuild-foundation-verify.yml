name: DominionStar Meet Rebuild Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'meet-desktop/**'
      - 'scripts/build-rebuild-netlify.sh'
      - 'netlify.toml'
      - '.github/workflows/rebuild-foundation-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild candidate
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production auth dependency resolves
        working-directory: meet-desktop
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node -e "import('@supabase/supabase-js').then(m=>{if(typeof m.createClient!=='function')process.exit(2);console.log('SUPABASE_JS_RUNTIME_OK')})"
      - name: Verify desktop source syntax
        run: |
          node --check 'meet-desktop/src/main.mjs'
          node --check 'meet-desktop/src/auth-service.mjs'
          node --check 'meet-desktop/src/meeting-service.mjs'
          node --check 'meet-desktop/src/share-source-authority.mjs'
          node --check 'meet-desktop/src/share-service.mjs'
          node --check 'meet-desktop/src/preload.cjs'
          node --check 'meet-desktop/ui/auth-password.js'
          node --check 'meet-desktop/ui/av-settings.js'
          node --check 'meet-desktop/ui/video-effects.js'
          node --check 'meet-desktop/ui/meeting-parity.js'
          node --check 'meet-desktop/ui/meeting-features.js'
          node --check 'meet-desktop/ui/meeting-captions.js'
          node --check 'meet-desktop/ui/zoom-behavior.js'
          node --check 'meet-desktop/ui/zoom-adaptive-parity.js'
          node --check 'meet-desktop/ui/approved-reference-parity.js'
          node --check 'meet-desktop/ui/runtime-stability.js'
          node --check 'meet-desktop/ui/participant-controls.js'
          node --check 'meet-desktop/ui/meeting-notifications.js'
          node --check 'meet-desktop/ui/preferences.js'
          node --check 'meet-desktop/ui/personal-room.js'
          node --check 'meet-desktop/ui/schedule-controller.js'
          node --check 'meet-desktop/ui/media-controller.js'
          node --check 'meet-desktop/ui/share-controller.js'
          node --check 'meet-desktop/ui/share-integration.js'
          node --check 'meet-desktop/ui/share-annotation.js'
          node --check 'meet-desktop/ui/share-picker.js'
          node --check 'meet-desktop/ui/presenter-toolbar.js'
          node --check 'meet-desktop/ui/webrtc-controller.js'
          node --check 'meet-desktop/ui/diagnostics.js'
          node --check 'meet-desktop/ui/app.js'
          node --check 'meet-desktop/scripts/verify-meeting-identity-runtime.mjs'
          node --check 'meet-desktop/scripts/verify-approved-reference-parity-2.0.22.mjs'
          node --check 'meet-desktop/scripts/verify-runtime-stability-2.0.22.mjs'
          node --check 'meet-desktop/scripts/verify-packaged-approved-reference-2.0.22.mjs'
          node --check 'meet-desktop/scripts/verify-packaged-runtime-stability-2.0.22.mjs'
      - name: Verify clean Home contract
        run: node 'meet-desktop/scripts/verify-foundation.mjs'
      - name: Verify desktop authentication contract
        run: node 'meet-desktop/scripts/verify-auth.mjs'
      - name: Verify Zoom-style meeting identity lifecycle
        run: node 'meet-desktop/scripts/verify-meeting-lifecycle.mjs'
      - name: Exercise meeting identity runtime
        run: node 'meet-desktop/scripts/verify-meeting-identity-runtime.mjs'
      - name: Verify prejoin media and role authority
        run: node 'meet-desktop/scripts/verify-media-authority.mjs'
      - name: Verify restored audio video settings
        run: node 'meet-desktop/scripts/verify-av-settings.mjs'
      - name: Verify approved meeting chrome and Zoom behavior
        run: node 'meet-desktop/scripts/verify-meeting-parity.mjs'
      - name: Verify nonblocking screen-share authority
        run: node 'meet-desktop/scripts/verify-share-authority.mjs'
      - name: Verify real-time participant media transport
        run: node 'meet-desktop/scripts/verify-webrtc-transport.mjs'
      - name: Verify TURN relay reliability architecture
        run: node 'meet-desktop/scripts/verify-turn-relay.mjs'
      - name: Verify physical QA diagnostics
        run: node 'meet-desktop/scripts/verify-diagnostics.mjs'
      - name: Verify approved 3D reference source parity
        run: node 'meet-desktop/scripts/verify-approved-reference-parity-2.0.22.mjs'
      - name: Verify physical runtime stability
        run: node 'meet-desktop/scripts/verify-runtime-stability-2.0.22.mjs'
      - name: Verify Netlify publishes the same UI
        run: bash scripts/build-rebuild-netlify.sh
      - name: Assert legacy runtime is absent
        run: |
          test ! -e desktop
          test ! -e 'desktop 2'
          test ! -e meet
          test ! -e meet-home
          test ! -e meet-login
          test ! -e assets/js/meeting-engine.js
          echo DOMINIONSTAR_REBUILD_LEGACY_ABSENT_OK
