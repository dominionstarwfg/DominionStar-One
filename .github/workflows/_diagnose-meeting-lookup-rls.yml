name: Diagnose Meeting Lookup RLS

on:
  push:
    branches:
      - fix/camera-privacy-reacquire-and-meeting-lookup
    paths:
      - .github/workflows/_diagnose-meeting-lookup-rls.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe anonymous meeting-table visibility safely
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL='https://ckmurvhjumzlhsegncba.supabase.co'
          ANON_KEY='sb_publishable_zAzk_tobvWHOWR22bmzMMw_uqHnCVxb'
          ROOM='2389103606'
          probe() {
            table="$1"; column="$2"; fields="$3"
            code=$(curl -sS -o "/tmp/${table}.json" -w '%{http_code}' \
              -H "apikey: ${ANON_KEY}" \
              -H "Authorization: Bearer ${ANON_KEY}" \
              -H 'Accept: application/json' \
              "${SUPABASE_URL}/rest/v1/${table}?select=${fields}&${column}=eq.${ROOM}")
            echo "${table}: HTTP ${code}"
            python3 - "$table" <<'PY'
          import json,sys
          table=sys.argv[1]
          path=f'/tmp/{table}.json'
          try:
              data=json.load(open(path))
          except Exception:
              print(f'{table}: non-json response')
              raise SystemExit
          if isinstance(data,list):
              print(f'{table}: visible_rows={len(data)}')
              if data:
                  print(f'{table}: anonymous_row_visibility=YES')
          elif isinstance(data,dict):
              print(f"{table}: error_code={data.get('code','')} message={str(data.get('message',''))[:120]}")
          PY
          }
          # Never request or print passcodes. This probe only determines whether
          # anonymous clients can see the non-secret meeting identity/authority fields.
          probe meet_rooms room_id 'room_id,owner_id,waiting_room_enabled,active'
          probe meet_scheduled_meetings meeting_id 'meeting_id,user_id,waiting_room_enabled'
          probe meet_personal_rooms personal_room_id 'personal_room_id,user_id,waiting_room_enabled'
