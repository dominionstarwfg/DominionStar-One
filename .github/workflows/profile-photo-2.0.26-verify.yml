name: DominionStar Meet Profile Photo 2.0.26

on:
  pull_request:
    branches: [ci/stacked-2.0.26-base]
    paths:
      - 'meet-desktop/ui/profile-photo-fallback.js'
      - 'meet-desktop/scripts/verify-profile-photo-camera-off-2.0.26.mjs'
      - 'meet-desktop/scripts/verify-packaged-profile-photo-camera-off-2.0.26.mjs'
      - 'meet-desktop/scripts/verify-profile-photo-fallback-2.0.24.mjs'
      - 'meet-desktop/scripts/verify-packaged-profile-photo-fallback-2.0.24-v2.mjs'
      - '.github/workflows/profile-photo-2.0.26-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-photo-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact profile-photo candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify profile-photo source syntax
        working-directory: meet-desktop
        run: |
          node --check ui/profile-photo-fallback.js
          node --check scripts/verify-profile-photo-camera-off-2.0.26.mjs
          node --check scripts/verify-packaged-profile-photo-camera-off-2.0.26.mjs
      - name: Re-run private avatar transport and fallback contract
        working-directory: meet-desktop
        run: node scripts/verify-profile-photo-fallback-2.0.24.mjs
      - name: Verify camera-off Gallery and Multi-speaker identity contract
        working-directory: meet-desktop
        run: node scripts/verify-profile-photo-camera-off-2.0.26.mjs
      - name: Re-run inherited meeting and runtime authority gates
        working-directory: meet-desktop
        run: |
          node scripts/verify-meeting-parity.mjs
          node scripts/verify-webrtc-transport.mjs
          node scripts/verify-share-authority.mjs
          node scripts/verify-runtime-stability-2.0.22.mjs

  profile-photo-mac-package:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - name: Checkout exact profile-photo candidate
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rebuild dependencies
        working-directory: meet-desktop
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build signed arm64 QA app
        working-directory: meet-desktop
        run: npx electron-builder --mac dir --arm64 --publish never
      - name: Locate packaged app
        id: app
        shell: bash
        run: |
          APP_PATH="$(find meet-desktop/dist -maxdepth 3 -type d -name 'DominionStar Meet.app' -print -quit)"
          test -n "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Audit packaged app contents
        working-directory: meet-desktop
        run: node scripts/verify-packaged-app.mjs "../${{ steps.app.outputs.path }}"
      - name: Re-run packaged photo-first and initials fallback
        working-directory: meet-desktop
        run: node scripts/verify-packaged-profile-photo-fallback-2.0.24-v2.mjs "../${{ steps.app.outputs.path }}"
      - name: Exercise packaged Gallery and Multi-speaker camera-off identity
        working-directory: meet-desktop
        run: node scripts/verify-packaged-profile-photo-camera-off-2.0.26.mjs "../${{ steps.app.outputs.path }}"
