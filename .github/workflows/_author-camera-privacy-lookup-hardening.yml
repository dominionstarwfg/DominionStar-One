name: Author Camera Privacy Lookup Hardening

on:
  push:
    branches:
      - fix/camera-privacy-lookup-ui-hardening
    paths:
      - .github/workflows/_author-camera-privacy-lookup-hardening.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/camera-privacy-lookup-ui-hardening
          fetch-depth: 0

      - name: Apply hardened candidate
        run: python3 scripts/_author_camera_privacy_lookup.py

      - name: Validate hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/meeting-engine.js
          node --check assets/js/meet-next/executive6.js
          node --check assets/js/meet/hotfix-rc13-1-media-prejoin.js
          node --check netlify/functions/resolve-meeting-join.mjs
          node scripts/test-camera-privacy-lookup-hardening.mjs
          node scripts/test-production-meet-rc13.mjs
          node scripts/test-desktop-prejoin-bootstrap.mjs
          node scripts/test-personal-room-native-prejoin.mjs

      - name: Commit hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DominionStar Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/js/meeting-engine.js \
            assets/js/meet-next/executive6.js \
            assets/js/meet/hotfix-rc13-1-media-prejoin.js \
            netlify/functions/resolve-meeting-join.mjs \
            meet/index.html meet/release-contract.json \
            scripts/test-production-meet-rc13.mjs \
            scripts/test-desktop-prejoin-bootstrap.mjs \
            scripts/test-personal-room-native-prejoin.mjs \
            scripts/test-camera-privacy-lookup-hardening.mjs
          git diff --cached --check
          git commit -m 'Harden camera privacy, clean reacquisition and meeting lookup'
          git push origin HEAD:fix/camera-privacy-lookup-ui-hardening
