<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in — DominionStar Meet</title>
    <link rel="icon" href="/assets/logo.jpeg" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #07090e;
        color: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at 50% 0,
          #27200d 0,
          #0c1018 38%,
          #05070b 100%
        );
      }
      main {
        width: min(520px, 92vw);
        padding: 42px;
        border: 1px solid #333946;
        border-radius: 26px;
        background: #10141dde;
        box-shadow: 0 28px 90px #0009;
      }
      .brand {
        color: #e7c257;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.2em;
      }
      .crest {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #9d7b2b;
      }
      h1 {
        font:
          600 38px/1.1 Georgia,
          serif;
        margin: 20px 0 8px;
      }
      .sub {
        color: #aeb6c5;
        margin: 0 0 26px;
        line-height: 1.5;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .tabs button {
        flex: 1;
        border: 1px solid #343b49;
        background: #171c26;
        color: #bfc6d3;
        border-radius: 11px;
        padding: 11px;
      }
      .tabs button.active {
        border-color: #d4aa3d;
        color: #f1cf6a;
        background: #d4aa3d18;
      }
      form {
        display: grid;
        gap: 14px;
      }
      label {
        display: grid;
        gap: 7px;
        color: #c9ced8;
        font-size: 14px;
      }
      input {
        width: 100%;
        border: 1px solid #3a4250;
        border-radius: 11px;
        background: #090c12;
        color: #fff;
        padding: 13px;
        font-size: 16px;
      }
      button,
      .button {
        border: 0;
        border-radius: 11px;
        padding: 13px 16px;
        font-weight: 750;
        font-size: 15px;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
      }
      .primary {
        background: #d8ad39;
        color: #171105;
      }
      .google {
        width: 100%;
        margin: 18px 0 10px;
        background: #fff;
        color: #202124;
      }
      .guest {
        display: block;
        color: #d8b550;
        margin-top: 18px;
      }
      .message {
        min-height: 22px;
        color: #efb0a8;
        margin-top: 12px;
      }
      .fine {
        color: #77808e;
        font-size: 12px;
        margin-top: 24px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="crest" src="/assets/logo.jpeg" alt="" />
      <div class="brand">DOMINIONSTAR MEET</div>
      <h1>Welcome to Meet</h1>
      <p class="sub">
        Sign in to keep your identity and meetings on every device.
      </p>
      <div class="tabs">
        <button id="memberTab" class="active">Member or Agent</button
        ><button id="publicTab">Meet account</button>
      </div>
      <form id="loginForm">
        <label
          >Email<input
            name="email"
            type="email"
            autocomplete="email"
            required /></label
        ><label
          >Password<input
            name="password"
            type="password"
            autocomplete="current-password"
            required /></label
        ><button class="primary">Sign in to Meet</button>
      </form>
      <form id="registerForm" class="hidden">
        <label
          >Your name<input name="name" autocomplete="name" required /></label
        ><label
          >Email<input
            name="email"
            type="email"
            autocomplete="email"
            required /></label
        ><label
          >Password<input
            name="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            required /></label
        ><button class="primary">Create Meet account</button>
      </form>
      <button id="googleBtn" class="google">Continue with Google</button
      ><a class="guest" href="/meet/?desktop=1&amp;guest=1&amp;action=join"
        >Join a meeting as a guest →</a
      >
      <div id="message" class="message" role="status"></div>
      <div class="fine">
        Guests may join meetings. Creating or hosting meetings requires a Meet
        account. The Agent Dashboard remains on the DominionStar website.
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/supabase-config.js?v=2-meet-auth"></script>
    <script src="/assets/js/member-auth.js?v=2-meet-session-persistence"></script>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id),
          params = new URLSearchParams(location.search),
          desktop = params.get("desktop") === "1",
          destination = `/meet-home/${desktop ? "?desktop=1" : ""}`;
        let client;
        const message = (text) => ($("message").textContent = text);
        const init = async () => (client = await window.DSAuth?.init?.());
        $("memberTab").onclick = () => {
          $("memberTab").classList.add("active");
          $("publicTab").classList.remove("active");
          $("loginForm").classList.remove("hidden");
          $("registerForm").classList.add("hidden");
        };
        $("publicTab").onclick = () => {
          $("publicTab").classList.add("active");
          $("memberTab").classList.remove("active");
          $("registerForm").classList.remove("hidden");
          $("loginForm").classList.add("hidden");
        };
        if (params.get("mode") === "public") $("publicTab").click();
        $("loginForm").onsubmit = async (e) => {
          e.preventDefault();
          message("Signing in…");
          const c = client || (await init());
          const { error } = await c.auth.signInWithPassword({
            email: e.target.email.value.trim().toLowerCase(),
            password: e.target.password.value,
          });
          if (error) return message(error.message);
          location.href = destination;
        };
        $("registerForm").onsubmit = async (e) => {
          e.preventDefault();
          message("Creating your Meet account…");
          const c = client || (await init());
          const { data, error } = await c.auth.signUp({
            email: e.target.email.value.trim().toLowerCase(),
            password: e.target.password.value,
            options: {
              data: {
                full_name: e.target.name.value.trim(),
                account_type: "meet",
              },
            },
          });
          if (error) return message(error.message);
          if (data?.session) location.href = destination;
          else
            message(
              "Account created. Check your email to confirm it, then sign in.",
            );
        };
        $("googleBtn").onclick = async () => {
          message(
            desktop ? "Opening Google in your browser…" : "Opening Google…",
          );
          const c = client || (await init());
          const redirectTo = desktop
            ? `${location.origin}/meet-login/?oauth=desktop-return`
            : location.origin + destination;
      const { data, error } = await c.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo,
          skipBrowserRedirect: desktop,
          queryParams: { prompt: "select_account" },
        },
      });
          if (error) {
            message(
              /provider is not enabled/i.test(error.message)
                ? "Google sign-in needs to be enabled for DominionStar Meet. Please use email sign-in for this build."
                : error.message,
            );
            return;
          }
          if (desktop && data?.url) {
            const opened = await window.dominionDesktop?.openExternal?.(
              data.url,
            );
            message(
              opened
                ? "Finish signing in with Google in your browser. This app will reopen automatically."
                : "Could not open your browser.",
            );
          }
        };
        const finishOAuth = async () => {
          const c = client || (await init());
          if (params.get("oauth") === "complete") {
            const hash = new URLSearchParams(location.hash.slice(1)),
              access_token = hash.get("access_token"),
              refresh_token = hash.get("refresh_token");
            if (!access_token || !refresh_token)
              return message("Google did not return a valid Meet session.");
            // Remove credentials from the address bar and renderer history
            // before any asynchronous storage/network work. The values remain
            // only in this short-lived callback scope until Supabase stores the
            // persistent desktop session.
            history.replaceState(
              null,
              "",
              `${location.pathname}?desktop=1&oauth=complete`,
            );
            const { error } = await c.auth.setSession({
              access_token,
              refresh_token,
            });
            if (error) return message(error.message);
            location.replace(destination);
          } else if (params.get("oauth") === "desktop-return") {
            message("Returning you to DominionStar Meet…");
            let session = (await c.auth.getSession()).data.session;
            for (let attempt = 0; !session && attempt < 8; attempt++) {
              await new Promise((r) => setTimeout(r, 250));
              session = (await c.auth.getSession()).data.session;
            }
            if (!session)
              return message(
                "Google sign-in could not be completed. You may close this tab and try again.",
              );
            location.href = `dominionstar://auth/callback#access_token=${encodeURIComponent(session.access_token)}&refresh_token=${encodeURIComponent(session.refresh_token)}`;
          }
        };
        init()
          .then(finishOAuth)
          .catch(() => message("Sign-in service is temporarily unavailable."));
      })();
    </script>
  </body>
</html>
