name: DominionStar Desktop Installers

on:
  workflow_dispatch:

  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: dominionstar-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".Replace("desktop-v", "")
          if ($packageVersion -ne $tagVersion) {
            Write-Error "Version mismatch: package.json=$packageVersion tag=$tagVersion"
            exit 1
          }

      - name: Verify Windows publisher credentials
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) { throw "WIN_CSC_LINK is required for tagged releases" }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) { throw "WIN_CSC_KEY_PASSWORD is required for tagged releases" }
          Write-Host "DOMINIONSTAR_WINDOWS_PUBLISHER_CREDENTIALS_PRESENT"

      - name: Clean previous build output
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce release trust policy
        run: node scripts/verify-release-trust.mjs

      - name: Enforce publisher trust policy
        run: node scripts/verify-publisher-trust.mjs

      - name: Audit production dependency supply chain
        run: npm audit --omit=dev --audit-level=high

      - name: Run clean-runtime certification
        run: npm run verify

      - name: Build Windows installers
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:windows

      - name: Verify Windows Authenticode signature
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File -Filter *.exe
          if (-not $files) { throw "No Windows installers found" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "AUTHENTICODE $($file.Name) status=$($signature.Status) subject=$($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($file.Name)" }
            if ($null -eq $signature.SignerCertificate) { throw "Missing Authenticode signer certificate: $($file.Name)" }
          }
          Write-Host "DOMINIONSTAR_WINDOWS_AUTHENTICODE_OK"

      - name: Enforce installer size budget
        run: node scripts/audit-artifact-sizes.mjs dist

      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File dist/SHA256SUMS-Windows.txt -Encoding utf8

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: DominionStar-Windows-${{ github.sha }}
          path: |
            desktop 2/dist/*.exe
            desktop 2/dist/*.blockmap
            desktop 2/dist/latest*.yml
            desktop 2/dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS Intel Install + Live Meet Certified
    runs-on: macos-26-intel
    timeout-minutes: 35
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Confirm Intel runner parity
        run: |
          test "$(uname -m)" = "x86_64"
          sw_vers
          uname -m

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#desktop-v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PACKAGE_VERSION tag=$TAG_VERSION"
            exit 1
          fi

      - name: Verify macOS publisher credentials
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "ERROR: $name is required for tagged releases" >&2; exit 1; }
          done
          echo "DOMINIONSTAR_MAC_PUBLISHER_CREDENTIALS_PRESENT"

      - name: Clean previous build output
        run: rm -rf dist

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce release trust policy
        run: node scripts/verify-release-trust.mjs

      - name: Enforce publisher trust policy
        run: node scripts/verify-publisher-trust.mjs

      - name: Audit production dependency supply chain
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare native replacement tooling
        run: chmod 0755 build/pkg-scripts/preinstall build/pkg-scripts/postinstall scripts/build-macos-pkg.sh scripts/test-macos-pkg.sh scripts/test-live-meet-contract.sh scripts/audit-live-hosted-runtime.sh

      - name: Run clean-runtime certification
        run: npm run verify

      - name: Audit live hosted Meet release contract
        run: bash scripts/audit-live-hosted-runtime.sh

      - name: Build universal macOS app, DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - name: Verify Developer ID signature and notarization
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          set -euo pipefail
          APP="dist/mac-universal/DominionStar Meet.app"
          DMG=$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -d "$APP"
          test -n "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee /tmp/dominionstar-codesign.txt
          grep -q "Authority=Developer ID Application:" /tmp/dominionstar-codesign.txt
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "DOMINIONSTAR_MAC_DEVELOPER_ID_NOTARIZATION_OK"

      - name: Build deterministic Apple replacement PKG
        run: npm run dist:mac:pkg

      - name: Production PKG intentionally excluded until Developer ID Installer signing is certified
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          echo "Internal PKG replacement test retained; production publication blocked by artifact allowlist."

      - name: Enforce installer size budget
        run: node scripts/audit-artifact-sizes.mjs dist

      - name: Install over stale v1.1.8 and launch the installed app
        run: bash scripts/test-macos-pkg.sh

      - name: Reinstall and prove actual app passes live Meet contract
        run: bash scripts/test-live-meet-contract.sh

      - name: Generate macOS checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f \
            \( -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" -o -name "*.yml" \) \
            -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS-macOS.txt

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: DominionStar-macOS-${{ github.sha }}
          path: |
            desktop 2/dist/*.dmg
            desktop 2/dist/*.zip
            desktop 2/dist/*.blockmap
            desktop 2/dist/latest*.yml
            desktop 2/dist/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows and macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: DominionStar-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -print | sort
          test -n "$(find release -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -z "$(find release -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -f release/latest.yml
          test -f release/latest-mac.yml
          test -f release/SHA256SUMS-Windows.txt
          test -f release/SHA256SUMS-macOS.txt

      - name: Publish DominionStar GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "DominionStar Meet v${VERSION}" \
              --generate-notes
          fi
