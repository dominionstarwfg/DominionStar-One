name: DominionStar Desktop Manual QA Artifact

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Certified Netlify PR preview origin"
        required: true
        default: "https://deploy-preview-82--melodious-buttercream-a99450.netlify.app"
      reason:
        description: "Release-candidate reason"
        required: false
        default: "manual QA candidate"

permissions:
  contents: read

concurrency:
  group: dominionstar-desktop-manual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-manual-qa:
    name: macOS Manual QA Artifact
    runs-on: macos-26-intel
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "desktop 2"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Bind this QA build to the certified PR preview
        env:
          QA_PREVIEW_ORIGIN: ${{ inputs.preview_url }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const origin=String(process.env.QA_PREVIEW_ORIGIN||'').replace(/\/$/,'');
          const url=new URL(origin);
          if(url.protocol!=='https:' || !/^deploy-preview-\d+--melodious-buttercream-a99450\.netlify\.app$/.test(url.hostname)){
            throw new Error(`Refusing untrusted QA preview origin: ${origin}`);
          }

          const mainPath='src/main-v2.mjs';
          let main=fs.readFileSync(mainPath,'utf8');
          const prodOrigin="const APP_ORIGIN = 'https://dominionstarld.com';";
          if(!main.includes(prodOrigin)) throw new Error('Expected production APP_ORIGIN marker is missing');
          main=main.replace(prodOrigin,`const APP_ORIGIN = '${url.origin}';`);
          const prodHosts="const TRUSTED_HOSTS = new Set(['dominionstarld.com', 'www.dominionstarld.com']);";
          if(!main.includes(prodHosts)) throw new Error('Expected TRUSTED_HOSTS marker is missing');
          main=main.replace(prodHosts,`const TRUSTED_HOSTS = new Set(['${url.hostname}']);`);
          fs.writeFileSync(mainPath,main);

          const preloadPath='src/preload.cjs';
          let preload=fs.readFileSync(preloadPath,'utf8');
          const prodOrigins="const TRUSTED_ORIGINS = new Set(['https://dominionstarld.com', 'https://www.dominionstarld.com']);";
          if(!preload.includes(prodOrigins)) throw new Error('Expected preload TRUSTED_ORIGINS marker is missing');
          preload=preload.replace(prodOrigins,`const TRUSTED_ORIGINS = new Set(['${url.origin}']);`);
          fs.writeFileSync(preloadPath,preload);

          const dockPath='src/presenter-dock.mjs';
          let dock=fs.readFileSync(dockPath,'utf8');
          const prodDockHosts="const TRUSTED_HOSTS=new Set(['dominionstarld.com','www.dominionstarld.com']);";
          if(!dock.includes(prodDockHosts)) throw new Error('Expected presenter-dock TRUSTED_HOSTS marker is missing');
          dock=dock.replace(prodDockHosts,`const TRUSTED_HOSTS=new Set(['${url.hostname}']);`);
          fs.writeFileSync(dockPath,dock);

          const reboundMain=fs.readFileSync(mainPath,'utf8');
          const reboundPreload=fs.readFileSync(preloadPath,'utf8');
          const reboundDock=fs.readFileSync(dockPath,'utf8');
          if(!reboundMain.includes(url.origin) || !reboundPreload.includes(url.origin) || !reboundDock.includes(url.hostname)){
            throw new Error('QA preview trust binding did not reach every desktop sharing surface');
          }
          console.log(`DOMINIONSTAR_QA_PREVIEW_BOUND ${url.origin}`);
          console.log(`DOMINIONSTAR_QA_PRESENTER_DOCK_TRUST_OK ${url.hostname}`);
          NODE

      - name: Verify selected PR preview is reachable
        env:
          QA_PREVIEW_ORIGIN: ${{ inputs.preview_url }}
        run: |
          curl --fail --silent --show-error --location --max-time 15 \
            "${QA_PREVIEW_ORIGIN%/}/meet/release-contract.json" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);if(!c.releaseId||!c.desktopBridge)process.exit(2);console.log('QA_PREVIEW_CONTRACT_OK',c.releaseId,c.desktopBridge)})"

      - name: Confirm Intel runner parity
        run: |
          test "$(uname -m)" = "x86_64"
          sw_vers
          uname -m

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "desktop 2/package-lock.json"

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce release trust policy
        run: node scripts/verify-release-trust.mjs

      - name: Enforce publisher trust policy
        run: node scripts/verify-publisher-trust.mjs

      - name: Audit production dependency supply chain
        run: npm audit --omit=dev --audit-level=high

      - name: Run clean-runtime certification against QA-bound source
        run: npm run verify

      - name: Build universal macOS app, DMG and ZIP
        run: npm run dist:mac

      - name: Build deterministic Apple replacement PKG
        run: npm run dist:mac:pkg

      - name: Enforce installer size budget
        run: node scripts/audit-artifact-sizes.mjs dist

      - name: Install over stale v1.1.8 and launch the installed app
        run: bash scripts/test-macos-pkg.sh

      - name: Reinstall and prove actual app passes selected Meet contract
        run: bash scripts/test-live-meet-contract.sh

      - name: Upload manual-QA DMG
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-macos-dmg-qa
          path: desktop 2/dist/*.dmg
          if-no-files-found: error
          retention-days: 1

      - name: Upload manual-QA PKG
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-macos-pkg-qa
          path: desktop 2/dist/*.pkg
          if-no-files-found: error
          retention-days: 1

      - name: Upload manual-QA ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dominionstar-meet-macos-zip-qa
          path: |
            desktop 2/dist/*.zip
            desktop 2/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
