name: Author Native Media Permission Hotfix

on:
  push:
    branches:
      - fix/native-media-permissions-v1.2.2
    paths:
      - .github/workflows/_author-native-media-permissions.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/native-media-permissions-v1.2.2
          fetch-depth: 0

      - name: Apply native media permission bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              p.write_text(text.replace(old,new,1))

          main='desktop 2/src/main-v2.mjs'
          replace_once(main,
              'const DESKTOP_BRIDGE_VERSION = 12;',
              'const DESKTOP_BRIDGE_VERSION = 13;')

          replace_once(main,
              'function resolveDeepLink(value) {',
              '''function nativeMediaPermissionSnapshot() {
            const granted = { platform: process.platform, camera: 'granted', microphone: 'granted' };
            if (process.platform !== 'darwin') return granted;
            const status = kind => {
              try { return systemPreferences.getMediaAccessStatus(kind); }
              catch { return 'unknown'; }
            };
            return {
              platform: process.platform,
              camera: status('camera'),
              microphone: status('microphone')
            };
          }

          async function requestNativeMediaPermissions(kinds = []) {
            const requested = new Set(Array.isArray(kinds) ? kinds.map(String) : []);
            if (process.platform !== 'darwin') return nativeMediaPermissionSnapshot();
            for (const kind of ['camera', 'microphone']) {
              if (!requested.has(kind)) continue;
              let current = 'unknown';
              try { current = systemPreferences.getMediaAccessStatus(kind); } catch {}
              if (current !== 'not-determined') continue;
              try { await systemPreferences.askForMediaAccess(kind); } catch {}
            }
            return nativeMediaPermissionSnapshot();
          }

          function resolveDeepLink(value) {''')

          replace_once(main,
              "ipcMain.handle('desktop:runtime-info', (event) => {",
              '''ipcMain.handle('desktop:media-permissions', (event) => {
            if (!isMeetingMediaRoute(event.sender.getURL())) {
              return { ok: false, platform: process.platform, camera: 'denied', microphone: 'denied' };
            }
            return { ok: true, ...nativeMediaPermissionSnapshot() };
          });

          ipcMain.handle('desktop:request-media-permissions', async (event, kinds = []) => {
            if (!isMeetingMediaRoute(event.sender.getURL())) {
              return { ok: false, platform: process.platform, camera: 'denied', microphone: 'denied' };
            }
            const result = await requestNativeMediaPermissions(kinds);
            return { ok: true, ...result };
          });

          ipcMain.handle('desktop:runtime-info', (event) => {''')

          preload='desktop 2/src/preload.cjs'
          replace_once(preload,"const RELEASE_VERSION = '1.2.1';","const RELEASE_VERSION = '1.2.2';")
          replace_once(preload,'const BRIDGE_VERSION = 12;','const BRIDGE_VERSION = 13;')
          replace_once(preload,
              "  getCaptureStatus: () => ipcRenderer.invoke('desktop:capture-status'),",
              "  getCaptureStatus: () => ipcRenderer.invoke('desktop:capture-status'),\n  getMediaPermissions: () => ipcRenderer.invoke('desktop:media-permissions'),\n  requestMediaPermissions: (kinds = []) => ipcRenderer.invoke('desktop:request-media-permissions', Array.isArray(kinds) ? kinds.filter(kind => ['camera','microphone'].includes(String(kind))) : []),")

          pkg_path=Path('desktop 2/package.json')
          pkg=json.loads(pkg_path.read_text())
          if pkg.get('version') != '1.2.1':
              raise SystemExit(f"Unexpected desktop version {pkg.get('version')}")
          pkg['version']='1.2.2'
          pkg_path.write_text(json.dumps(pkg,indent=2)+"\n")

          lock_path=Path('desktop 2/package-lock.json')
          lock=json.loads(lock_path.read_text())
          lock['version']='1.2.2'
          if '' in lock.get('packages',{}): lock['packages']['']['version']='1.2.2'
          lock_path.write_text(json.dumps(lock,indent=2)+"\n")

          verify='desktop 2/scripts/verify-v2.mjs'
          replace_once(verify,
              "if (pkg.version !== '1.2.1') throw new Error(`Unexpected hosted-authority release version: ${pkg.version}`);",
              "if (pkg.version !== '1.2.2') throw new Error(`Unexpected hosted-authority release version: ${pkg.version}`);")
          replace_once(verify,
              "  \"ipcMain.handle('desktop:runtime-info'\",",
              "  \"ipcMain.handle('desktop:runtime-info'\",\n  \"ipcMain.handle('desktop:media-permissions'\",\n  \"ipcMain.handle('desktop:request-media-permissions'\",\n  \"systemPreferences.askForMediaAccess(kind)\",")
          replace_once(verify,
              "  'bridgeVersion: BRIDGE_VERSION'",
              "  'bridgeVersion: BRIDGE_VERSION',\n  'getMediaPermissions:',\n  'requestMediaPermissions:'")

          bridge='desktop 2/scripts/test-bridge-contract.mjs'
          p=Path(bridge); text=p.read_text()
          text=text.replace('bridgeVersion:12','bridgeVersion:13')
          text=text.replace('desktopBridge:12','desktopBridge:13')
          text=text.replace('bridgeVersion,12','bridgeVersion,13')
          text=text.replace('requiredDesktopBridge,12','requiredDesktopBridge,13')
          text=text.replace("invoke(channel){", "invoke(channel,...args){\n      if(channel==='desktop:media-permissions') return Promise.resolve({ok:true,platform:'darwin',camera:'not-determined',microphone:'granted'});\n      if(channel==='desktop:request-media-permissions'){\n        assert.deepEqual(Array.from(args[0]||[]),['camera']);\n        return Promise.resolve({ok:true,platform:'darwin',camera:'granted',microphone:'granted'});\n      }")
          marker="assert.ok(Object.isFrozen(desktop),'Exposed desktop contract must be immutable');"
          if marker not in text: raise SystemExit('bridge test insertion marker missing')
          text=text.replace(marker, marker+"\nassert.equal(typeof desktop.getMediaPermissions,'function','Native media permission status API must be exposed');\nassert.equal(typeof desktop.requestMediaPermissions,'function','Native media permission request API must be exposed');\nconst permissionStatus=await desktop.getMediaPermissions();\nassert.equal(permissionStatus.camera,'not-determined');\nconst permissionRequest=await desktop.requestMediaPermissions(['camera']);\nassert.equal(permissionRequest.camera,'granted');",1)
          p.write_text(text)
          PY

      - name: Verify authored desktop runtime
        shell: bash
        working-directory: "desktop 2"
        run: |
          set -euo pipefail
          node --check src/main-v2.mjs
          node --check src/preload.cjs
          node scripts/verify-v2.mjs
          node scripts/test-bridge-contract.mjs

      - name: Commit authored hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DominionStar CI Author"
          git config user.email "actions@users.noreply.github.com"
          git add "desktop 2/src/main-v2.mjs" "desktop 2/src/preload.cjs" "desktop 2/package.json" "desktop 2/package-lock.json" "desktop 2/scripts/verify-v2.mjs" "desktop 2/scripts/test-bridge-contract.mjs"
          git diff --cached --check
          git commit -m "Add native macOS camera and microphone permission bridge"
          git push origin HEAD:fix/native-media-permissions-v1.2.2
