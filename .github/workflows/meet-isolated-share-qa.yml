name: Meet isolated share QA
on:
  push:
    branches:
      - cleanup/meeting-ownership-audit-20261014
    paths:
      - 'meet-desktop/scripts/verify-live-share-gate-20261014.mjs'
      - 'meet-desktop/scripts/verify-capture-answer-replay-20261014.mjs'
      - 'meet-desktop/scripts/verify-physical-identity-layout-20261016.mjs'
      - 'meet-desktop/scripts/verify-physical-media-fallback-20261016.mjs'
      - 'meet-desktop/ui/webrtc-controller.js'
      - 'meet-desktop/ui/webrtc.css'
      - 'meet-desktop/ui/physical-media-qa-export.js'
      - 'meet-desktop/ui/index.html'
      - 'meet-desktop/ui/profile-photo-fallback.js'
      - 'meet-desktop/ui/zoom-participants-reference-2.0.41.js'
      - '.github/workflows/meet-isolated-share-qa.yml'
  workflow_dispatch:
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Approved participant identity/layout static guard
        run: node meet-desktop/scripts/verify-physical-identity-layout-20261016.mjs
      - name: Remote media fallback and audio recovery regressions
        run: node meet-desktop/scripts/verify-physical-media-fallback-20261016.mjs
      - name: Screen-share gate self test
        run: node meet-desktop/scripts/verify-live-share-gate-20261014.mjs --self-test
      - name: Capture SDP answer replay
        run: node meet-desktop/scripts/verify-capture-answer-replay-20261014.mjs
      - name: Screen-share diagnostics unit simulation
        run: node meet-desktop/scripts/verify-two-device-media-progress-20261014.mjs
